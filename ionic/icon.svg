<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="นครผลึกเกลือ">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8EC"/><stop offset="1" stop-color="#EAE4C6"/>
    </linearGradient>
    <radialGradient id="p" cx="34%" cy="30%" r="72%">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset=".42" stop-color="#F2994A"/><stop offset="1" stop-color="#B84418"/>
    </radialGradient>
    <radialGradient id="n" cx="34%" cy="30%" r="72%">
      <stop offset="0" stop-color="#fff" stop-opacity=".8"/>
      <stop offset=".42" stop-color="#4E9370"/><stop offset="1" stop-color="#26603C"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- ผลึกไอออนิก 2x2 · ไอออนบวกกับไอออนลบเรียงสลับกันทุกทิศ -->
  <g stroke="#04261E" stroke-opacity=".14" stroke-width="8">
    <line x1="168" y1="168" x2="344" y2="168"/><line x1="168" y1="344" x2="344" y2="344"/>
    <line x1="168" y1="168" x2="168" y2="344"/><line x1="344" y1="168" x2="344" y2="344"/>
  </g>
  <circle cx="168" cy="168" r="58" fill="url(#p)" stroke="#B84418" stroke-width="6"/>
  <circle cx="344" cy="168" r="66" fill="url(#n)" stroke="#26603C" stroke-width="6"/>
  <circle cx="168" cy="344" r="66" fill="url(#n)" stroke="#26603C" stroke-width="6"/>
  <circle cx="344" cy="344" r="58" fill="url(#p)" stroke="#B84418" stroke-width="6"/>
  <g fill="#fff" font-family="sans-serif" font-weight="700" font-size="58" text-anchor="middle">
    <text x="168" y="188">+</text><text x="344" y="188">−</text>
    <text x="168" y="364">−</text><text x="344" y="364">+</text>
  </g>
</svg>
