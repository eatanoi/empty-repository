function stageFormula(){
  let labWrong = 0, matchWrong = 0;
  // สุ่มจากคลัง 15 คู่ มาเล่นรอบละ 9 คู่ · กับดักลดทอน (กลุ่ม d) ติดมาทุกรอบเพราะเป็นจุดที่พลาดกันมากที่สุด
  const SET = pickByGroup(BAL_SET, { a:2, b:4, c:2, d:1 });
  const MSET = pickSome(NAME_M, 5), HSET = pickSome(NAME_H, 5);
  drawLab();

  function drawLab(){
    app.innerHTML = stageShell('formula', `
      <div class="note">🎯 <b>ช่วงที่ 1:</b> ปรับจำนวนไอออนให้<b>ประจุรวมเป็นศูนย์</b> แล้วกดตรวจ
        — ทำให้ครบ ${SET.length} คู่
        <span class="small muted">(สูตรด้านบนจะเปลี่ยนตามที่ปรับให้เห็นทันที)</span></div>
      <div class="note small">🎲 สุ่มมา <b>${SET.length} คู่</b> จากคลัง <b>${BAL_SET.length} คู่</b> — เล่นซ้ำจะได้ชุดใหม่</div>
      <div class="bar"><i id="pb" style="width:0%"></i></div>
      <div id="lab"></div>
      <div class="note key" style="margin-top:16px">
        💡 <b>กติกา 2 ข้อของสูตรไอออนิก</b><br>
        1. <b>ประจุรวมเป็นศูนย์</b> — จำนวนประจุบวกต้องเท่ากับจำนวนประจุลบพอดี<br>
        2. <b>อัตราส่วนอย่างต่ำ</b> — Mg₂O₂ ประจุเป็นศูนย์ก็จริง แต่ต้องลดเหลือ MgO
      </div>
    `);
    balanceLab('lab', 'pb', SET, wrong=>{
      labWrong = wrong; toast('ดุลประจุครบแล้ว! ไปช่วงที่ 2 กันต่อ'); setTimeout(()=>drawRound(MSET,2,()=>drawRound(HSET,3,drawQuiz)), 900);
    });
  }

  /* จับคู่สองรอบ รอบแรกปานกลาง รอบสองยาก · แต่ละรอบสุ่มการ์ดมา 5 ใบจากคลังของชุดนั้น */
  function drawRound(set, no, next){
    const hard = no===3;
    const pool = hard ? NAME_H : NAME_M;
    app.innerHTML = stageShell('formula', `
      <div class="note">🎯 <b>ช่วงที่ ${no}${hard?' · ชุดยาก':''}:</b>
        แตะชื่อสารในสำรับ แล้วแตะการ์ดสูตรที่ตรงกัน — ให้ครบ ${set.length} คู่
        <span class="small muted">(อ่านสูตรแล้วแยกไอออนเอง การ์ดจะเฉลยให้หลังตอบถูก)</span></div>
      <div class="note small">🎲 สุ่มมา <b>${set.length} สาร</b> จากคลัง <b>${pool.length} สาร</b> — เล่นซ้ำจะได้ชุดใหม่</div>
      <div class="bar"><i id="pb" style="width:0%"></i></div>
      ${matchBoard(set, 'all')}
      <div class="feedback" id="fb"></div>
      <div class="note key" style="margin-top:16px">
        💡 <b>กติกาเรียกชื่อ:</b> ชื่อ<b>ไอออนบวก</b> + ชื่อ<b>ไอออนลบ</b> · ไม่ใส่คำอุปสรรคบอกจำนวน<br>
        ไอออนลบอะตอมเดี่ยวลงท้าย <b>-ไอด์</b> (คลอไรด์ ออกไซด์ ซัลไฟด์) ·
        ไอออนกลุ่มที่มีออกซิเจนมักลงท้าย <b>-เอต</b> (ซัลเฟต ไนเทรต คาร์บอเนต ฟอสเฟต)<br>
        โลหะที่มีประจุได้หลายค่าต้องกำกับ<b>เลขโรมัน</b> เช่น ไอร์ออน(III) · คอปเปอร์(II)
      </div>
    `);
    bindMatch(set, wrong=>{
      matchWrong += wrong;
      toast(hard ? 'ผ่านชุดยากแล้ว! ไปตอบคำถามกันต่อ' : 'เยี่ยม! ไปชุดที่ยากขึ้นกันต่อ');
      setTimeout(next, 900);
    });
  }

  function drawQuiz(){
    app.innerHTML = stageShell('formula', `
      <div class="note">🎯 <b>ช่วงที่ 4:</b> ตอบคำถามเรื่องสูตรและการเรียกชื่อให้ครบ ${NAME_Q.length} ข้อ</div>
      <div class="bar"><i id="pb" style="width:0%"></i></div>
      <div id="qhost"></div>
    `);
    quizRun(NAME_Q, 'qhost', qWrong=>{
      const miss = labWrong + matchWrong + qWrong;
      const got = miss<=3?3:miss<=7?2:1;
      stageMiss = miss;
      finishStage('formula', got, 85-Math.min(miss*4,50), `

          • สูตรมาจากกติกาเดียว — <b>ประจุรวมเป็นศูนย์</b> แล้วลดให้เป็น<b>อัตราส่วนอย่างต่ำ</b><br>

          • ชื่อ = ชื่อ<b>ไอออนบวก</b> ตามด้วยชื่อ<b>ไอออนลบ</b> · <b>ไม่ใส่คำอุปสรรค</b>บอกจำนวน<br>
          • โลหะที่มีประจุได้หลายค่าต้องกำกับ<b>เลขโรมัน</b> บอกประจุ เช่น คอปเปอร์(II)</div>
        <div class="note miss">🔴 <b>ระวังเข้าใจผิด:</b> เลขโรมันบอก<b>ประจุของไอออนโลหะ</b> ไม่ใช่จำนวนอะตอม
          — Fe₂(SO₄)₃ อ่านว่า ไอร์ออน<b>(III)</b> ซัลเฟต ไม่ใช่ ไอร์ออน(II)</div>
        <div class="note">🔵 <b>ต่อยอด:</b> วิธี “ไขว้ประจุ” ใช้ได้เร็วดี แต่ต้อง<b>ลดทอนอัตราส่วนเสมอ</b>
          — Mg²⁺ กับ O²⁻ ไขว้กันได้ Mg₂O₂ ซึ่งต้องลดเหลือ <b>MgO</b></div>
        <div class="small muted">ตอบผิดทั้งหมด ${miss} ครั้ง</div>`);
    });
  }
}

  { q:'สารประกอบไอออนิกบางชนิด เช่น CaCO₃ และ BaSO₄ ละลายน้ำได้น้อยมาก เพราะเหตุใด',
    o:['เพราะพลังงานแลตทิซสูงมากจนพลังงานไฮเดรชันเอาชนะไม่ไหว',
       'เพราะโมเลกุลน้ำไม่มีขั้ว จึงดึงไอออนออกจากผลึกไม่ได้',
       'เพราะสารเหล่านี้ไม่แตกตัวเป็นไอออน จึงเป็นสารโคเวเลนต์',
       'เพราะไอออนของสารเหล่านี้มีขนาดเล็กเกินกว่าน้ำจะล้อมได้'],
    a:0, e:'ไอออนประจุ <b>2+</b> กับ <b>2−</b> ทำให้พลังงานแลตทิซสูงมาก น้ำดึงไอออนออกมาไม่ไหว<br>' +
      'น้ำเป็นโมเลกุล<b>มีขั้ว</b> (ไม่ใช่ไม่มีขั้ว) และ CaCO₃ ก็เป็นสารประกอบไอออนิกจริง เพียงแต่ละลายน้อย' }
];

function stageEnergy(){
  let orderWrong = 0, matchWrong = 0;
  drawOrder();

  function drawOrder(){
    app.innerHTML = stageShell('energy', `
      <div class="note">🎯 <b>ช่วงที่ 1:</b> เรียงขั้นตอนของ<b>วัฏจักรบอร์น–ฮาเบอร์</b>ในการเกิด NaCl(s)
        จากธาตุ ให้ถูกลำดับทั้ง ${BH_STEPS.length} ขั้น</div>
      <div class="bar"><i id="pb" style="width:0%"></i></div>
      ${orderBoard(BH_STEPS, 'เริ่มจากโลหะโซเดียมที่เป็นของแข็ง →')}
      <div class="feedback" id="fb"></div>
      <div class="note" style="margin-top:16px">
        🔵 <b>ลำดับความคิด:</b> ทำโลหะให้เป็น<b>อะตอมแก๊ส</b>ก่อน → ดึงอิเล็กตรอนออกเป็น<b>ไอออนบวก</b> →
        แยกอโลหะเป็นอะตอมเดี่ยว → ให้อโลหะ<b>รับอิเล็กตรอน</b> → สุดท้ายจึงให้ไอออนมาเรียงเป็น<b>ผลึก</b>
      </div>
    `);
    bindOrder(BH_STEPS, wrong=>{
      orderWrong = wrong; toast('เรียงถูกทั้งวัฏจักร! ไปช่วงที่ 2 กันต่อ'); setTimeout(drawMatch, 1000);
    });
  }

  function drawMatch(){
    app.innerHTML = stageShell('energy', `
      <div class="note">🎯 <b>ช่วงที่ 2:</b> จับคู่สารกับ<b>พลังงานแลตทิซ</b>ของมัน — ให้ครบ ${LE_PAIRS.length} คู่
        <span class="small muted">(ดูที่ประจุก่อน แล้วจึงดูขนาดไอออน)</span></div>
      <div class="bar"><i id="pb" style="width:0%"></i></div>
      ${matchBoard(LE_PAIRS, 'desc')}
      <div class="feedback" id="fb"></div>
      <div class="note key" style="margin-top:16px">
        💡 <b>กติกาเทียบพลังงานแลตทิซ</b><br>
        1. ดู<b>ประจุ</b>ก่อนเสมอ — ประจุมากขึ้นทำให้ค่าพุ่งขึ้นหลายเท่า (2+/2− ≈ 4 เท่าของ 1+/1−)<br>
        2. ประจุเท่ากันจึงค่อยดู<b>ขนาดไอออน</b> — ไอออน<b>เล็กกว่า</b> เข้าใกล้กันได้มากกว่า ค่าจึงสูงกว่า
      </div>
    `);
    bindMatch(LE_PAIRS, wrong=>{
      matchWrong = wrong; toast('เยี่ยม! ไปช่วงสุดท้ายกันต่อ'); setTimeout(drawQuiz, 900);
    });
  }

  function drawQuiz(){
    app.innerHTML = stageShell('energy', `
      <div class="note">🎯 <b>ช่วงที่ 3:</b> ตอบคำถามเรื่องพลังงานให้ครบ ${EN_Q.length} ข้อ</div>
      <div class="bar"><i id="pb" style="width:0%"></i></div>
      <div id="qhost"></div>
    `);
    quizRun(EN_Q, 'qhost', qWrong=>{
      const miss = orderWrong + matchWrong + qWrong;
      const got = miss<=2?3:miss<=5?2:1;
      stageMiss = miss;
      finishStage('energy', got, 85-Math.min(miss*6,50), `
        <div class="note key">🟡 <b>สรุปที่ต้องจำ</b><br>
          • ขั้นต้น ๆ ของการเกิดสารประกอบไอออนิก<b>ดูดพลังงาน</b> (ระเหิด · ไอออไนเซชัน · สลายพันธะ)<br>
          • <b>พลังงานแลตทิซ</b>คือขั้นที่คายมากที่สุด และเป็นตัวทำให้ ΔH รวม<b>ติดลบ</b><br>
          • พลังงานแลตทิซ<b>สูงขึ้น</b>เมื่อ <b>ประจุมากขึ้น</b> หรือ <b>ไอออนเล็กลง</b><br>
          • การละลาย: ถ้า<b>พลังงานแลตทิซ &gt; พลังงานไฮเดรชัน</b> จะดูดความร้อน ภาชนะเย็นลง</div>
        <div class="note miss">🔴 <b>ระวังเข้าใจผิด:</b> ΔH ติดลบแปลว่า<b>คาย</b>พลังงาน รอบข้าง<b>ร้อนขึ้น</b>
          — ไม่ใช่เย็นลง · ที่เย็นลงคือกรณี ΔH เป็นบวกอย่างการละลาย NH₄NO₃</div>
        <div class="note">🔵 <b>ต่อยอด:</b> พลังงานแลตทิซที่สูงมากนี่เองคือคำอธิบายว่าทำไม MgO
          หลอมเหลวที่ 2,852 °C ขณะที่ NaCl หลอมที่ 801 °C — ต่อกันในด่านสมบัติของสาร</div>
        <div class="small muted">ตอบผิดทั้งหมด ${miss} ครั้ง</div>`);
    });
  }
}
/* =========================================================================
   ด่าน 5 — คลังสมบัติสาร
   สมบัติของสารประกอบไอออนิกทุกข้อสืบกลับไปที่เรื่องเดียว คือแรงดึงดูดระหว่างประจุ
   ช่วงแรกจึงเป็นการทดลองตอกผลึกให้เห็นกับตาว่า "เปราะ" เกิดจากประจุเหมือนกันมาเจอกัน
   ========================================================================= */

/* ทดลองเลื่อนระนาบผลึก · ก่อนเลื่อนไอออนสลับกันจึงดึงดูด หลังเลื่อนหนึ่งช่องประจุจะตรงกันจึงผลัก */
function brittleLab(hostId, onDone){
  const host = document.getElementById(hostId);
  const COLS = 6, ROWS = 4, GAP = 52, R = 17;
  const SPLIT = 34;                     // ช่องว่างระหว่างสองระนาบ เผื่อที่ให้วาดลูกศรบอกแรง
  const VB_W = COLS*GAP + 60, VB_H = ROWS*GAP + 70 + SPLIT;
  const rowY = r => 40 + r*GAP + (r >= ROWS/2 ? SPLIT : 0);
  let shift = 0, answered = false;      // shift = ระยะที่ระนาบบนถูกเลื่อน (หน่วยช่อง)

  host.innerHTML = `<div class="lab">
    <div class="labtop">
      <div><span class="fml">ผลึก NaCl</span> <span class="nm">ทดลองออกแรงตอกให้ระนาบเลื่อน</span></div>
      <div class="cnt" id="bcnt">ยังไม่ได้ตอก</div>
    </div>
    <div class="molwrap" style="max-width:520px">
      <svg class="tsvg" id="brit" viewBox="0 0 ${VB_W} ${VB_H}"
           aria-label="แผนภาพผลึกไอออนิกก่อนและหลังเลื่อนระนาบ"></svg>
    </div>
    <div class="palette">
      <button class="btn gold sm" id="hit">🔨 ตอกให้ระนาบบนเลื่อนไป 1 ช่อง</button>
      <button class="btn ghost sm" id="rst">↺ เริ่มใหม่</button>
    </div>
    <div class="feedback" id="brfb"></div>
    <div id="brq"></div>
  </div>`;
  const svg = document.getElementById('brit'), fb = document.getElementById('brfb');

  function draw(){
    const half = ROWS/2;
    let g = `<defs>
      <radialGradient id="gb-c" cx="34%" cy="30%" r="72%">
        <stop offset="0%" stop-color="#fff" stop-opacity=".85"/>
        <stop offset="42%" stop-color="#F2994A"/><stop offset="100%" stop-color="#B84418"/></radialGradient>
      <radialGradient id="gb-a" cx="34%" cy="30%" r="72%">
        <stop offset="0%" stop-color="#fff" stop-opacity=".8"/>
        <stop offset="42%" stop-color="#4E9370"/><stop offset="100%" stop-color="#26603C"/></radialGradient>
    </defs>`;
    // เส้นแบ่งระนาบที่ถูกเลื่อน
    const splitY = (rowY(half-1) + rowY(half))/2;
    g += `<line class="britsplit" x1="8" y1="${splitY}" x2="${VB_W-8}" y2="${splitY}"/>`;
    for(let r=0;r<ROWS;r++){
      const top = r < half;
      const dx = top ? shift*GAP : 0;
      for(let c=0;c<COLS;c++){
        const x = 40 + c*GAP + dx, y = rowY(r);
        if(x < 12 || x > VB_W-12) continue;           // ส่วนที่เลื่อนพ้นขอบผลึกออกไปแล้ว
        const pos = (r+c)%2===0;                       // ไอออนบวกอยู่ตำแหน่งที่ผลรวมพิกัดเป็นคู่
        g += `<circle class="ionb" cx="${x}" cy="${y}" r="${R}"
                fill="url(#gb-${pos?'c':'a'})" stroke="${pos?'#B84418':'#2F7D4F'}" stroke-width="1.6"/>
              <text class="britq" x="${x}" y="${y}">${pos?'+':'−'}</text>`;
      }
    }
    /* เครื่องหมายบอกแรงระหว่างสองระนาบที่ประกบกัน
       หลังเลื่อนไปแล้ว ไอออนที่มาอยู่เหนือคอลัมน์ c คือตัวที่เดิมอยู่คอลัมน์ c−shift
       ต้องเทียบประจุกับตัวนั้น ไม่ใช่ตัวที่เคยอยู่ตรงคอลัมน์ c */
    const rTop = half-1, rBot = half;
    for(let c=0;c<COLS;c++){
      const src = c - shift;                      // คอลัมน์เดิมของไอออนบนที่ตอนนี้มาอยู่เหนือคอลัมน์ c
      if(src < 0 || src >= COLS) continue;        // ตรงนี้ระนาบบนเลื่อนพ้นไปแล้ว ไม่มีคู่ให้เทียบ
      const x = 40 + c*GAP;
      if(x < 12 || x > VB_W-12) continue;
      const same = ((rTop+src)%2===0) === ((rBot+c)%2===0);
      const y1 = rowY(rTop) + R + 5, y2 = rowY(rBot) - R - 5, ym = (y1+y2)/2;
      // หัวลูกศรสามเหลี่ยม · dir −1 ชี้ขึ้น · dir +1 ชี้ลง
      const head = (y, dir)=> `<path d="M${x-5.5},${(y-dir*7).toFixed(1)} L${x+5.5},${(y-dir*7).toFixed(1)} L${x},${y.toFixed(1)} Z"/>`;
      g += same
        // ประจุเหมือนกัน → ลูกศรชี้ออกจากกัน (ผลัก)
        ? `<g class="repel"><line x1="${x}" y1="${(ym-2).toFixed(1)}" x2="${x}" y2="${(y1+7).toFixed(1)}"/>
             ${head(y1, -1)}
             <line x1="${x}" y1="${(ym+2).toFixed(1)}" x2="${x}" y2="${(y2-7).toFixed(1)}"/>
             ${head(y2, 1)}</g>`
        // ประจุตรงข้าม → ลูกศรชี้เข้าหากัน (ดึงดูด)
        : `<g class="attract"><line x1="${x}" y1="${y1.toFixed(1)}" x2="${x}" y2="${(ym-7).toFixed(1)}"/>
             ${head(ym-2, 1)}
             <line x1="${x}" y1="${y2.toFixed(1)}" x2="${x}" y2="${(ym+7).toFixed(1)}"/>
             ${head(ym+2, -1)}</g>`;
    }
    g += `<text class="britcap" x="${VB_W/2}" y="${VB_H-14}">${shift
      ? 'ระนาบเลื่อนแล้ว · ประจุเหมือนกันมาอยู่ตรงกัน → ผลักกัน ผลึกแตก'
      : 'ผลึกปกติ · ประจุตรงข้ามอยู่ตรงกัน → ดึงดูดกัน ผลึกแข็งแรง'}</text>`;
    svg.innerHTML = g;
    document.getElementById('bcnt').textContent = shift ? 'ตอกแล้ว · ผลึกแตก' : 'ยังไม่ได้ตอก';
  }

  document.getElementById('rst').onclick = ()=>{
    shift = 0; fb.className='feedback'; draw();
  };
  document.getElementById('hit').onclick = ()=>{
    if(shift){ return; }
    shift = 1; draw();
    fb.className='feedback show bad';
    fb.innerHTML = `💥 <b>ผลึกแตกออกเป็นสองท่อน!</b> พอระนาบบนเลื่อนไปหนึ่งช่อง
      ไอออน<b>ประจุเหมือนกัน</b>ก็มาอยู่ตรงกันพอดี แรงดึงดูดกลายเป็น<b>แรงผลัก</b> ทันที
      ผลึกจึงแยกออกตามระนาบนั้น`;
    if(!answered) askQ();
  };

  function askQ(){
    const box = document.getElementById('brq');
    const Q = {
      q:'จากการทดลองนี้ เหตุใด<b>โลหะ</b>จึงตีแผ่เป็นแผ่นได้ ขณะที่<b>ผลึกไอออนิก</b>แตก',
      o:['เพราะในโลหะมีทะเลอิเล็กตรอนคอยยึดไอออนบวกไว้ ระนาบจึงเลื่อนแล้วยังยึดกันได้',
         'เพราะไอออนบวกในโลหะมีขนาดเล็กกว่าไอออนในผลึกเกลือมาก',
         'เพราะพันธะโลหะแข็งแรงกว่าพันธะไอออนิกจึงไม่ขาดง่าย',
         'เพราะโลหะมีจุดหลอมเหลวสูงกว่าผลึกไอออนิกอยู่มาก'],
      a:0,
      e:'ในโลหะ ไอออนบวกลอยอยู่ใน<b>ทะเลอิเล็กตรอน</b>ที่เคลื่อนที่ได้ เลื่อนระนาบไปแล้วอิเล็กตรอนก็ยังยึดไว้เหมือนเดิม จึง<b>ตีแผ่ได้</b><br>' +
        'ส่วนผลึกไอออนิกมีตำแหน่งประจุ<b>ตายตัว</b> เลื่อนเมื่อไรประจุเหมือนกันจะมาเจอกันแล้วผลักจน<b>แตก</b><br>' +
        'สังเกตว่าพันธะไอออนิก<b>แข็งแรงมาก</b> (จุดหลอมเหลวสูง) แต่ก็ยัง<b>เปราะ</b> — แข็งแรงกับเปราะเป็นคนละเรื่องกัน'
    };
    box.innerHTML = `<div class="scene" style="margin-top:14px">
      <div style="font-weight:800;font-size:.95rem">${Q.q}</div>
      <div class="opts">${Q.o.map((o,j)=>`<div class="opt" data-i="${j}">${o}</div>`).join('')}</div>
      <div class="feedback" id="bqfb"></div>
    </div>`;
    box.querySelectorAll('.opt').forEach(op=>{
      op.onclick = ()=>{
        if(answered) return;
        answered = true;
        const j = +op.dataset.i, ok = j===Q.a;
        box.querySelectorAll('.opt').forEach((x,k)=>{
          x.classList.add('disabled');
          if(k===Q.a) x.classList.add('correct'); else if(k===j) x.classList.add('incorrect');
        });
        const f = box.querySelector('#bqfb');
        f.className = 'feedback show ' + (ok?'good':'bad');
        f.innerHTML = (ok?'✅ ถูกต้อง! ':'❌ ยังไม่ใช่ ') + Q.e +
          `<div style="margin-top:12px"><button class="btn primary sm" id="bnx">ไปช่วงที่ 2 →</button></div>`;
        f.querySelector('#bnx').onclick = ()=> onDone(ok?0:1);
      };
    });
  }
  draw();
}

  { n:'แข็งแต่เปราะ ตอกแล้วแตกตามระนาบ', g:'i',

function stageProps(){
  let britWrong = 0, sortWrong = 0;
  drawBrittle();

  function drawBrittle(){
    app.innerHTML = stageShell('props', `
      <div class="note">🎯 <b>ช่วงที่ 1:</b> ทดลองตอกผลึกให้ระนาบเลื่อน แล้วดูว่าเกิดอะไรขึ้นกับประจุที่มาอยู่ตรงกัน</div>
      <div id="lab"></div>
    `);
    brittleLab('lab', wrong=>{
      britWrong = wrong; toast('เห็นภาพแล้ว! ไปช่วงที่ 2 กันต่อ'); setTimeout(drawSort, 800);
    });
  }

  function drawSort(){
    const B = { i:{t:'🧊 สารประกอบไอออนิก<br><span class="small muted">ไอออนบวก + ไอออนลบ เรียงเป็นผลึก</span>'},
                v:{t:'🫧 สารโคเวเลนต์ที่เป็นโมเลกุล<br><span class="small muted">โมเลกุลเล็ก ๆ แยกจากกัน</span>'} };
    app.innerHTML = stageShell('props', `
      <div class="note">🎯 <b>ช่วงที่ 2:</b> แตะข้อความ แล้วแตะกล่องที่ถูกต้อง — จัดให้ครบ ${PROP_ITEMS.length} ชิ้น</div>
      <div class="bar"><i id="pb" style="width:0%"></i></div>
      <div class="bank" id="pool">
        ${shuffle(PROP_ITEMS).map(it=>`<div class="tok" data-n="${it.n}">${it.n}</div>`).join('')}
      </div>
      <div class="buckets" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
        ${Object.entries(B).map(([k,v])=>`<div class="bucket" data-g="${k}">
          <h4>${v.t}</h4><div class="items" id="items-${k}"></div></div>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
      <div class="note" style="margin-top:16px">
        🔵 <b>คำถามที่ใช้ตัดสินได้เสมอ:</b> หลอมเหลวแล้ว<b>นำไฟฟ้าไหม</b>?
        ถ้านำ → มีไอออนอิสระ = <b>ไอออนิก</b> · ถ้าไม่นำ → ยังเป็นโมเลกุลเป็นกลาง = <b>โคเวเลนต์</b>
      </div>
    `);
    bindBuckets(PROP_ITEMS, B, 'pb', 'fb', wrong=>{
      sortWrong = wrong; toast('เยี่ยม! ไปช่วงสุดท้ายกันต่อ'); setTimeout(drawQuiz, 800);
    });
  }

  function drawQuiz(){
    app.innerHTML = stageShell('props', `
      <div class="note">🎯 <b>ช่วงที่ 3:</b> ตอบคำถามเรื่องสมบัติของสารประกอบไอออนิกให้ครบ ${PROP_Q.length} ข้อ</div>
      <div class="bar"><i id="pb" style="width:0%"></i></div>
      <div id="qhost"></div>
    `);
    quizRun(PROP_Q, 'qhost', qWrong=>{
      const miss = britWrong + sortWrong + qWrong;
      const got = miss<=1?3:miss<=4?2:1;
      stageMiss = miss;
      finishStage('props', got, 80-Math.min(miss*7,45), `
        <div class="note key">🟡 <b>สรุปที่ต้องจำ — ทุกข้อมาจากแรงดึงดูดระหว่างประจุ</b><br>
          • <b>จุดหลอมเหลวสูง</b> เพราะแรงดึงดูดแผ่ต่อเนื่องทั้งผลึก · ประจุมากขึ้นยิ่งสูงขึ้น<br>
          • <b>แข็งแต่เปราะ</b> เพราะเลื่อนระนาบแล้วประจุเหมือนกันมาเจอกันจนผลัก<br>
          • <b>ของแข็งไม่นำไฟฟ้า · หลอมเหลวหรือละลายน้ำแล้วนำ</b> เพราะไอออนต้องเคลื่อนที่ได้จึงจะนำ<br>
          • <b>ละลายน้ำได้ดี</b> เพราะน้ำมีขั้วจึงล้อมและดึงไอออนออกจากผลึกได้</div>
        <div class="note miss">🔴 <b>ระวังเข้าใจผิด:</b> “เปราะ” ไม่ได้แปลว่า “พันธะอ่อน”
          — NaCl หลอมเหลวที่ 801 °C ซึ่งสูงมาก แต่ก็ยังตอกแล้วแตก เพราะเป็นคนละสมบัติกัน</div>
        <div class="note">🔵 <b>ต่อยอด:</b> การที่สารละลายไอออนิกนำไฟฟ้าได้คือหลักการของ<b>อิเล็กโทรไลต์</b>
          ที่ใช้ในแบตเตอรี่และเกลือแร่ในเครื่องดื่มกีฬา</div>
        <div class="small muted">ตอบผิดทั้งหมด ${miss} ครั้ง</div>`);
    });
  }
}

function renderCards(){
  const cats=[...new Set(CARDS.map(c=>c[0]))];
  let cat='ทั้งหมด', deck=[], idx=0, flipped=false;
  function build(){ deck=(cat==='ทั้งหมด'?CARDS:CARDS.filter(c=>c[0]===cat)); idx=0; flipped=false; }
  build();
  app.innerHTML = `
    <div class="stagehead">
      <div class="ic">🃏</div>
      <div style="flex:1;min-width:200px"><h2>การ์ดคำศัพท์</h2>
        <div class="sub">แตะการ์ดเพื่อพลิกดูความหมาย · ${CARDS.length} คำศัพท์ ไทย–อังกฤษ</div></div>
    </div>
    <div class="deckbar" id="deckbar">
      ${['ทั้งหมด',...cats].map(c=>`<button data-c="${c}" class="${c==='ทั้งหมด'?'on':''}">${c}</button>`).join('')}
    </div>
    <div class="fcstage"><div class="fc" id="fc"></div></div>
    <div class="fcnav">
      <button class="btn sm" id="prev">← ก่อนหน้า</button>
      <span class="count" id="count"></span>
      <button class="btn sm" id="next">ถัดไป →</button>
    </div>
    <div class="center" style="margin-top:12px">
      <button class="btn ghost sm" id="shuf">🔀 สลับการ์ด</button>
      <button class="btn primary sm" id="back">กลับแผนที่</button>
    </div>
    <div class="note" style="margin-top:20px">
      💡 <b>วิธีใช้ให้ได้ผล:</b> อ่านคำศัพท์แล้ว<b>พูดนิยามออกมาเองก่อน</b> จึงค่อยพลิกดูเฉลย (active recall)
    </div>`;
  const fc=document.getElementById('fc'), cnt=document.getElementById('count');
  function draw(){
    const c=deck[idx];
    if(!c){ fc.innerHTML='<div class="side front"><div class="term">ไม่มีการ์ดในหมวดนี้</div></div>'; return; }
    fc.classList.remove('flip'); flipped=false;
    fc.innerHTML = `
      <div class="side front">
        <div class="tag">${c[0]}</div><div class="term">${c[1]}</div><div class="en">${c[2]}</div>
        <div class="hint">แตะเพื่อพลิก ↻</div>
      </div>
      <div class="side back">
        <div class="tag">${c[1]} · ${c[2]}</div><div class="def">${c[3]}</div>
        <div class="hint">แตะเพื่อพลิกกลับ ↻</div>
      </div>`;
    cnt.textContent = `${idx+1} / ${deck.length}`;
  }
  fc.onclick=()=>{ flipped=!flipped; fc.classList.toggle('flip',flipped); };
  document.getElementById('prev').onclick=()=>{ idx=(idx-1+deck.length)%deck.length; draw(); };
  document.getElementById('next').onclick=()=>{ idx=(idx+1)%deck.length; draw(); };
  document.getElementById('shuf').onclick=()=>{ deck=shuffle(deck); idx=0; draw(); toast('สลับการ์ดแล้ว'); };
  document.getElementById('back').onclick=renderMap;
  document.querySelectorAll('#deckbar button').forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll('#deckbar button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); cat=b.dataset.c; build(); draw();
    };
  });
  document.addEventListener('keydown', function nav(e){
    if(!document.getElementById('fc')){ document.removeEventListener('keydown',nav); return; }
    if(e.key==='ArrowRight') document.getElementById('next')?.click();
    if(e.key==='ArrowLeft')  document.getElementById('prev')?.click();
    if(e.key===' '){ e.preventDefault(); fc.click(); }
  });
  draw(); window.scrollTo({top:0,behavior:'smooth'});
}

const MAX_STARS = STAGES.length * 3;
function certNeed(){ return Math.ceil(MAX_STARS * CERT.pass); }
function certPassed(){
  const allPlayed = STAGES.every(st => (S.stars[st.id]||0) > 0);
  return allPlayed && totalStars() >= certNeed();
}
function certName(){
  const j = (typeof getJoin==='function') ? getJoin() : null;
  return localStorage.getItem('ion-cert-name') || (j && j.name) || '';
}
function certCardHtml(){
  const need=certNeed(), got=totalStars(), ok=certPassed();
  const pct=Math.min(100, Math.round(got/need*100));
  return `<div class="card ${ok?'':'lockcard'}" style="margin-top:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
      border-color:${ok?'rgba(242,103,22,.5)':'var(--line)'}">
    <div style="font-size:2rem">${ok?'🏅':'🔒'}</div>
    <div style="flex:1;min-width:200px">
      <div style="font-weight:800">เกียรติบัตร${ok?' — ผ่านเกณฑ์แล้ว!':''}</div>
      <div class="small muted">${ok
        ? `เรียนครบทุกด่านและได้ ${got}/${MAX_STARS} ดาว (เกณฑ์ ${Math.round(CERT.pass*100)}% = ${need} ดาว) — ใส่ชื่อแล้วบันทึกเกียรติบัตรได้เลย`
        : `เล่นให้ครบทั้ง ${STAGES.length} ด่าน และเก็บดาวให้ถึง <b>${need}/${MAX_STARS}</b> ดาว (${Math.round(CERT.pass*100)}%) · ตอนนี้ได้ ${got} ดาว`}</div>
      ${ok?'':`<div class="certprog"><i style="width:${pct}%"></i></div>`}
    </div>
    <button class="btn ${ok?'gold':''}" id="btnCert" ${ok?'':'disabled'}>รับเกียรติบัตร</button>
  </div>`;
}

/* วาดเกียรติบัตรลงบนแคนวาส (ใช้ภาพของโรงเรียนถ้ามี ถ้าไม่มีจะวาดกรอบสำรองให้) */
function drawCert(canvas, name, img){
  const W = img ? img.naturalWidth : 2000, H = img ? img.naturalHeight : 1400;
  canvas.width = W; canvas.height = H;
  const c = canvas.getContext('2d');
  c.fillStyle = '#fff'; c.fillRect(0,0,W,H);
  if(img){ c.drawImage(img, 0, 0, W, H); }
  else { certFallback(c, W, H); }
  // ---- ชื่อผู้เรียน (ย่อขนาดอัตโนมัติจนพอดีกรอบ) ----
  const maxW = W * CERT.nameW;
  let size = W * CERT.nameSize;
  const font = px => `700 ${px}px "Sukhumvit Set","Noto Sans Thai","IBM Plex Sans Thai",sans-serif`;
  c.font = font(size);
  while(c.measureText(name).width > maxW && size > W*0.012){ size *= 0.95; c.font = font(size); }
  c.fillStyle = img ? CERT.nameColor : (CERT.nameColorFallback || CERT.nameColor);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(name, W*CERT.nameX, H*CERT.nameY);
  return canvas;
}
/* กรอบสำรอง ใช้เมื่อยังไม่ได้วางไฟล์ cert-bg.png */
function certFallback(c, W, H){
  const g = c.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#FBF8EC'); g.addColorStop(1,'#EAE4C6');
  c.fillStyle = g; c.fillRect(0,0,W,H);
  c.strokeStyle = '#084A24'; c.lineWidth = W*0.012; c.strokeRect(W*0.03,H*0.04,W*0.94,H*0.92);
  c.strokeStyle = '#F26716'; c.lineWidth = W*0.004; c.strokeRect(W*0.045,H*0.062,W*0.91,H*0.876);
  c.textAlign='center'; c.fillStyle='#084A24';
  const f=(px,w=700)=>`${w} ${px}px "Sukhumvit Set","Noto Sans Thai",sans-serif`;
  c.font=f(W*0.045); c.fillText('เกียรติบัตรฉบับนี้ให้ไว้เพื่อแสดงว่า', W/2, H*0.30);
  c.fillStyle='#04261E'; c.font=f(W*0.028,400);
  c.fillText('ได้ผ่านการเรียนรู้ผ่านสื่ออิเล็กทรอนิกส์ (e-learning)', W/2, H*0.645);
  c.fillStyle='#D6350B'; c.font=f(W*0.022);
  c.fillText('หน่วยที่ 3 พันธะเคมี เรื่อง “พันธะไอออนิก”', W/2, H*0.70);
  c.fillText('สำหรับนักเรียนระดับชั้นมัธยมศึกษาปีที่ 4', W/2, H*0.745);
  c.fillStyle='#6B8A76'; c.font=f(W*0.022,400);
  c.fillText('ให้ไว้ ณ วันที่ ' + new Date().toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'}), W/2, H*0.82);
  // กรอบใส่ชื่อ
  const bx=W*0.5-W*0.26, by=H*CERT.nameY-H*0.055, bw=W*0.52, bh=H*0.11, r=bh/2;
  const gg=c.createLinearGradient(bx,0,bx+bw,0); gg.addColorStop(0,'#F7A8C4'); gg.addColorStop(1,'#F7C39C');
  c.fillStyle=gg; c.beginPath();
  c.moveTo(bx+r,by); c.arcTo(bx+bw,by,bx+bw,by+bh,r); c.arcTo(bx+bw,by+bh,bx,by+bh,r);
  c.arcTo(bx,by+bh,bx,by,r); c.arcTo(bx,by,bx+bw,by,r); c.closePath(); c.fill();
  c.strokeStyle='#2F7D4F'; c.lineWidth=W*0.003; c.stroke();
}

async function pushRow(row){
  const r = await fetch(SB_URL+'/rest/v1/scores', {
    method:'POST',
    headers:{ 'apikey':SB_ANON, 'Authorization':'Bearer '+SB_ANON,
              'Content-Type':'application/json', 'Prefer':'return=minimal' },
    body: JSON.stringify(row)
  });
  if(r.status===409) return;   // แถวนี้อยู่ในฐานข้อมูลแล้ว (uid ซ้ำ) ถือว่าส่งสำเร็จ เอาออกจากคิวได้
  if(!r.ok){
    let d=''; try{ d=(await r.text()).slice(0,140); }catch(e){}
    if(/23505|duplicate key/i.test(d)) return;   // ซ้ำเหมือนกัน แต่ฐานข้อมูลตอบมาคนละรหัส
    const err = new Error('http '+r.status+(d?' · '+d:'')); err.status = r.status; throw err;
  }
}
/* ส่งคะแนนที่ค้างอยู่ในคิว — ถ้าส่งไม่สำเร็จจะบอกให้รู้ ไม่เงียบหาย */
let lastSendErr = '';
function sendErrMsg(e){
  const s = e && e.status;
  if(s===401) return 'คีย์ของห้องไม่ถูกต้อง — แจ้งครูให้ตรวจการตั้งค่า';
  if(s===403) return 'ฐานข้อมูลปฏิเสธคะแนนนี้ — ห้องอาจถูกปิด หรือกฎความปลอดภัยไม่รับค่าที่ส่ง';
  if(s===404) return 'ไม่พบตารางคะแนนในฐานข้อมูล — แจ้งครูให้ตรวจการตั้งค่า';
  if(s===400) return 'รูปแบบข้อมูลไม่ตรงกับตารางคะแนน — แจ้งครูให้ตรวจคอลัมน์ในตาราง';
  return (e && e.message) ? e.message : 'เครือข่ายมีปัญหา';
}
/* ซ่อมแถวเก่าที่ค้างในคิวให้ตรงกับกติกาปัจจุบันก่อนส่ง
   (แถวที่ถูกเก็บไว้ตอนใช้เลขด่านชุดเก่า เช่น 21–26 จะถูกแปลงเป็น 1–6 ให้อัตโนมัติ) */
function fixRow(row){
  const r = Object.assign({}, row);
  if(typeof r.level === 'number' && r.level > 20) r.level = ((r.level - 1) % 10) + 1;
  r.stars   = Math.max(0, Math.min(3, Math.round(r.stars||0)));
  r.percent = Math.max(0, Math.min(100, Math.round(r.percent||0)));
  r.seconds = Math.max(0, Math.min(86400, Math.round(r.seconds||0)));
  r.misses  = Math.max(0, Math.min(9999, Math.round(r.misses||0)));
  r.attempt = Math.max(1, Math.min(9999, Math.round(r.attempt||1)));
  delete r.tries;                                   // ตัวนับความพยายาม เก็บไว้ในเครื่องเท่านั้น
  return r;
}
let flushing = false;
async function flushPending(opts){
  if(flushing) return;              // กันส่งซ้ำซ้อนตอนจบด่านพร้อมกับรอบส่งอัตโนมัติ
  if(!outbox().length) return;
  flushing = true;
  const tried = {};                 // uid -> จำนวนครั้งที่พยายามส่ง
  let failed = false, sent = 0, dropped = 0, stop = false;
  /* วนซ้ำจนคิวหมด เพราะระหว่างกำลังส่งอาจมีคะแนนเข้าคิวเพิ่ม
     (เช่นตอนกดเข้าร่วมห้องแล้วส่งดาวเก่าทุกด่านพร้อมกัน) */
  while(!stop){
    const q = outbox(); if(!q.length) break;
    const settled = new Set();      // uid ที่ส่งสำเร็จหรือทิ้งถาวรแล้วในรอบนี้
    let progressed = false;
    for(const row of q){
      if(stop) break;               // ปัญหาการตั้งค่า ส่งแถวที่เหลือต่อไปก็ไม่ผ่าน
      try{ await pushRow(fixRow(row)); settled.add(row.uid); sent++; progressed = true; }
      catch(e){
        failed = true; lastSendErr = sendErrMsg(e);
        const permanent = (e.status===400 || e.status===403 || e.status===422);
        tried[row.uid] = (row.tries||0) + 1;
        /* แถวที่ฐานข้อมูลไม่รับจริง ๆ จะถูกทิ้งหลังพยายาม 3 ครั้ง
           เพื่อไม่ให้แถวเดียวค้างจนบล็อกคะแนนที่เหลือทั้งคิว */
        if(permanent && tried[row.uid] >= 3){ settled.add(row.uid); dropped++; progressed = true; continue; }
        if(e.status===401 || e.status===404) stop = true;
      }
    }
    /* อ่านคิวใหม่อีกครั้ง แล้วเอาออกเฉพาะแถวที่จัดการเสร็จแล้ว
       คะแนนที่เพิ่งเข้าคิวระหว่างนี้จึงไม่หายไปพร้อมกับการเคลียร์คิว */
    const keep = outbox().filter(r=>!settled.has(r.uid));
    keep.forEach(r=>{ if(tried[r.uid]) r.tries = tried[r.uid]; });
    setOutbox(keep.slice(-200));
    if(!progressed) break;          // รอบนี้ส่งไม่ผ่านเลยสักแถว วนซ้ำไปก็ไม่ผ่าน
  }
  const left = outbox();
  flushing = false;
  renderClassChip();
  if(failed && !(opts && opts.quiet)){
    toast('⚠️ ส่งคะแนนไม่สำเร็จ · ' + lastSendErr + (dropped?(' · ข้ามที่ส่งไม่ได้ '+dropped+' รายการ'):''));
  }else if(!left.length && sent>1){
    toast('✅ ส่งคะแนนที่ค้างครบแล้ว ' + sent + ' รายการ');
  }
}

/* ---- สร้างแถวคะแนนของด่านที่เพิ่งจบ แล้วส่งให้ครู ---- */
function sendScore(stageId, starsGot, misses, seconds){
  const j = getJoin(); if(!j || !j.room || !j.name) return;
  const idx = STAGES.findIndex(x=>x.id===stageId);
  const st  = STAGES[idx] || { title: stageId };
  const row = {
    uid: j.sid+'-'+stageId+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),
    room: j.room, student: String(j.name).trim().slice(0,60), sid: j.sid,
    game: GAME_KEY,
    level: LEVEL_BASE + (idx>=0?idx+1:9),
    level_name: 'พันธะไอออนิก · ด่าน '+(idx+1)+' '+st.title,
    stars: starsGot, percent: Math.round(starsGot/3*100),
    score: starsGot, max_score: 3,
    seconds: Math.max(0, Math.min(seconds|0, 86400)),
    misses: Math.max(0, Math.min(misses|0, 9999)),
    total_stars: totalStars(),
    attempt: (S.plays && S.plays[stageId]) || 1,
    client_ts: new Date().toISOString()
  };
  const q = outbox(); q.push(row); setOutbox(q.slice(-200));
  flushPending();
}
/* ส่งดาวที่เคยได้ทั้งหมดตอนเพิ่งเข้าร่วมห้อง (นับเป็นครั้งที่ 1) */
function syncAllStars(){
  STAGES.forEach(st=>{
    const got = S.stars[st.id]||0; if(!got) return;
    sendScore(st.id, got, (S.miss&&S.miss[st.id])||0, (S.secs&&S.secs[st.id])||0);
  });
}

/* ---- ชิปสถานะชั้นเรียนบนหน้าแผนที่ ---- */

    };
  }else{
    slot.innerHTML = `<div class="classchip" id="joinBtn">🏫 เข้าร่วมชั้นเรียน (ส่งคะแนนให้ครู)</div>`;
    slot.querySelector('#joinBtn').onclick=openJoinModal;
  }
}

function openJoinModal(){
  const j = getJoin() || {};
  const bg=document.createElement('div'); bg.className='modalbg';
  bg.innerHTML=`<div class="modal">
    <h3>🏫 เข้าร่วมชั้นเรียน</h3>
    <div class="msub">กรอกรหัสห้องที่ครูให้ และชื่อของคุณ เพื่อส่งคะแนนให้ครูเห็น</div>
    <label>รหัสห้อง</label><input id="jcode" maxlength="12" placeholder="เช่น M401A" autocomplete="off" autocapitalize="characters" value="${escHtml(j.room||'')}">
    <label>ชื่อของคุณ (หรือ ชื่อ-เลขที่)</label><input id="jname" maxlength="40" placeholder="เช่น สมชาย เลขที่ 12" autocomplete="off" value="${escHtml(j.name||'')}">
    <div class="mmsg" id="jmsg"></div>
    <div class="mrow"><button class="btn ghost" id="jcancel">ยกเลิก</button><button class="btn primary" id="jok">เข้าร่วม</button></div>
    <div style="margin-top:10px;font-size:.72rem;color:var(--muted);text-align:center">เก็บเฉพาะรหัสห้อง ชื่อที่กรอก และผลการเล่น (ด่าน ดาว เวลา) เพื่อให้ครูติดตามความก้าวหน้าเท่านั้น<br>
      <a href="../privacy/" target="_blank" rel="noopener" style="color:var(--green);font-weight:700">อ่านนโยบายความเป็นส่วนตัว</a></div>
  </div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.addEventListener('click',e=>{ if(e.target===bg) close(); });
  bg.querySelector('#jcancel').onclick=close;
  const codeEl=bg.querySelector('#jcode'), nameEl=bg.querySelector('#jname'), msg=bg.querySelector('#jmsg');
  bg.querySelector('#jok').onclick=()=>{
    const room=(codeEl.value||'').trim().toUpperCase(); const name=(nameEl.value||'').trim();
    if(!room){ msg.className='mmsg err'; msg.textContent='กรอกรหัสห้องที่ครูให้'; return; }
    if(!name){ msg.className='mmsg err'; msg.textContent='กรอกชื่อของคุณ'; return; }
    const prev=getJoin();
    setJoin({ room, name, sid:(prev&&prev.sid)||newSid() });
    close(); renderClassChip(); toast('เข้าร่วมห้อง '+room+' แล้ว');
    syncAllStars();
  };
  setTimeout(()=>codeEl.focus(),50);
}

document.getElementById('btnHome').onclick = renderMap;
renderMap();
flushPending();
window.addEventListener('online', flushPending);   // กลับมาออนไลน์เมื่อไร ส่งคะแนนที่ค้างทันที

/* ---------- PWA: ลงทะเบียน service worker ให้เล่นซ้ำแบบออฟไลน์ ----------
   ทำงานเฉพาะเมื่อเปิดผ่านเว็บ (http/https) — เปิดไฟล์ตรง ๆ (file://) เกมก็ยังเล่นได้ */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
