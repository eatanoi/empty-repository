  function drawSort(){
    app.innerHTML = stageShell('builder', `
      <div class="note">🎯 <b>ช่วงที่ 1 · แท่นประกอบนิวคลีโอไทด์:</b> นิวคลีโอไทด์ 1 หน่วยประกอบด้วย
        <b>หมู่ฟอสเฟต · น้ำตาลดีออกซีไรโบส · ไนโตรจีนัสเบส</b><br>
        <b>ลากภาพชิ้นส่วนมาวางในช่องให้ถูกต้อง</b> แล้วประกอบให้ครบทั้ง 4 ชนิดของเบส
        <span class="small muted">(แตะชิ้นส่วนแล้วแตะช่องก็ได้)</span></div>
      <div class="bar"><i id="pb" style="width:0%"></i></div>
      <div id="nbhost"></div>
      <div class="feedback" id="fb"></div>
      <div id="nbshelf"></div>
      <div class="note" style="margin-top:16px">
        🔵 <b>ตัวช่วยจำ:</b> <b>พิวรีนตัวใหญ่</b> มีสองตัวคือ <b>A กับ G</b> ·
        <b>ไพริมิดีนตัวเล็ก</b> คือ <b>C กับ T</b> — ทุกคู่เบสจึงเป็น<b>ตัวใหญ่จับกับตัวเล็ก</b>
        ความกว้างของเกลียวจึงเท่ากันตลอด
      </div>
    `);
    nucleoLab('nbhost', 'nbshelf', wrong=>{
      sortWrong = wrong; toast('ประกอบครบสี่ชนิดแล้ว! ไปช่วงที่ 2'); setTimeout(drawMatch,1200);
    });
  }

  function drawMatch(){
    app.innerHTML = stageShell('builder', `
      <div class="note">🎯 <b>ช่วงที่ 2:</b> แตะชื่อศัพท์โครงสร้าง แล้วแตะการ์ดคำอธิบายที่ตรงกัน</div>
      <div class="bar"><i id="pb" style="width:0%"></i></div>
      ${matchBoard(DNA_PAIRS)}
      <div class="feedback" id="fb"></div>
    `);
    bindMatch(DNA_PAIRS, wrong=>{
      matchWrong = wrong; toast('จับคู่ครบแล้ว! ไปช่วงที่ 3'); setTimeout(drawQuiz,900);
    });
  }

  function drawQuiz(){
    app.innerHTML = stageShell('builder', `
      <div class="note">🎯 <b>ช่วงที่ 3:</b> ตอบคำถามเรื่องโครงสร้าง DNA ให้ครบ ${DNA_Q.length} ข้อ</div>
      <div class="bar"><i id="pb" style="width:0%"></i></div>
      <div id="qhost"></div>
    `);
    quizRun(DNA_Q, 'qhost', qWrong=>{
      const miss = sortWrong + matchWrong + qWrong;
      const got = miss<=2?3:miss<=5?2:1;
      stageMiss = miss;
      finishStage('builder', got, 85-Math.min(miss*7,55), `
        <div class="note key">🟡 <b>สรุปที่ต้องจำ</b><br>
          • นิวคลีโอไทด์ = <b>น้ำตาลดีออกซีไรโบส + ไนโตรจีนัสเบส + หมู่ฟอสเฟต</b><br>
          • <b>พิวรีน</b> = A, G (วงแหวนคู่) · <b>ไพริมิดีน</b> = C, T (วงแหวนเดี่ยว)<br>
          • <b>A–T ใช้ 2 พันธะไฮโดรเจน · G–C ใช้ 3 พันธะ</b><br>
          • สองสาย<b>สวนทางกัน (แอนติพาราเรล)</b> พันเป็น<b>เกลียวคู่</b><br>
          • กฎของ Chargaff: <b>A = T · G = C</b> แต่ <b>(A+T)/(G+C) ต่างกันในแต่ละสปีชีส์</b></div>
        <div class="note miss">🔴 <b>ระวังสับสน:</b> A = T และ G = C <b>ไม่ได้แปลว่าเบสทั้งสี่ชนิดมีเท่ากัน</b>
          — ยีสต์มี (A+T)/(G+C) = 1.79 ส่วนหนูมีเพียง 1.33 ต่างกันชัดเจน</div>
        <div class="small muted">ตอบผิดทั้งหมด ${miss} ครั้ง</div>`);
    });
  }
}

/* =========================================================================
   เครื่องจำลองดีเอ็นเอ 3 มิติ — เฮลิเคสคลายเกลียว แล้วลากนิวคลีโอไทด์
   มาเข้าคู่กับสายแม่แบบจนได้เกลียวคู่กลับมาเป็น DNA สองโมเลกุล
   เกลียวสร้างด้วย CSS 3D: แต่ละขั้นบันไดหมุนรอบแกน Y ทีละ DH_ANG องศา
   ========================================================================= */
const DH_SEQ  = ['T','A','C','G','G','A','T','C','A','T'];   /* สายแม่แบบ 3′(บน) → 5′(ล่าง) */
const DH_PAIR = { A:'T', T:'A', C:'G', G:'C' };
const DH_COLOR= { A:'#9CC78A', T:'#EE9A9A', C:'#F5DC8E', G:'#9CC2DE' };
const DH_NAME = { A:'อะดีนีน (A)', T:'ไทมีน (T)', C:'ไซโทซีน (C)', G:'กวานีน (G)' };
const DH_HB   = { A:2, T:2, C:3, G:3 };
const DH_STEP = 26, DH_ANG = 36;

/* hostId = กล่องเครื่องจำลอง · onDone(จำนวนที่เข้าคู่ผิด) */
function helixLab(hostId, onDone){
  const host = document.getElementById(hostId);
  let phase = 'intro', at = 0, wrong = 0, busy = false, pd = null;
  const made = [];

  const faces = k => `<span>${k}</span><span class="bk">${k}</span>`;
  function rungHTML(i){
    const t = DH_SEQ[i], n = made[i];
    const open = phase!=='intro';
    const right = n || (open ? null : DH_PAIR[t]);
    return `<div class="dh-rung${open && i===at && phase==='fill' ? ' active':''}" data-i="${i}"
        style="transform:translateY(${i*DH_STEP}px) rotateY(${i*DH_ANG}deg)">
      <div class="dh-bb old"></div>
      <div class="dh-base" style="background:${DH_COLOR[t]}">${faces(t)}</div>
      <div class="dh-base ${right ? (n?'fresh':'') : 'empty'}"
        style="${right ? `background:${DH_COLOR[right]}` : ''}">${right ? faces(right) : ''}</div>
      <div class="dh-bb ${right?'new':'new gone'}"></div>
    </div>`;
  }
  /* ลูกปัดแกนคั่นระหว่างขั้น ทำให้เห็นเป็นเกลียวต่อเนื่องแทนที่จะเป็นแท่งลอย ๆ */
  function halfHTML(i){
    const linked = phase==='intro' || (made[i] && made[i+1]);
    return [1/3, 2/3].map(f=>`<div class="dh-half"
        style="transform:translateY(${(i+f)*DH_STEP}px) rotateY(${(i+f)*DH_ANG}deg)">
      <div class="dh-bb old"></div>
      <div class="dh-bb new${linked?'':' gone'}"></div>
    </div>`).join('');
  }

  function helixInner(){
    return DH_SEQ.slice(0,-1).map((_,i)=>halfHTML(i)).join('')
         + DH_SEQ.map((_,i)=>rungHTML(i)).join('');
  }
  function stageHTML(){
    return `<div class="dh-stage" id="dhStage">
      <div class="dh ${phase==='final'?'dh-spin':''}" id="dhHelix">${helixInner()}</div>
      <div class="dh-end" style="top:2px">${phase==='intro'?'ปลายสายแม่แบบ 3′':'3′ แม่แบบ · 5′ สายใหม่'}</div>
      <div class="dh-end" style="bottom:4px">${phase==='intro'?'ปลายสายแม่แบบ 5′':'5′ แม่แบบ · 3′ สายใหม่'}</div>
    </div>`;
  }

  function stepText(){
    const steps = {
      intro:'🔓 <b>ขั้นที่ 1 · เฮลิเคส</b> — เอนไซม์เฮลิเคสจะทำลาย<b>พันธะไฮโดรเจน</b>ระหว่างคู่เบส คลายเกลียวและแยกสองสายออกจากกัน',
      fill :`✍️ <b>ขั้นที่ 3 · ดีเอ็นเอพอลิเมอเรส</b> — ต่อนิวคลีโอไทด์ทีละตัวจาก<b>ปลาย 5′ ลงไปหา 3′</b> ของสายใหม่
              · ตำแหน่งที่ ${at+1} จาก ${DH_SEQ.length} · แม่แบบตรงนี้คือ <b>${DH_NAME[DH_SEQ[at]]||''}</b>`,
      seal :'🧷 <b>ขั้นที่ 4 · ดีเอ็นเอไลเกส</b> — เข้าคู่ครบทุกตำแหน่งแล้ว เหลือให้ไลเกส<b>เชื่อมสายใหม่</b>ให้ต่อเนื่อง',
      final:'🎉 <b>ขั้นที่ 5</b> — ได้ DNA ที่มี<b>สายเดิม 1 สาย และสายใหม่ 1 สาย</b> นี่คือ<b>การจำลองแบบกึ่งอนุรักษ์</b>'
    };
    return steps[phase];
  }

  /* อัปเดตเฉพาะส่วนที่เปลี่ยน ไม่แตะ #dhHelix ทั้งก้อน เพื่อไม่ให้อนิเมชันหมุนเริ่มใหม่ */
  function refresh(){
    const h = document.getElementById('dhHelix'); if(h) h.innerHTML = helixInner();
    const st = host.querySelector('.dh-step'); if(st) st.innerHTML = stepText();
    const sq = host.querySelector('.dh-seq'); if(sq) sq.outerHTML = seqHTML();
  }

  function draw(){
    const acts = {
      intro:'<button class="btn" id="dhGo">🔓 ใช้เอนไซม์เฮลิเคสคลายเกลียว</button>',
      seal :'<button class="btn" id="dhSeal">🧷 ใช้ไลเกสเชื่อมสายใหม่</button>',
      final:'<div class="small muted">เกลียวคู่กำลังหมุนให้ดูรอบด้าน — สายส้มคือสายที่เพิ่งสร้างขึ้นใหม่</div>',
      fill :`<div class="dh-tray">
          ${['A','T','C','G'].map(k=>`<div class="dh-tok" data-k="${k}" role="button" tabindex="0"
              aria-label="${DH_NAME[k]}">
            <span class="dh-chip" style="background:${DH_COLOR[k]}">${k}</span>
            <span class="gl-cap">${DH_NAME[k]}</span></div>`).join('')}
        </div>
        <div class="small muted" style="margin-top:8px">ลากนิวคลีโอไทด์ไปวางบนเกลียว หรือแตะนิวคลีโอไทด์แล้วแตะเกลียวก็ได้</div>`
    };
    host.innerHTML = `
      <div class="dh-lab">
        <div class="dh-step">${stepText()}</div>
        <div class="dh-row">
          <div class="dh-panel">
            <h4>🧬 แบบจำลอง 3 มิติ</h4>
            ${stageHTML()}
          </div>
          <div class="dh-panel">
            <h4>🧰 โต๊ะทำงานของเอนไซม์</h4>
            ${acts[phase]}
            ${seqHTML()}
            <div class="dh-legend">
              <span class="dh-dot" style="background:#5C90A6"></span> แกนน้ำตาล–ฟอสเฟต<b>สายเดิม</b> ·
              <span class="dh-dot" style="background:#F26716"></span> แกน<b>สายใหม่</b><br>
              ${['A','T','C','G'].map(k=>
                `<span class="dh-dot" style="background:${DH_COLOR[k]}"></span> ${k}`).join(' · ')}
              — <b>A–T ใช้ 2 พันธะไฮโดรเจน · C–G ใช้ 3 พันธะ</b>
            </div>
          </div>
        </div>
      </div>`;
    bind();
  }

  function seqHTML(){
    const cell = (k, cls)=> k
      ? `<i class="${cls}" style="background:${DH_COLOR[k]}">${k}</i>`
      : `<i class="blank ${cls}">·</i>`;
    const newRow = DH_SEQ.map((t,i)=>{
      const k = phase==='intro' ? DH_PAIR[t] : made[i];
      return cell(k, phase==='fill' && i===at ? 'now' : '');
    }).join('');
    return `<div class="dh-seq">
      <div><b>สายแม่แบบ</b> 3′ ${DH_SEQ.map(t=>cell(t,'')).join('')} 5′</div>
      <div><b>สายใหม่</b> 5′ ${newRow} 3′</div>
    </div>`;
  }

  function say(cls, html){
    const fb = document.getElementById('fb');
    fb.className = 'feedback show ' + cls; fb.innerHTML = html;
  }

  function unwind(){
    if(busy) return;
    busy = true; phase = 'fill'; at = 0; draw();
    say('good', `🔓 <b>เฮลิเคสคลายเกลียวแล้ว</b> — พันธะไฮโดรเจนถูกทำลาย เหลือ<b>สายแม่แบบ</b>ให้สร้างสายใหม่<br>
      <span class="small">ขั้นที่ 2 · <b>ไพรเมอร์</b>เกาะที่จุดเริ่มต้นเรียบร้อยแล้ว พอลิเมอเรสจึงเริ่มต่อนิวคลีโอไทด์ได้</span>`);
    busy = false;
  }

  function place(k){
    if(busy || phase!=='fill') return;
    const want = DH_PAIR[DH_SEQ[at]];
    if(k !== want){
      wrong++;
      say('bad', `❌ ${DH_NAME[k]} เข้าคู่กับ<b>${DH_NAME[DH_PAIR[k]]}</b> ไม่ใช่${DH_NAME[DH_SEQ[at]]}<br>
        แม่แบบตำแหน่งนี้เป็น<b>${DH_NAME[DH_SEQ[at]]}</b> จึงต้องเข้าคู่กับ<b>${DH_NAME[want]}</b>
        ด้วยพันธะไฮโดรเจน <b>${DH_HB[want]} พันธะ</b>`);
      return;
    }
    made[at] = k;
    say('good', `✅ ตำแหน่งที่ ${at+1} — <b>${DH_NAME[DH_SEQ[at]]}</b> เข้าคู่กับ<b>${DH_NAME[k]}</b>
      ด้วยพันธะไฮโดรเจน <b>${DH_HB[k]} พันธะ</b>`);
    at++;
    const pb = document.getElementById('pb');
    if(pb) pb.style.width = (made.filter(Boolean).length/DH_SEQ.length*100)+'%';
    if(at >= DH_SEQ.length){ phase = 'seal'; at = DH_SEQ.length-1; draw(); }
    else refresh();
  }

  function seal(){
    if(busy) return;
    busy = true; phase = 'final'; draw();
    say('good', `🎉 <b>ไลเกสเชื่อมสายใหม่เรียบร้อย</b> — ได้ DNA <b>2 โมเลกุลที่เหมือนต้นแบบทุกประการ</b><br>
      แต่ละโมเลกุลมี<b>สายเดิม 1 สาย (สีฟ้า) และสายใหม่ 1 สาย (สีส้ม)</b> จึงเรียกว่า<b>การจำลองแบบกึ่งอนุรักษ์</b>`);
    setTimeout(()=>onDone(wrong), 2600);
  }

  function bind(){
    const go = document.getElementById('dhGo'); if(go) go.onclick = unwind;
    const sl = document.getElementById('dhSeal'); if(sl) sl.onclick = seal;
    if(phase !== 'fill') return;
    pd = pickDrag(host, {
      tok:'.dh-tok', drop:'.dh-stage', ghostClass:'gl-ghost dh-ghost',
      key: el=>el.dataset.k,
      busy: ()=>busy,
      ghost: el=>`<span class="dh-chip" style="background:${DH_COLOR[el.dataset.k]}">${el.dataset.k}</span>`,
      onArm: k=>{
        host.querySelectorAll('.dh-tok').forEach(t=>t.classList.toggle('sel', t.dataset.k===k));
        const st = document.getElementById('dhStage'); if(st) st.classList.toggle('armed', !!k);
      },
      onDrop: (d,k)=>{
        if(!k){ say('bad', '❌ ยังไม่ได้เลือกนิวคลีโอไทด์ — <b>แตะนิวคลีโอไทด์ด้านล่างก่อน</b> แล้วค่อยแตะเกลียว'); return; }
        place(k);
        if(pd) pd.arm(null);      /* ล้างการเลือก เพื่อให้แตะตัวเดิมซ้ำได้ทันที */
      }
    });
  }

  draw();
}

function stageCopy(){

    app.innerHTML = stageShell('copy', `

        <b>คลายเกลียว → ลากนิวคลีโอไทด์มาเข้าคู่กับสายแม่แบบ → เชื่อมด้วยไลเกส</b>

    });

  function drawMatch(){
    app.innerHTML = stageShell('copy', `
      <div class="note">🎯 <b>ช่วงที่ 2:</b> แตะชื่อเอนไซม์หรือสายใหม่ แล้วแตะการ์ดหน้าที่ที่ตรงกัน</div>
      <div class="bar"><i id="pb" style="width:0%"></i></div>

      <div class="note">🎯 <b>ช่วงที่ 3:</b> ตอบคำถามเรื่องการจำลองดีเอ็นเอให้ครบ ${REP_Q.length} ข้อ</div>
      <div class="bar"><i id="pb" style="width:0%"></i></div>

    quizRun(REP_Q, 'qhost', qWrong=>{
      const miss = orderWrong + matchWrong + qWrong;
      const got = miss<=2?3:miss<=4?2:1;

      finishStage('copy', got, 85-Math.min(miss*7,55), `
        <div class="note key">🟡 <b>สรุปที่ต้องจำ</b><br>
          • การจำลองดีเอ็นเอเป็นแบบ<b>กึ่งอนุรักษ์</b> — แต่ละโมเลกุลใหม่มี<b>สายเดิม 1 สาย สายใหม่ 1 สาย</b><br>
          • สายใหม่สร้างในทิศ <b>5′ → 3′ เสมอ</b> เพราะต่อนิวคลีโอไทด์ได้เฉพาะที่<b>ปลาย 3′</b><br>
          • <b>ลีดดิงสแทรนด์</b>สร้างต่อเนื่อง · <b>แลกกิงสแทรนด์</b>สร้างเป็นท่อนแล้วให้ไลเกสเชื่อม</div>
        <div class="note miss">🔴 <b>กุญแจของด่านนี้:</b> ทุกอย่างสืบเนื่องจากกฎเดียว —
          <b>สร้างได้เฉพาะ 5′ → 3′</b> เมื่อสายแม่แบบสองสาย<b>สวนทางกัน</b> จึงเป็นไปไม่ได้ที่ทั้งสองสายจะสร้างต่อเนื่องพร้อมกัน</div>
        <div class="small muted">ตอบผิดทั้งหมด ${miss} ครั้ง</div>`);

/* =========================================================================
   ห้องถอดรหัส–แปลรหัส — จำลองตามแผนภาพในหนังสือเรียน
   ช่วงถอดรหัส: ลากไรโบนิวคลีโอไทด์มาเข้าคู่กับ DNA สายแม่แบบจนได้ mRNA
   ช่วงแปลรหัส: อ่าน mRNA ทีละโคดอน (3 เบส) แล้วลากกรดแอมิโนตามตารางรหัสพันธุกรรม
   ========================================================================= */
const TX_TPL  = ['T','A','C','A','A','A','C','C','G','A','T','G'];   /* สายแม่แบบ 3′→5′ */
const TX_DNA2 = ['A','T','G','T','T','T','G','G','C','T','A','C'];   /* สายคู่สม  5′→3′ */
const TX_RNA  = { T:'A', A:'U', C:'G', G:'C' };                      /* แม่แบบ → RNA (A จับกับ U) */
const TX_MRNA = TX_TPL.map(b=>TX_RNA[b]);                            /* A U G U U U G G C U A C */
const TX_BC   = { A:'#9CC78A', T:'#EE9A9A', U:'#EE9A9A', C:'#F5DC8E', G:'#9CC2DE' };
const TX_BN   = { A:'อะดีนีน (A)', U:'ยูราซิล (U)', C:'ไซโทซีน (C)', G:'กวานีน (G)', T:'ไทมีน (T)' };
const TX_AAS = [
  { c:'AUG', aa:'Met', th:'เมไทโอนีน',    col:'#2F3E8F', note:'รหัสเริ่มต้น' },
  { c:'UUU', aa:'Phe', th:'ฟีนิลแอลานีน', col:'#D97FA8' },
  { c:'GGC', aa:'Gly', th:'ไกลซีน',       col:'#A98457' },
  { c:'UAC', aa:'Tyr', th:'ไทโรซีน',      col:'#7E77C4' },
  { c:'UUG', aa:'Leu', th:'ลิวซีน',       col:'#4E9370' },
  { c:'GCU', aa:'Ala', th:'แอลานีน',      col:'#C77F2E' }
];
const TX_CODONS = [0,3,6,9].map(i=>TX_MRNA.slice(i,i+3).join(''));    /* AUG UUU GGC UAC */

/* ภาพเกลียวคู่ย่อด้านบน พร้อมกรอบยีนที่กำลังถอดรหัส */
function txGeneSvg(){
  const W = 600, H = 66, mid = 33, amp = 17, per = 66;
  const wave = sh => Array.from({length:61}, (_,i)=>{
    const x = i*W/60, y = mid + sh*amp*Math.sin(2*Math.PI*x/per);
    return (i?'L':'M') + x.toFixed(1) + ' ' + y.toFixed(1);
  }).join(' ');
  const rungs = Array.from({length:40}, (_,i)=>{
    const x = 6 + i*(W-12)/39, d = amp*Math.sin(2*Math.PI*x/per);
    const g1 = x>=132 && x<=276, g2 = x>=312 && x<=456;
    return `<path d="M${x.toFixed(1)} ${(mid+d).toFixed(1)} L${x.toFixed(1)} ${(mid-d).toFixed(1)}"
      stroke="${g1?'#5CB8E6':g2?'#7CB894':'#9FB6CF'}" stroke-width="3" stroke-linecap="round" opacity=".9"/>`;
  }).join('');
  return `<svg class="tx-gene" viewBox="0 0 ${W} ${H+22}" role="img" aria-label="ยีนบนดีเอ็นเอ">
    ${rungs}
    <path d="${wave(1)}" fill="none" stroke="#2F4E8F" stroke-width="5" stroke-linecap="round"/>
    <path d="${wave(-1)}" fill="none" stroke="#2F4E8F" stroke-width="5" stroke-linecap="round"/>
    <rect x="130" y="4" width="148" height="58" rx="4" fill="none" stroke="#3E3E3E" stroke-width="1.6"/>
    <text x="204" y="${H+16}" text-anchor="middle" font-size="15" font-weight="700" fill="#084A24">ยีน 1</text>
    <text x="384" y="${H+16}" text-anchor="middle" font-size="15" font-weight="700" fill="#4E9370">ยีน 2</text>
  </svg>`;
}

/* hostId = กล่องเครื่องจำลอง · onDone(จำนวนที่ผิด) */
function codeLab(hostId, onDone){
  const host = document.getElementById(hostId);
  let phase = 'tx', at = 0, wrong = 0, pd = null;
  const rna = [], pep = [];

  const cell = (b, cls='') => b
    ? `<span class="tx-c ${cls}" style="background:${TX_BC[b]}">${b}</span>`
    : `<span class="tx-c blank ${cls}">·</span>`;

  function mrnaHTML(){
    if(phase === 'tx'){
      return `<div class="tx-cells">${TX_MRNA.map((b,i)=>cell(rna[i], i===at?'now':'')).join('')}</div>`;
    }
    return `<div class="tx-cod">${TX_CODONS.map((c,ci)=>
      `<span class="tx-codon ${phase==='tl'&&ci===at?'now':''}"><span class="tx-cells">${
        c.split('').map(b=>cell(b)).join('')}</span></span>`).join('')}</div>`;
  }

  function pepHTML(){
    return TX_CODONS.map((c,i)=>{
      const a = pep[i] && TX_AAS.find(x=>x.aa===pep[i]);
      const dot = a ? `<span class="tx-aa ${phase==='tl'&&i===at?'now':''}" style="background:${a.col}">${a.aa}</span>`
                    : `<span class="tx-aa blank ${phase==='tl'&&i===at?'now':''}">·</span>`;
      return (i?'<span class="tx-bond"></span>':'') + dot;
    }).join('');
  }

  function stepText(){
    if(phase === 'tx') return `📝 <b>การถอดรหัส (transcription)</b> — สร้าง mRNA ที่มีเบส<b>คู่สมกับสายแม่แบบ</b>
      โดยใน RNA ใช้ <b>ยูราซิล (U) แทนไทมีน (T)</b> · ตำแหน่งที่ ${at+1} จาก ${TX_MRNA.length} ·
      แม่แบบตรงนี้คือ <b>${TX_BN[TX_TPL[at]]}</b>`;
    if(phase === 'tl') return `🔤 <b>การแปลรหัส (translation)</b> — อ่าน mRNA <b>ทีละ 3 เบส (โคดอน)</b>
      แล้วนำกรดแอมิโนที่ตรงกันมาต่อเป็นสายพอลิเพปไทด์ · โคดอนที่ ${at+1} คือ <b>${TX_CODONS[at]}</b>`;
    return `🎉 <b>ได้สายพอลิเพปไทด์แล้ว</b> — ข้อมูลเดินทางจาก <b>DNA → mRNA → โปรตีน</b> ครบเส้นทาง`;
  }

  function sideHTML(){
    if(phase === 'tx'){
      return `<h4>🧪 ไรโบนิวคลีโอไทด์</h4>
        <div class="tx-tray">
          ${['A','U','C','G'].map(k=>`<div class="tx-tok" data-k="${k}" role="button" tabindex="0"
              aria-label="${TX_BN[k]}">
            <span class="tx-chip" style="background:${TX_BC[k]}">${k}</span>
            <span class="gl-cap">${TX_BN[k].replace(/ \(.\)$/,'')}</span></div>`).join('')}
        </div>
        <div class="small muted" style="margin-top:8px">ลากไรโบนิวคลีโอไทด์ไปวางบนแถบ mRNA หรือแตะแล้วแตะแถบก็ได้</div>
        <div class="tx-why">
          <div><b class="n">A–U</b> ใน RNA ไม่มีไทมีน เบสคู่สมของ <b>A บนแม่แบบ</b> จึงเป็น <b>U</b></div>
          <div><b class="n">C–G</b> เข้าคู่กันเหมือนเดิมทั้งใน DNA และ RNA</div>
        </div>`;
    }
    if(phase === 'tl'){
      return `<h4>🔑 ตารางรหัสพันธุกรรม</h4>
        <table class="tx-code">
          <tr><th>โคดอน</th><th>กรดแอมิโน</th></tr>
          ${TX_AAS.map(a=>`<tr><td class="cod">${a.c}</td>
            <td>${a.th} (${a.aa})${a.note?` · <b>${a.note}</b>`:''}</td></tr>`).join('')}
          <tr><td class="cod">UAA</td><td>ไม่กำหนดกรดแอมิโน · <b>รหัสหยุด</b></td></tr>
        </table>
        <div class="tx-tray aa">
          ${shuffle(TX_AAS.slice()).map(a=>`<div class="tx-tok${pep.includes(a.aa)?' used':''}" data-k="${a.aa}"
              role="button" tabindex="0" aria-label="${a.th}">
            <span class="tx-chip" style="background:${a.col};color:#fff;border-color:rgba(255,255,255,.4)">${a.aa}</span>
            <span class="gl-cap">${a.th}</span></div>`).join('')}
        </div>
        <div class="small muted" style="margin-top:8px">เปิดตารางแล้วลากกรดแอมิโนไปต่อที่สายพอลิเพปไทด์</div>`;
    }
    const bases = ['A','G','C','U'];
    const pairs = bases.flatMap(x=>bases.map(y=>x+y));
    return `<h4>🧠 ทำไมรหัสต้องเป็น 3 เบส</h4>
      <div class="tx-why">
        <div><b class="n">4 รหัส</b> 1 นิวคลีโอไทด์ ⇨ 1 รหัส — น้อยกว่ากรดแอมิโน 20 ชนิด</div>
      </div>
      <div class="tx-grid">${bases.map(x=>
        `<span class="tx-g" style="background:${TX_BC[x]}">${x}</span>`).join('')}</div>
      <div class="tx-why">
        <div><b class="n">16 รหัส</b> 2 นิวคลีโอไทด์ ⇨ 1 รหัส — ยังไม่พอ</div>
      </div>
      <div class="tx-grid g16">${pairs.map(c=>`<span class="tx-g">${c}</span>`).join('')}</div>
      <div class="tx-why">
        <div><b class="n ok">64 รหัส</b> 3 นิวคลีโอไทด์ ⇨ 1 รหัส — <b>พอสำหรับกรดแอมิโน 20 ชนิด</b></div>
      </div>
      <div class="small muted" style="margin-top:8px">รหัสพันธุกรรม 64 รหัส มี <b>61 รหัส</b>ที่กำหนดชนิดของกรดแอมิโน
        และอีก <b>3 รหัส</b>เป็นรหัสหยุด</div>`;
  }

  function draw(){
    host.innerHTML = `
      <div class="tx-lab">
        <div class="tx-step">${stepText()}</div>
        <div class="tx-row">
          <div class="tx-panel">
            <h4>🧬 ยีนบนดีเอ็นเอ</h4>
            ${txGeneSvg()}
            <div class="tx-line"><span class="tx-tag">สายแม่แบบ</span><span class="tx-p">3′</span>
              <span class="tx-cells">${TX_TPL.map((b,i)=>cell(b, phase==='tx'&&i===at?'now':'')).join('')}</span>
              <span class="tx-p">5′</span></div>
            <div class="tx-line"><span class="tx-tag">สายคู่สม</span><span class="tx-p">5′</span>
              <span class="tx-cells">${TX_DNA2.map(b=>cell(b)).join('')}</span><span class="tx-p">3′</span></div>
            <div class="tx-arrow">↓ ถอดรหัส (transcription)</div>
            <div class="tx-line tx-drop" id="txMrna" data-zone="tx"><span class="tx-tag">mRNA</span>
              <span class="tx-p">5′</span>${mrnaHTML()}<span class="tx-p">3′</span></div>
            <div class="tx-arrow">↓ แปลรหัส (translation)</div>
            <div class="tx-line tx-drop" id="txPep" data-zone="tl"><span class="tx-tag">พอลิเพปไทด์</span>
              <span class="tx-pep">${pepHTML()}</span></div>
          </div>
          <div class="tx-panel" id="txSide">${sideHTML()}</div>
        </div>
      </div>`;
    bind();
  }

  function say(cls, html){
    const fb = document.getElementById('fb');
    fb.className = 'feedback show ' + cls; fb.innerHTML = html;
  }

  function place(k){
    if(phase === 'tx'){
      const want = TX_MRNA[at];
      if(k !== want){
        wrong++;
        say('bad', `❌ แม่แบบตำแหน่งนี้เป็น<b>${TX_BN[TX_TPL[at]]}</b> จึงต้องเข้าคู่กับ<b>${TX_BN[want]}</b>
          ${TX_TPL[at]==='A' ? ' — อย่าลืมว่าใน RNA <b>ไม่มีไทมีน</b> ใช้ <b>ยูราซิล (U)</b> แทน' : ''}`);
        return;
      }
      rna[at] = k; at++;
      const pb = document.getElementById('pb');
      if(pb) pb.style.width = (at/(TX_MRNA.length+TX_CODONS.length)*100)+'%';
      if(at >= TX_MRNA.length){
        phase = 'tl'; at = 0;
        say('good', `✅ ถอดรหัสครบแล้ว — ได้ mRNA <b>5′ ${TX_MRNA.join(' ')} 3′</b><br>
          ต่อไปไรโบโซมจะอ่าน mRNA <b>ทีละ 3 เบส</b> แล้วให้ tRNA นำกรดแอมิโนมาต่อกัน`);
      }else{
        say('good', `✅ ตำแหน่งที่ ${at} — <b>${TX_BN[TX_TPL[at-1]]}</b> บนแม่แบบ เข้าคู่กับ<b>${TX_BN[k]}</b>`);
      }
      draw();
      return;
    }
    if(phase !== 'tl') return;
    const want = TX_AAS.find(a=>a.c === TX_CODONS[at]);
    if(k !== want.aa){
      wrong++;
      const got = TX_AAS.find(a=>a.aa === k);
      say('bad', `❌ ${got.th} (${got.aa}) ตรงกับโคดอน <b>${got.c}</b> แต่โคดอนที่ ${at+1} คือ <b>${TX_CODONS[at]}</b>
        — ลองเทียบกับตารางรหัสพันธุกรรมอีกครั้ง`);
      return;
    }
    pep[at] = k; at++;
    const pb = document.getElementById('pb');
    if(pb) pb.style.width = ((TX_MRNA.length+at)/(TX_MRNA.length+TX_CODONS.length)*100)+'%';
    if(at >= TX_CODONS.length){
      phase = 'done';
      say('good', `🎉 <b>ได้สายพอลิเพปไทด์ ${TX_AAS.slice(0,4).map(a=>a.aa).join('–')}</b> —
        ลำดับเบสบน DNA จึงกำหนด<b>ลำดับกรดแอมิโน</b> และกำหนดชนิดของโปรตีนในที่สุด`);
      draw();
      setTimeout(()=>onDone(wrong), 2600);
      return;
    }
    say('good', `✅ โคดอน <b>${TX_CODONS[at-1]}</b> → <b>${want.th} (${want.aa})</b>${
      want.note ? ` · ${want.note}` : ''}`);
    draw();
  }

  function bind(){
    if(phase === 'done') return;
    pd = pickDrag(host, {
      tok:'.tx-tok:not(.used)', drop:'.tx-drop', ghostClass:'gl-ghost tx-ghost',
      key: el=>el.dataset.k,
      busy: ()=>false,
      ghost: el=>el.querySelector('.tx-chip').outerHTML,
      onArm: k=>{
        host.querySelectorAll('.tx-tok').forEach(t=>t.classList.toggle('sel', t.dataset.k===k));
        host.querySelectorAll('.tx-drop').forEach(d=>d.classList.toggle('armed', !!k && d.dataset.zone===phase));
      },
      onDrop: (d,k)=>{
        if(!k){ say('bad', '❌ ยังไม่ได้เลือกชิ้นส่วน — <b>แตะชิ้นส่วนทางขวาก่อน</b> แล้วค่อยแตะแถบ'); return; }
        if(d.dataset.zone !== phase){
          say('bad', phase==='tx'
            ? '❌ ตอนนี้อยู่ขั้น<b>ถอดรหัส</b> — ต้องวางไรโบนิวคลีโอไทด์บน<b>แถบ mRNA</b> ก่อน'
            : '❌ ตอนนี้อยู่ขั้น<b>แปลรหัส</b> — ต้องนำกรดแอมิโนไปต่อที่<b>สายพอลิเพปไทด์</b>');
          return;
        }
        place(k);
        if(pd) pd.arm(null);
      }
    });
  }

  draw();
}

function stageBoss(){
  let sortWrong = 0;
  drawSort();

  function drawSort(){
    const B = { gene:{ t:'🧬 มิวเทชันระดับยีน<br><span class="small muted">ชนิดหรือจำนวนนิวคลีโอไทด์เปลี่ยน</span>' },
                chrom:{ t:'🪢 มิวเทชันระดับโครโมโซม<br><span class="small muted">โครงสร้างหรือจำนวนโครโมโซมเปลี่ยน</span>' } };
    app.innerHTML = stageShell('boss', `
      <div class="note">🎯 <b>ช่วงที่ 1:</b> แยกให้ออกว่าความผิดปกติแต่ละอย่างเกิดที่ระดับใด
        (ครบ ${MUT_ITEMS.length} รายการ)</div>
      <div class="bar"><i id="pb" style="width:0%"></i></div>
      <div class="bank" id="pool">
        ${shuffle(MUT_ITEMS).map(it=>`<div class="tok" data-n="${it.n}">${it.n}</div>`).join('')}
      </div>
      <div class="buckets" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
        ${Object.entries(B).map(([k,v])=>`<div class="bucket" data-g="${k}">
          <h4>${v.t}</h4><div class="items" id="items-${k}"></div></div>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
      <div class="note" style="margin-top:16px">
        🔵 <b>ตัวช่วยจำ:</b> ถ้าพูดถึง<b>เบสหรือนิวคลีโอไทด์</b> = ระดับยีน ·
        ถ้าพูดถึง<b>แท่งโครโมโซมหรือจำนวนชุด</b> = ระดับโครโมโซม
      </div>
    `);
    bindBuckets(MUT_ITEMS, B, 'pb', 'fb', wrong=>{
      sortWrong = wrong; toast('แยกครบแล้ว! ไปวินิจฉัยกรณีศึกษา'); setTimeout(drawQuiz,700);
    });
  }

  function drawQuiz(){
    app.innerHTML = stageShell('boss', `
      <div class="note">🎯 <b>ช่วงที่ 2 · วินิจฉัยกรณีศึกษา:</b>
        ${BOSS_Q2.length} สถานการณ์ ใช้ความรู้จากทั้ง 5 ด่านมาตอบ</div>
      <div class="bar"><i id="pb" style="width:0%"></i></div>
      <div id="qhost"></div>
    `);
    quizRun(BOSS_Q2, 'qhost', qWrong=>{
      const miss = sortWrong + qWrong;
      const got = miss<=2?3:miss<=5?2:1;
      stageMiss = miss;
      finishStage('boss', got, 115-Math.min(miss*8,75), `
        <div class="note key">🟡 <b>สรุปภาพรวมทั้งบท</b><br>
          • <b>โครโมโซม</b> = DNA พันฮิสโทนเป็นนิวคลีโอโซม → โครมาทิน → โครโมโซม · <b>ยีนเป็นช่วงของ DNA</b><br>
          • <b>DNA เป็นสารพันธุกรรม</b> พิสูจน์ด้วยการทดลองของ Griffith และ Avery<br>
          • โครงสร้าง: <b>เกลียวคู่ แอนติพาราเรล A–T 2 พันธะ G–C 3 พันธะ</b><br>
          • สมบัติ: <b>เพิ่มจำนวนได้เหมือนเดิม</b> (จำลองแบบกึ่งอนุรักษ์) · <b>ควบคุมการสังเคราะห์สาร</b>
            (ถอดรหัส–แปลรหัส) · <b>อาจเปลี่ยนแปลงได้บ้าง</b> (มิวเทชัน)<br>
          • มิวเทชัน<b>ระดับยีน</b> = เบส/นิวคลีโอไทด์เปลี่ยน · <b>ระดับโครโมโซม</b> = โครงสร้างหรือจำนวนเปลี่ยน</div>
        <div class="note miss">🔴 <b>สามข้อที่ข้อสอบชอบหลอก</b><br>
          1. มิวเทชันใน<b>เซลล์ร่างกายไม่ถ่ายทอดสู่รุ่นลูก</b> — เฉพาะในเซลล์สืบพันธุ์เท่านั้นที่ถ่ายทอดได้<br>
          2. <b>นอนดิสจังชันที่ไมโอซิส I ร้ายแรงกว่า</b> เพราะเซลล์สืบพันธุ์ผิดปกติทั้ง 4 เซลล์<br>
          3. มิวเทชัน<b>ไม่ได้เป็นโทษเสมอไป</b> — คนใช้การชักนำมิวเทชันปรับปรุงพันธุ์พืช
             เช่น ฉายรังสีปรับปรุงพันธุ์ทิวลิป ถั่วเหลือง ข้าวสาลี และมันเทศ</div>
        <div class="small muted">ตอบผิดทั้งหมด ${miss} ครั้ง</div>`);
    });
  }
}

function renderCards(){
  const cats=[...new Set(CARDS.map(c=>c[0]))];
  let cat='ทั้งหมด', deck=[], idx=0, flipped=false;
  function build(){ deck=(cat==='ทั้งหมด'?CARDS:CARDS.filter(c=>c[0]===cat)); idx=0; flipped=false; }
  build();
  app.innerHTML = `
    <div class="stagehead">
      <div class="ic">🃏</div>
      <div style="flex:1;min-width:200px"><h2>การ์ดคำศัพท์</h2>
        <div class="sub">แตะการ์ดเพื่อพลิกดูความหมาย · ${CARDS.length} คำศัพท์ ไทย–อังกฤษ</div></div>
    </div>
    <div class="deckbar" id="deckbar">
      ${['ทั้งหมด',...cats].map(c=>`<button data-c="${c}" class="${c==='ทั้งหมด'?'on':''}">${c}</button>`).join('')}
    </div>
    <div class="fcstage"><div class="fc" id="fc"></div></div>
    <div class="fcnav">
      <button class="btn sm" id="prev">← ก่อนหน้า</button>
      <span class="count" id="count"></span>
      <button class="btn sm" id="next">ถัดไป →</button>
    </div>
    <div class="center" style="margin-top:12px">
      <button class="btn ghost sm" id="shuf">🔀 สลับการ์ด</button>
      <button class="btn primary sm" id="back">กลับแผนที่</button>
    </div>
    <div class="note" style="margin-top:20px">
      💡 <b>วิธีใช้ให้ได้ผล:</b> อ่านคำศัพท์แล้ว<b>พูดนิยามออกมาเองก่อน</b> จึงค่อยพลิกดูเฉลย (active recall)
    </div>`;
  const fc=document.getElementById('fc'), cnt=document.getElementById('count');
  function draw(){
    const c=deck[idx];
    if(!c){ fc.innerHTML='<div class="side front"><div class="term">ไม่มีการ์ดในหมวดนี้</div></div>'; return; }
    fc.classList.remove('flip'); flipped=false;
    fc.innerHTML = `
      <div class="side front">
        <div class="tag">${c[0]}</div><div class="term">${c[1]}</div><div class="en">${c[2]}</div>
        <div class="hint">แตะเพื่อพลิก ↻</div>
      </div>
      <div class="side back">
        <div class="tag">${c[1]} · ${c[2]}</div><div class="def">${c[3]}</div>
        <div class="hint">แตะเพื่อพลิกกลับ ↻</div>
      </div>`;
    cnt.textContent = `${idx+1} / ${deck.length}`;
  }
  fc.onclick=()=>{ flipped=!flipped; fc.classList.toggle('flip',flipped); };
  document.getElementById('prev').onclick=()=>{ idx=(idx-1+deck.length)%deck.length; draw(); };
  document.getElementById('next').onclick=()=>{ idx=(idx+1)%deck.length; draw(); };
  document.getElementById('shuf').onclick=()=>{ deck=shuffle(deck); idx=0; draw(); toast('สลับการ์ดแล้ว'); };
  document.getElementById('back').onclick=renderMap;
  document.querySelectorAll('#deckbar button').forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll('#deckbar button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); cat=b.dataset.c; build(); draw();
    };
  });
  document.addEventListener('keydown', function nav(e){
    if(!document.getElementById('fc')){ document.removeEventListener('keydown',nav); return; }
    if(e.key==='ArrowRight') document.getElementById('next')?.click();
    if(e.key==='ArrowLeft')  document.getElementById('prev')?.click();
    if(e.key===' '){ e.preventDefault(); fc.click(); }
  });
  draw(); window.scrollTo({top:0,behavior:'smooth'});
}

/* =========================================================================
   เกียรติบัตร — เรียนครบทุกด่านและได้ดาวรวมถึงเกณฑ์ แล้วใส่ชื่อรับเกียรติบัตรได้
   ปรับตำแหน่ง/ขนาดชื่อบนเกียรติบัตรได้ที่ค่า CERT ด้านล่างจุดเดียว
   (ค่าทุกตัวคิดเป็นสัดส่วนของภาพ 0–1 จึงใช้ไฟล์ขนาดใดก็ได้) */
const CERT = {
  src:'cert-bg.png',      // ไฟล์เกียรติบัตรเปล่าของบทนี้ (ยังไม่มี — เกมจะวาดกรอบสำรองให้เอง)
  pass:0.6,               // เกณฑ์ผ่าน = 60% ของดาวเต็ม
  nameX:0.4965,           // จุดกึ่งกลางชื่อ (แนวนอน) — วัดจากกึ่งกลางกล่องสีขาวใน cert-bg.png
  nameY:0.4954,           // จุดกึ่งกลางชื่อ (แนวตั้ง) — ช่องว่างใต้ “ขอมอบเกียรติบัตรฉบับนี้ให้ไว้เพื่อแสดงว่า”
  nameW:0.44,             // ความกว้างสูงสุดของชื่อ
  nameSize:0.042,         // ขนาดตัวอักษร เทียบกับความกว้างภาพ
  nameColor:'#0A0A0A'
};
const MAX_STARS = STAGES.length * 3;
function certNeed(){ return Math.ceil(MAX_STARS * CERT.pass); }
function certPassed(){
  const allPlayed = STAGES.every(st => (S.stars[st.id]||0) > 0);
  return allPlayed && totalStars() >= certNeed();
}
function certName(){
  const j = (typeof getJoin==='function') ? getJoin() : null;
  return localStorage.getItem('dna-cert-name') || (j && j.name) || '';
}
function certCardHtml(){
  const need=certNeed(), got=totalStars(), ok=certPassed();
  const pct=Math.min(100, Math.round(got/need*100));
  return `<div class="card ${ok?'':'lockcard'}" style="margin-top:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
      border-color:${ok?'rgba(242,103,22,.5)':'var(--line)'}">
    <div style="font-size:2rem">${ok?'🏅':'🔒'}</div>
    <div style="flex:1;min-width:200px">
      <div style="font-weight:800">เกียรติบัตร${ok?' — ผ่านเกณฑ์แล้ว!':''}</div>
      <div class="small muted">${ok
        ? `เรียนครบทุกด่านและได้ ${got}/${MAX_STARS} ดาว (เกณฑ์ ${Math.round(CERT.pass*100)}% = ${need} ดาว) — ใส่ชื่อแล้วบันทึกเกียรติบัตรได้เลย`
        : `เล่นให้ครบทั้ง ${STAGES.length} ด่าน และเก็บดาวให้ถึง <b>${need}/${MAX_STARS}</b> ดาว (${Math.round(CERT.pass*100)}%) · ตอนนี้ได้ ${got} ดาว`}</div>
      ${ok?'':`<div class="certprog"><i style="width:${pct}%"></i></div>`}
    </div>
    <button class="btn ${ok?'gold':''}" id="btnCert" ${ok?'':'disabled'}>รับเกียรติบัตร</button>
  </div>`;
}

/* วาดเกียรติบัตรลงบนแคนวาส (ใช้ภาพของโรงเรียนถ้ามี ถ้าไม่มีจะวาดกรอบสำรองให้) */
function drawCert(canvas, name, img){
  const W = img ? img.naturalWidth : 2000, H = img ? img.naturalHeight : 1400;
  canvas.width = W; canvas.height = H;
  const c = canvas.getContext('2d');
  c.fillStyle = '#fff'; c.fillRect(0,0,W,H);
  if(img){ c.drawImage(img, 0, 0, W, H); }
  else { certFallback(c, W, H); }
  // ---- ชื่อผู้เรียน (ย่อขนาดอัตโนมัติจนพอดีกรอบ) ----
  const maxW = W * CERT.nameW;
  let size = W * CERT.nameSize;
  const font = px => `700 ${px}px "Sukhumvit Set","Noto Sans Thai","IBM Plex Sans Thai",sans-serif`;
  c.font = font(size);
  while(c.measureText(name).width > maxW && size > W*0.012){ size *= 0.95; c.font = font(size); }
  c.fillStyle = CERT.nameColor; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(name, W*CERT.nameX, H*CERT.nameY);
  return canvas;
}
/* กรอบสำรอง ใช้เมื่อยังไม่ได้วางไฟล์ cert-bg.png */
function certFallback(c, W, H){
  const g = c.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#FBF8EC'); g.addColorStop(1,'#EAE4C6');
  c.fillStyle = g; c.fillRect(0,0,W,H);
  c.strokeStyle = '#084A24'; c.lineWidth = W*0.012; c.strokeRect(W*0.03,H*0.04,W*0.94,H*0.92);
  c.strokeStyle = '#F26716'; c.lineWidth = W*0.004; c.strokeRect(W*0.045,H*0.062,W*0.91,H*0.876);
  c.textAlign='center'; c.fillStyle='#084A24';
  const f=(px,w=700)=>`${w} ${px}px "Sukhumvit Set","Noto Sans Thai",sans-serif`;
  c.font=f(W*0.045); c.fillText('เกียรติบัตรฉบับนี้ให้ไว้เพื่อแสดงว่า', W/2, H*0.30);
  c.fillStyle='#04261E'; c.font=f(W*0.028,400);
  c.fillText('ได้ผ่านการเรียนรู้ผ่านสื่ออิเล็กทรอนิกส์ (e-learning)', W/2, H*0.645);
  c.fillStyle='#D6350B'; c.font=f(W*0.022);
  c.fillText('บทที่ 4 เรื่อง \u201Cโครโมโซมและสารพันธุกรรม\u201D', W/2, H*0.70);
  c.fillText('สำหรับนักเรียนระดับชั้นมัธยมศึกษาปีที่ 4', W/2, H*0.745);
  c.fillStyle='#6B8A76'; c.font=f(W*0.022,400);
  c.fillText('ให้ไว้ ณ วันที่ ' + new Date().toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'}), W/2, H*0.82);
  // กรอบใส่ชื่อ
  const bx=W*0.5-W*0.26, by=H*CERT.nameY-H*0.055, bw=W*0.52, bh=H*0.11, r=bh/2;
  const gg=c.createLinearGradient(bx,0,bx+bw,0); gg.addColorStop(0,'#F7A8C4'); gg.addColorStop(1,'#F7C39C');
  c.fillStyle=gg; c.beginPath();
  c.moveTo(bx+r,by); c.arcTo(bx+bw,by,bx+bw,by+bh,r); c.arcTo(bx+bw,by+bh,bx,by+bh,r);
  c.arcTo(bx,by+bh,bx,by,r); c.arcTo(bx,by,bx+bw,by,r); c.closePath(); c.fill();
  c.strokeStyle='#2F7D4F'; c.lineWidth=W*0.003; c.stroke();
}

      📱 <b>บนมือถือ:</b> ถ้ากดบันทึกแล้วไม่มีอะไรเกิดขึ้น ให้กด “เปิดภาพเต็ม” แล้ว<b>กดค้างที่ภาพ → บันทึกรูปภาพ</b>
    </div>`;
  const cv = document.getElementById('ccv'), inp = document.getElementById('cname');

    if(!nm){ toast('กรอกชื่อของคุณก่อน'); inp.focus(); return false; }
    localStorage.setItem('dna-cert-name', nm);
    drawCert(cv, nm, img);
    return true;
  }
  // โหลดภาพเกียรติบัตรของโรงเรียน ถ้าไม่มีก็ใช้กรอบสำรอง
  const im = new Image();
  im.onload = ()=>{ img = im; if(nameNow) paint(); else drawCert(cv,'',img); };
  im.onerror = ()=>{ img = null; drawCert(cv, nameNow||'', null); };
  im.src = CERT.src;

  document.getElementById('cmake').onclick = paint;
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') paint(); });
  document.getElementById('cdl').onclick = ()=>{
    if(!paint()) return;
    const nm = (inp.value||'').trim();
    cv.toBlob(b=>{
      const url = URL.createObjectURL(b);
      const a = document.createElement('a');
      a.href = url; a.download = `เกียรติบัตร-${nm}.png`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      toast('บันทึกเกียรติบัตรแล้ว 🎉');
    }, 'image/png');
  };
  document.getElementById('copen').onclick = ()=>{
    if(!paint()) return;
    cv.toBlob(b=>{ window.open(URL.createObjectURL(b), '_blank'); }, 'image/png');
  };
  document.getElementById('cback').onclick = renderMap;
  window.scrollTo({top:0,behavior:'smooth'});
}

   ใช้ฐานข้อมูล Supabase ชุดเดียวกับเกมอื่นในเว็บไซต์นี้ คะแนนจึงขึ้นแดชบอร์ดครูหน้าเดิม

   ถ้าไม่เข้าร่วมห้องหรือเน็ตหลุด เกมยังเล่นได้ปกติ คะแนนจะพักไว้แล้วส่งเองเมื่อกลับมาออนไลน์ */
const SB_URL  = 'https://vgurqbcbovgeppvdwizr.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZndXJxYmNib3ZnZXBwdmR3aXpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MzUwMDcsImV4cCI6MjEwMjQxMTAwN30.MV-oJICUViNpDLjr7pdvxQr44XBhefHHlvlleW9bFUs';
const GAME_KEY   = 'dna';   // ใช้แยกคะแนนของแต่ละเกมในแดชบอร์ด
const LEVEL_BASE = 0;            // เลขด่านในตารางคะแนน = 1–6 (ฐานข้อมูลรับเลขด่าน 0–20 · แยกเกมด้วยคอลัมน์ game)

function getJoin(){ try{ return JSON.parse(localStorage.getItem('dna-class')||'null'); }catch(e){ return null; } }
function setJoin(o){ localStorage.setItem('dna-class', JSON.stringify(o)); }

function newSid(){ return 'S'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ---- คิวคะแนน กันเน็ตหลุด ---- */
function outbox(){ try{ return JSON.parse(localStorage.getItem('dna-outbox')||'[]'); }catch(e){ return []; } }
function setOutbox(q){ try{ localStorage.setItem('dna-outbox', JSON.stringify(q)); }catch(e){} }

async function pushRow(row){
  const r = await fetch(SB_URL+'/rest/v1/scores', {
    method:'POST',
    headers:{ 'apikey':SB_ANON, 'Authorization':'Bearer '+SB_ANON,
              'Content-Type':'application/json', 'Prefer':'return=minimal' },
    body: JSON.stringify(row)
  });
  if(r.status===409) return;   // แถวนี้อยู่ในฐานข้อมูลแล้ว (uid ซ้ำ) ถือว่าส่งสำเร็จ เอาออกจากคิวได้
  if(!r.ok){
    let d=''; try{ d=(await r.text()).slice(0,140); }catch(e){}
    if(/23505|duplicate key/i.test(d)) return;   // ซ้ำเหมือนกัน แต่ฐานข้อมูลตอบมาคนละรหัส
    const err = new Error('http '+r.status+(d?' · '+d:'')); err.status = r.status; throw err;
  }
}
/* ส่งคะแนนที่ค้างอยู่ในคิว — ถ้าส่งไม่สำเร็จจะบอกให้รู้ ไม่เงียบหาย */
let lastSendErr = '';
function sendErrMsg(e){
  const s = e && e.status;
  if(s===401) return 'คีย์ของห้องไม่ถูกต้อง — แจ้งครูให้ตรวจการตั้งค่า';
  if(s===403) return 'ฐานข้อมูลปฏิเสธคะแนนนี้ — ห้องอาจถูกปิด หรือกฎความปลอดภัยไม่รับค่าที่ส่ง';
  if(s===404) return 'ไม่พบตารางคะแนนในฐานข้อมูล — แจ้งครูให้ตรวจการตั้งค่า';
  if(s===400) return 'รูปแบบข้อมูลไม่ตรงกับตารางคะแนน — แจ้งครูให้ตรวจคอลัมน์ในตาราง';
  return (e && e.message) ? e.message : 'เครือข่ายมีปัญหา';
}
/* ซ่อมแถวเก่าที่ค้างในคิวให้ตรงกับกติกาปัจจุบันก่อนส่ง
   (แถวที่ถูกเก็บไว้ตอนใช้เลขด่านชุดเก่า เช่น 21–26 จะถูกแปลงเป็น 1–6 ให้อัตโนมัติ) */
function fixRow(row){
  const r = Object.assign({}, row);
  if(typeof r.level === 'number' && r.level > 20) r.level = ((r.level - 1) % 10) + 1;
  r.stars   = Math.max(0, Math.min(3, Math.round(r.stars||0)));
  r.percent = Math.max(0, Math.min(100, Math.round(r.percent||0)));
  r.seconds = Math.max(0, Math.min(86400, Math.round(r.seconds||0)));
  r.misses  = Math.max(0, Math.min(9999, Math.round(r.misses||0)));
  r.attempt = Math.max(1, Math.min(9999, Math.round(r.attempt||1)));
  delete r.tries;                                   // ตัวนับความพยายาม เก็บไว้ในเครื่องเท่านั้น
  return r;
}
let flushing = false;
async function flushPending(opts){
  if(flushing) return;              // กันส่งซ้ำซ้อนตอนจบด่านพร้อมกับรอบส่งอัตโนมัติ
  if(!outbox().length) return;
  flushing = true;
  const tried = {};                 // uid -> จำนวนครั้งที่พยายามส่ง
  let failed = false, sent = 0, dropped = 0, stop = false;
  /* วนซ้ำจนคิวหมด เพราะระหว่างกำลังส่งอาจมีคะแนนเข้าคิวเพิ่ม
     (เช่นตอนกดเข้าร่วมห้องแล้วส่งดาวเก่าทุกด่านพร้อมกัน) */
  while(!stop){
    const q = outbox(); if(!q.length) break;
    const settled = new Set();      // uid ที่ส่งสำเร็จหรือทิ้งถาวรแล้วในรอบนี้
    let progressed = false;
    for(const row of q){
      if(stop) break;               // ปัญหาการตั้งค่า ส่งแถวที่เหลือต่อไปก็ไม่ผ่าน
      try{ await pushRow(fixRow(row)); settled.add(row.uid); sent++; progressed = true; }
      catch(e){
        failed = true; lastSendErr = sendErrMsg(e);
        const permanent = (e.status===400 || e.status===403 || e.status===422);
        tried[row.uid] = (row.tries||0) + 1;
        /* แถวที่ฐานข้อมูลไม่รับจริง ๆ จะถูกทิ้งหลังพยายาม 3 ครั้ง
           เพื่อไม่ให้แถวเดียวค้างจนบล็อกคะแนนที่เหลือทั้งคิว */
        if(permanent && tried[row.uid] >= 3){ settled.add(row.uid); dropped++; progressed = true; continue; }
        if(e.status===401 || e.status===404) stop = true;
      }
    }
    /* อ่านคิวใหม่อีกครั้ง แล้วเอาออกเฉพาะแถวที่จัดการเสร็จแล้ว
       คะแนนที่เพิ่งเข้าคิวระหว่างนี้จึงไม่หายไปพร้อมกับการเคลียร์คิว */
    const keep = outbox().filter(r=>!settled.has(r.uid));
    keep.forEach(r=>{ if(tried[r.uid]) r.tries = tried[r.uid]; });
    setOutbox(keep.slice(-200));
    if(!progressed) break;          // รอบนี้ส่งไม่ผ่านเลยสักแถว วนซ้ำไปก็ไม่ผ่าน
  }
  const left = outbox();
  flushing = false;
  renderClassChip();
  if(failed && !(opts && opts.quiet)){
    toast('⚠️ ส่งคะแนนไม่สำเร็จ · ' + lastSendErr + (dropped?(' · ข้ามที่ส่งไม่ได้ '+dropped+' รายการ'):''));
  }else if(!left.length && sent>1){
    toast('✅ ส่งคะแนนที่ค้างครบแล้ว ' + sent + ' รายการ');
  }
}

/* ---- สร้างแถวคะแนนของด่านที่เพิ่งจบ แล้วส่งให้ครู ---- */
function sendScore(stageId, starsGot, misses, seconds){
  const j = getJoin(); if(!j || !j.room || !j.name) return;
  const idx = STAGES.findIndex(x=>x.id===stageId);
  const st  = STAGES[idx] || { title: stageId };
  const row = {
    uid: j.sid+'-'+stageId+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),
    room: j.room, student: String(j.name).trim().slice(0,60), sid: j.sid,
    game: GAME_KEY,
    level: LEVEL_BASE + (idx>=0?idx+1:9),
    level_name: 'โครโมโซมและสารพันธุกรรม · ด่าน '+(idx+1)+' '+st.title,
    stars: starsGot, percent: Math.round(starsGot/3*100),
    score: starsGot, max_score: 3,
    seconds: Math.max(0, Math.min(seconds|0, 86400)),
    misses: Math.max(0, Math.min(misses|0, 9999)),
    total_stars: totalStars(),
    attempt: (S.plays && S.plays[stageId]) || 1,
    client_ts: new Date().toISOString()
  };
  const q = outbox(); q.push(row); setOutbox(q.slice(-200));
  flushPending();
}
/* ส่งดาวที่เคยได้ทั้งหมดตอนเพิ่งเข้าร่วมห้อง (นับเป็นครั้งที่ 1) */
function syncAllStars(){
  STAGES.forEach(st=>{
    const got = S.stars[st.id]||0; if(!got) return;
    sendScore(st.id, got, (S.miss&&S.miss[st.id])||0, (S.secs&&S.secs[st.id])||0);
  });
}

/* ---- ชิปสถานะชั้นเรียนบนหน้าแผนที่ ---- */
function renderClassChip(){
  const slot=document.getElementById('classSlot'); if(!slot) return;
  const j=getJoin();
  if(j && j.room){
    const stuck = outbox().length;
    slot.innerHTML = `<div class="classchip joined">🏫 ห้อง: <b>${escHtml(j.room)}</b> · 👤 ${escHtml(j.name)} <span class="x" id="leaveClass" title="ออกจากห้อง">✕</span></div>` +
      (stuck ? `<div class="classchip stuck" id="retrySend" title="แตะเพื่อลองส่งอีกครั้ง">⚠️ คะแนนค้างส่ง ${stuck} รายการ · แตะเพื่อลองใหม่</div>` : '');
    slot.querySelector('#leaveClass').onclick=()=>{
      if(confirm('ออกจากชั้นเรียน? (คะแนนที่ส่งไปแล้วยังอยู่กับครู)')){ clearJoin(); renderClassChip(); toast('ออกจากห้องแล้ว'); }
    };
    const rs = slot.querySelector('#retrySend');
    if(rs) rs.onclick=async ()=>{
      toast('กำลังลองส่งอีกครั้ง…');
      await flushPending({quiet:true});
      const left = outbox();
      if(!left.length){ toast('✅ ส่งคะแนนที่ค้างครบแล้ว'); return; }
      /* ยังส่งไม่ได้ — แสดงรายละเอียดให้ครูถ่ายหน้าจอส่งต่อได้ */
      const r0 = left[0] || {};
      alert('ส่งคะแนนไม่สำเร็จ\n\n' +
        'ค้างอยู่ ' + left.length + ' รายการ\n' +
        'สาเหตุล่าสุด: ' + (lastSendErr || 'ไม่ทราบ') + '\n\n' +
        'รายการแรกในคิว\n' +
        '· เกม: ' + (r0.game||'-') + '\n' +
        '· ด่าน: ' + (r0.level||'-') + ' (' + (r0.level_name||'-') + ')\n' +
        '· ห้อง: ' + (r0.room||'-') + ' · ชื่อ: ' + (r0.student||'-') + '\n' +
        '· พยายามส่งแล้ว: ' + (r0.tries||1) + ' ครั้ง');
    };
  }else{
    slot.innerHTML = `<div class="classchip" id="joinBtn">🏫 เข้าร่วมชั้นเรียน (ส่งคะแนนให้ครู)</div>`;
    slot.querySelector('#joinBtn').onclick=openJoinModal;
  }
}

function openJoinModal(){
  const j = getJoin() || {};
  const bg=document.createElement('div'); bg.className='modalbg';
  bg.innerHTML=`<div class="modal">
    <h3>🏫 เข้าร่วมชั้นเรียน</h3>
    <div class="msub">กรอกรหัสห้องที่ครูให้ และชื่อของคุณ เพื่อส่งคะแนนให้ครูเห็น</div>

    <label>ชื่อของคุณ (หรือ ชื่อ-เลขที่)</label><input id="jname" maxlength="40" placeholder="เช่น สมชาย เลขที่ 12" autocomplete="off" value="${escHtml(j.name||'')}">

      <a href="../privacy/" target="_blank" rel="noopener" style="color:var(--green);font-weight:700">อ่านนโยบายความเป็นส่วนตัว</a></div>
  </div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();

  bg.querySelector('#jcancel').onclick=close;

    if(!room){ msg.className='mmsg err'; msg.textContent='กรอกรหัสห้องที่ครูให้'; return; }
    if(!name){ msg.className='mmsg err'; msg.textContent='กรอกชื่อของคุณ'; return; }
    const prev=getJoin();
    setJoin({ room, name, sid:(prev&&prev.sid)||newSid() });
    close(); renderClassChip(); toast('เข้าร่วมห้อง '+room+' แล้ว');
    syncAllStars();
  };
  setTimeout(()=>codeEl.focus(),50);
}
