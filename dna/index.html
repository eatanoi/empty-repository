<style>
:root{
  /* ── พาเลตเดียวกับเกมสังเคราะห์แสง: F2EDD5 · E7390D · F26716 · 084A24 · 04261E ── */
  --cream:#F2EDD5; --cream-hi:#FBF8EC; --cream-lo:#E9E1BE;
  --ink:#04261E; --deep:#084A24;
  --bg0:#FBF8EC; --bg1:#F2EDD5; --bg2:#EAE4C6;
  --panel:rgba(255,255,255,.58);
  --panel2:rgba(255,255,255,.85);
  --line:rgba(8,74,36,.18);
  --green:#4E9370; --lime:#2F7D4F; --teal:#7CB894;
  --gold:#F26716; --rose:#E7390D;
  --violet:#5C90A6; --sky:#5C90A6;
  --green-soft:#AFD2BC; --green-pale:#DCEBE1;
  --orange-soft:#F7C39C; --orange-pale:#FBE4D2;
  --red-soft:#F4B7A6; --blue-soft:#BCD6E0;
  --text:#04261E; --muted:#6B8A76;
  --ok:#2F7D4F; --bad:#D6350B;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100dvh; color:var(--text);
  font-family:"Sukhumvit Set","Noto Sans Thai","IBM Plex Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
  background:
    radial-gradient(1100px 700px at 12% -8%, rgba(175,210,188,.55), transparent 62%),
    radial-gradient(900px 600px at 92% 0%, rgba(247,195,156,.42), transparent 60%),
    radial-gradient(800px 600px at 50% 112%, rgba(188,214,224,.38), transparent 62%),
    linear-gradient(rgba(251,248,236,.72),rgba(242,237,213,.80)),
    linear-gradient(170deg,var(--bg0),var(--bg1) 45%,var(--bg2));
  background-attachment:fixed;
  line-height:1.65; letter-spacing:.01em;
}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 90px}

.hud{
  position:sticky;top:0;z-index:60;margin:-16px -16px 18px;padding:12px 16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:linear-gradient(180deg,rgba(251,248,236,.96),rgba(242,237,213,.80));
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.02rem;letter-spacing:.02em;color:var(--deep)}
.brand .leaf{font-size:1.35rem;filter:drop-shadow(0 1px 3px rgba(8,74,36,.3))}
.hud .spacer{flex:1}
@media(max-width:520px){
  .hud{gap:7px;padding:9px 12px;flex-wrap:nowrap}
  .brand{font-size:.86rem;min-width:0}
  .brand span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brand .leaf{font-size:1.1rem}
  .chip{padding:4px 8px;font-size:.72rem}
  .hud .btn.sm{padding:5px 9px;font-size:.75rem}
}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);font-size:.82rem;font-weight:700;white-space:nowrap;
}
.chip b{color:var(--gold)}
.chip.xp b{color:var(--lime)}

button{font-family:inherit}
.btn{
  appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);
  padding:11px 20px;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer;
  transition:.16s transform,.16s background,.16s border-color;
}
.btn:hover{background:var(--panel2);border-color:rgba(8,74,36,.35)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#4E9370,#2F7D4F);color:#FBF8EC;border-color:transparent;box-shadow:0 8px 20px -10px rgba(8,74,36,.65)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--rose));color:#FFF7F0;border-color:transparent;box-shadow:0 8px 20px -10px rgba(231,57,13,.5)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:7px 14px;font-size:.85rem}
a.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.endrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;
  box-shadow:0 2px 12px rgba(8,74,36,.06)}
h1,h2,h3{line-height:1.35;margin:0 0 .5em}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.center{text-align:center}
.hidden{display:none !important}

.pub{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:6px}
.pub img{height:38px;width:auto;filter:drop-shadow(0 1px 2px rgba(8,74,36,.18))}
.pub span{font-weight:800;font-size:1.05rem;color:var(--deep);letter-spacing:.02em}
.pub span b{color:var(--gold)}
/* ---- ระบบชั้นเรียน ---- */
.classchip{display:inline-flex;align-items:center;gap:8px;margin:12px auto 0;padding:8px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:.85rem;font-weight:700;color:var(--deep);cursor:pointer;transition:.15s}
.classchip:hover{background:var(--panel2);border-color:rgba(8,74,36,.35)}
.classchip.joined{background:rgba(175,210,188,.55);border-color:var(--green);cursor:default}
.classchip.stuck{display:block;margin-top:6px;background:rgba(242,103,22,.14);border-color:var(--gold);color:var(--deep);cursor:pointer;font-size:.78rem}
.classchip .x{color:var(--rose);font-weight:800;margin-left:2px;cursor:pointer;padding:0 4px}
.modalbg{position:fixed;inset:0;background:rgba(4,38,30,.5);backdrop-filter:blur(3px);z-index:300;display:grid;place-items:center;padding:16px}
.modal{background:var(--cream-hi);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:380px;width:100%;box-shadow:0 22px 60px -20px rgba(0,0,0,.5)}
.modal h3{margin:0 0 4px;color:var(--deep);font-size:1.15rem}
.modal .msub{margin:0 0 14px;color:var(--muted);font-size:.85rem}
.modal label{display:block;font-size:.82rem;font-weight:700;color:var(--deep);margin:10px 0 4px}
.modal input{width:100%;font-family:inherit;font-size:.95rem;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}
.modal input:focus{outline:none;border-color:var(--green)}
.modal input#jcode{text-transform:uppercase;letter-spacing:3px;font-weight:800}
.modal .mrow{display:flex;gap:8px;margin-top:16px}
.modal .mrow .btn{flex:1}
.modal .mmsg{font-size:.85rem;margin-top:10px;min-height:1em;color:var(--muted)}
.modal .mmsg.err{color:var(--bad)}
/* ---- เกียรติบัตร ---- */
.certwrap{max-width:820px;margin:10px auto 0}
.certwrap canvas{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--line);
  box-shadow:0 18px 40px -22px rgba(8,74,36,.55);background:#fff}
.certform{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin:14px 0}
.certform input{flex:1;min-width:220px;max-width:420px;font-family:inherit;font-size:1rem;font-weight:700;
  padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.certform input:focus{outline:none;border-color:var(--green)}
.certbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.lockcard{opacity:.75}
.certprog{height:9px;border-radius:99px;background:rgba(8,74,36,.10);overflow:hidden;margin-top:8px}
.certprog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--rose));transition:width .5s}
.hero{text-align:center;padding:14px 12px 8px}
.hero h1{font-size:clamp(1.7rem,5.2vw,2.6rem);margin-bottom:.25em;
  background:linear-gradient(100deg,var(--deep),#2F7D4F 42%,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#4A6A58;margin:0;font-size:.98rem}
.eq{display:inline-block;margin-top:14px;padding:9px 18px;border-radius:999px;
  background:rgba(175,210,188,.45);border:1px solid rgba(8,74,36,.25);color:var(--deep);
  font-size:.9rem;font-weight:700;letter-spacing:.03em}
.eq sub{font-size:.72em}

.maplist{display:grid;gap:12px;margin-top:22px}
@media(min-width:720px){.maplist{grid-template-columns:1fr 1fr}}
.node{
  display:flex;gap:14px;align-items:center;
  padding:16px;border-radius:var(--r);cursor:pointer;position:relative;overflow:hidden;
  background:var(--panel);border:1px solid var(--line);
  transition:.18s transform,.18s border-color,.18s background;
}
.node:hover{transform:translateY(-3px);border-color:rgba(8,74,36,.38);background:var(--panel2)}
.node.locked{opacity:.5;cursor:not-allowed;filter:grayscale(.55)}
.node.locked:hover{transform:none;border-color:var(--line);background:var(--panel)}
.node .ic{
  width:56px;height:56px;flex:0 0 56px;border-radius:15px;display:grid;place-items:center;font-size:1.7rem;
  background:rgba(255,255,255,.75);border:1px solid var(--line);
}
.stage-ic-img{width:100%;height:100%;object-fit:contain;padding:3px;display:block}
.stagehead .ic .stage-ic-img{width:46px;height:46px;padding:0}
.node .body{flex:1;text-align:left}
.node .body .t{font-weight:800;font-size:1.02rem}
.node .body .d{font-size:.84rem;color:var(--muted);line-height:1.5}
.node .stars{font-size:.9rem;letter-spacing:2px;color:var(--gold);margin-top:3px}
.node .stars .off{color:rgba(8,74,36,.16)}
.node.done{border-color:rgba(8,74,36,.4)}
.node.done .ic{background:rgba(175,210,188,.65)}
.node .no{position:absolute;top:8px;right:12px;font-size:.7rem;font-weight:800;color:var(--muted);letter-spacing:.1em}

.stagehead{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stagehead .ic{font-size:2rem}
.stagehead h2{margin:0}
.stagehead .sub{color:var(--muted);font-size:.88rem}
.bar{height:7px;border-radius:99px;background:rgba(8,74,36,.10);overflow:hidden;margin:10px 0 18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--lime));transition:width .4s cubic-bezier(.4,0,.2,1)}

.note{
  border-radius:12px;padding:12px 14px;font-size:.88rem;margin:12px 0;
  border-left:4px solid var(--sky);background:rgba(92,144,166,.13);
}
.note.warn{border-left-color:var(--gold);background:rgba(242,103,22,.11)}
.note.key{border-left-color:var(--lime);background:rgba(47,125,79,.11)}
.note.miss{border-left-color:var(--rose);background:rgba(231,57,13,.09)}
.note b{color:var(--deep)}

.feedback{border-radius:12px;padding:12px 14px;margin-top:14px;font-size:.9rem;display:none}
.feedback.show{display:block;animation:pop .3s}
.feedback.good{background:rgba(47,125,79,.14);border:1px solid rgba(47,125,79,.4)}
.feedback.bad{background:rgba(231,57,13,.11);border:1px solid rgba(231,57,13,.35)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* labeling */
.diagram{position:relative;width:100%;aspect-ratio:900/560;margin:6px 0 4px}
.diagram svg{width:100%;height:100%;display:block}
@supports (container-type:inline-size){
  .diagram{container-type:inline-size}
  .slot{min-width:11.5cqw;font-size:clamp(7px,2.5cqw,.76rem);padding:.7cqw 1.2cqw;border-radius:min(10px,1.4cqw)}
}
.slot{
  position:absolute;transform:translate(-50%,-50%);
  min-width:104px;padding:6px 10px;border-radius:10px;text-align:center;
  font-size:.76rem;font-weight:700;cursor:pointer;
  background:rgba(255,255,255,.9);border:2px dashed rgba(8,74,36,.38);color:var(--muted);
  transition:.15s;white-space:nowrap;box-shadow:0 1px 4px rgba(8,74,36,.08);
}
.slot:hover{border-color:var(--lime);color:var(--deep)}
.slot.armed{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,103,22,.22)}
.slot.filled{border-style:solid;border-color:var(--green);background:rgba(175,210,188,.85);color:var(--deep)}
.slot.wrong{border-color:var(--bad);background:rgba(231,57,13,.16);animation:shake .35s}
@keyframes shake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 6px),-50%)}75%{transform:translate(calc(-50% + 6px),-50%)}}
/* กระดานติดป้ายรอบภาพจริง (ด่าน 1)
   จอกว้าง = ป้าย ??? วางรอบภาพ มีเส้นประชี้ไปยังจุดสีส้มบนภาพ
   จอแคบ (มือถือ) = จุดบนภาพกลายเป็นหมายเลข แล้วป้ายเรียงเป็นรายการใต้ภาพแทน ไม่เบียดกัน
   พิกัดทุกจุดคิดเป็นสัดส่วน จึงเปลี่ยนไฟล์ภาพได้โดยไม่ต้องแก้โครง */
/* ตัวจำกัดความกว้างต้องเป็น "กล่องแม่" ของ .mboard เสมอ
   เพราะ CSS คิด padding ที่เป็น % จากความกว้างของกล่องแม่ ไม่ใช่ของตัวเอง
   ถ้าไปจำกัดความกว้างที่ .mboard โดยตรง ขอบรอบภาพจะกว้างผิดสัดส่วน
   แล้วเส้นประกับป้ายจะเลื่อนไปจากจุดบนภาพทั้งกระดาน */
.mwrap{max-width:1000px;margin:10px auto 0}
.mwrap.tall{max-width:720px}
.mwrap.taller{max-width:700px}
.mboard{position:relative;width:100%;padding:20% 12.5% 12.5% 14.5%}
.mimg{position:relative;overflow:hidden;border-radius:14px;background:#fff;
  box-shadow:0 5px 18px -8px rgba(8,74,36,.3)}
.mimg img{width:100%;display:block;border-radius:14px;box-shadow:0 5px 18px -8px rgba(8,74,36,.3)}
.leads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cwrap{position:absolute;inset:0;pointer-events:none}
/* จุดยึดบนภาพ: บนจอกว้างทำเป็นวงแหวนโปร่ง จะได้มองเห็นอวัยวะที่อยู่ใต้จุด
   ส่วนบนมือถือกลับไปเป็นจุดทึบ เพราะต้องอ่านตัวเลขในจุดได้ชัด */
.anchor{position:absolute;transform:translate(-50%,-50%);width:15px;height:15px;border-radius:50%;
  background:rgba(255,255,255,.45);border:3px solid var(--gold);
  box-shadow:0 0 0 1.5px rgba(255,255,255,.95),0 1px 4px rgba(8,74,36,.4);
  display:grid;place-items:center;color:#FFF7F0;font-weight:800;font-size:0}
.anchor.done{background:var(--lime);border-color:#fff}
.slot.callout{pointer-events:auto;min-width:92px;padding:5px 9px;font-size:.74rem}
.slot.callout i{display:none}
@media (max-width:640px){
  .mboard{padding:0}
  .leads{display:none}
  .cwrap{position:static;display:grid;gap:8px;margin-top:14px;pointer-events:auto;
    grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
  .slot.callout{position:static;transform:none;display:flex;align-items:center;gap:9px;width:100%;
    min-width:0;left:auto!important;top:auto!important;text-align:left;white-space:normal;padding:9px 12px;font-size:.8rem}
  .slot.callout i{flex:0 0 auto;display:grid;place-items:center;width:25px;height:25px;border-radius:50%;
    background:var(--gold);color:#FFF7F0;font-style:normal;font-weight:800;font-size:.78rem}
  .slot.callout.filled i{background:var(--lime)}
  .anchor{width:clamp(21px,5vw,27px);height:clamp(21px,5vw,27px);font-size:clamp(.62rem,2.3vw,.8rem);
    background:var(--gold);border:2px solid #fff;box-shadow:0 1px 5px rgba(8,74,36,.45)}
}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tok{
  padding:8px 14px;border-radius:999px;font-size:.85rem;font-weight:700;cursor:pointer;
  background:var(--panel2);border:1px solid var(--line);transition:.15s;
}
.tok:hover{border-color:var(--lime)}
.tok.sel{background:linear-gradient(135deg,var(--gold),var(--rose));color:#FFF7F0;border-color:transparent;transform:translateY(-2px);
  box-shadow:0 5px 14px -6px rgba(231,57,13,.6)}
.tok.used{display:none}

/* chain */
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:56px;
  padding:14px;border-radius:14px;background:rgba(255,255,255,.66);border:1px solid var(--line)}
.chain .ph{color:var(--muted);font-size:.85rem}
.link{padding:8px 13px;border-radius:11px;font-size:.82rem;font-weight:700;color:var(--deep);
  background:rgba(175,210,188,.8);border:1px solid rgba(8,74,36,.32);animation:pop .25s}
.arrow{color:var(--muted);font-size:.9rem}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pool .tok{font-size:.82rem}
.pool .tok.bad{animation:shake .35s;background:rgba(231,57,13,.16);border-color:var(--bad)}

/* wheel / phases */
.calvin{display:grid;gap:16px}
@media(min-width:800px){.calvin{grid-template-columns:1fr 1.1fr}}
.wheel{position:relative;aspect-ratio:1;max-width:340px;margin:0 auto;width:100%}
.wheel svg{width:100%;height:100%}
.phase{padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.66);margin-bottom:12px;transition:.2s}
.phase.active{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,103,22,.16)}
.phase.solved{border-color:rgba(8,74,36,.42);background:rgba(175,210,188,.4)}
.phase h4{margin:0 0 4px;font-size:.98rem}
.phase .hintline{font-size:.8rem;color:var(--muted);margin-bottom:10px}
.step{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:7px 0;flex-wrap:wrap}
.step .nm{font-size:.88rem;font-weight:700}
.stepper{display:flex;align-items:center;gap:4px;background:rgba(8,74,36,.07);border-radius:10px;padding:3px}
.stepper button{width:30px;height:30px;border-radius:8px;border:none;background:rgba(255,255,255,.9);
  color:var(--deep);font-size:1.05rem;font-weight:800;cursor:pointer;line-height:1}
.stepper button:active{background:var(--green);color:#FBF8EC}
.stepper .n{min-width:34px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}

/* ledger (sim) */
.sim{display:grid;gap:16px}
@media(min-width:820px){.sim{grid-template-columns:1fr 1.05fr}}
.specbox{background:rgba(255,255,255,.66);border:1px solid var(--line);border-radius:14px;padding:14px;
  box-shadow:0 2px 12px rgba(8,74,36,.06)}
.toggle{display:flex;gap:8px;margin:6px 0 14px}
.toggle button{flex:1;padding:9px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);font-weight:700;font-size:.82rem;cursor:pointer}
.toggle button.on{background:rgba(175,210,188,.8);border-color:var(--green);color:var(--deep)}
.tlabel{font-size:.82rem;font-weight:700;color:var(--deep);margin-bottom:2px}
.ledtable{width:100%;border-collapse:collapse;font-size:.86rem}
.ledtable th,.ledtable td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right}
.ledtable th:first-child,.ledtable td:first-child{text-align:left}
.ledtable th{color:var(--deep);font-size:.82rem}
.ledtable tfoot td{font-weight:800;border-top:2px solid var(--line);border-bottom:none;font-size:1rem;color:var(--deep)}
.ledtable .zero{color:var(--muted);opacity:.6}
.totbox{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;margin-top:12px}
.totbox .k{font-size:.78rem;color:var(--muted)}
.totbox .v{font-size:2.4rem;font-weight:800;color:var(--lime);font-variant-numeric:tabular-nums;line-height:1.1}
.mito-vis{background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.mito-vis svg{width:100%;height:auto;display:block}

/* scenarios */
.scene{background:rgba(255,255,255,.68);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;
  box-shadow:0 2px 12px rgba(8,74,36,.06)}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{
  text-align:left;padding:12px 14px;border-radius:12px;cursor:pointer;font-size:.9rem;
  background:var(--panel);border:1px solid var(--line);transition:.15s;
}
.opt:hover{background:var(--panel2);border-color:rgba(8,74,36,.38)}
.opt.correct{background:rgba(47,125,79,.18);border-color:var(--ok)}
.opt.incorrect{background:rgba(231,57,13,.13);border-color:var(--bad)}
.opt.disabled{pointer-events:none;opacity:.75}

/* flashcards */
.deckbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.deckbar button{padding:7px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);font-size:.83rem;font-weight:700;cursor:pointer}
.deckbar button.on{background:linear-gradient(135deg,var(--gold),var(--rose));color:#FFF7F0;border-color:transparent}
.fcstage{perspective:1400px;margin:0 auto;max-width:560px}
.fc{position:relative;width:100%;min-height:290px;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1)}
.fc.flip{transform:rotateY(180deg)}
.fc .side{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:20px;padding:26px;display:flex;flex-direction:column;justify-content:center;
  border:1px solid var(--line);box-shadow:0 6px 22px -10px rgba(8,74,36,.35);
}
.fc .front{background:linear-gradient(150deg,rgba(175,210,188,.72),rgba(220,235,225,.55)),#fff;align-items:center;text-align:center}
.fc .back{background:linear-gradient(150deg,rgba(247,195,156,.6),rgba(251,228,210,.45)),#fff;transform:rotateY(180deg)}
.fc .tag{font-size:.7rem;letter-spacing:.14em;color:#5F7D6B;text-transform:uppercase;margin-bottom:10px}
.fc .term{font-size:1.5rem;font-weight:800;margin-bottom:6px;line-height:1.3;color:var(--deep)}
.fc .en{font-size:.9rem;color:var(--muted);font-style:italic}
.fc .def{font-size:.98rem;line-height:1.7}
.fc .hint{margin-top:auto;padding-top:14px;font-size:.75rem;color:var(--muted);text-align:center}
.fcnav{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:18px}
.fcnav .count{font-weight:800;font-variant-numeric:tabular-nums;min-width:76px;text-align:center}

.result{text-align:center;padding:26px 16px}
.result .big{font-size:3rem;letter-spacing:6px;color:var(--gold)}
.result .big .off{color:rgba(8,74,36,.16)}
.result h2{margin-top:10px}

.footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
  color:var(--muted);font-size:.78rem;text-align:center;line-height:1.8}
.footer .fb{display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:9px}
.footer .fb img{height:26px;width:auto;opacity:.92}
.footer .fb span{font-weight:800;color:var(--deep);font-size:.92rem}
.footer .fb span b{color:var(--gold)}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140%);
  background:linear-gradient(135deg,#2F7D4F,#4E9370);color:#FBF8EC;
  padding:11px 22px;border-radius:999px;font-weight:800;font-size:.9rem;z-index:200;
  box-shadow:0 12px 30px -10px rgba(8,74,36,.6);
  /* ซ่อนสนิทตอนไม่มีข้อความ ไม่ให้โผล่เป็นแถบเขียวที่ขอบล่างจอ */
  opacity:0;visibility:hidden;pointer-events:none;
  transition:transform .35s cubic-bezier(.4,0,.2,1), opacity .25s linear, visibility 0s linear .35s;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;
  transition:transform .35s cubic-bezier(.4,0,.2,1), opacity .2s linear, visibility 0s}

.buckets{display:grid;gap:10px;margin-top:14px}
@media(min-width:700px){.buckets{grid-template-columns:repeat(3,1fr)}}
.bucket{background:rgba(255,255,255,.66);border:2px dashed var(--line);border-radius:14px;padding:12px;min-height:96px;transition:.15s}
.bucket.armed{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,103,22,.18)}
.bucket h4{margin:0 0 8px;font-size:.92rem;display:flex;align-items:center;gap:6px}
.bucket .items{display:flex;flex-wrap:wrap;gap:6px}
.bucket .items span{font-size:.78rem;font-weight:700;padding:5px 10px;border-radius:999px;
  background:rgba(175,210,188,.75);border:1px solid rgba(8,74,36,.28);animation:pop .25s}
.match{display:grid;gap:10px}
@media(min-width:760px){.match{grid-template-columns:1fr 1fr}}
.mcard{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:13px;
  background:rgba(255,255,255,.7);border:1px solid var(--line);cursor:pointer;transition:.15s}
.mcard:hover{border-color:rgba(8,74,36,.4)}
.mcard.armed{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,103,22,.18)}
.mcard.done{background:rgba(175,210,188,.5);border-color:var(--green);cursor:default}
.mcard .em{font-size:1.5rem;line-height:1.2}
.mcard .tx{flex:1;font-size:.87rem;line-height:1.55}
.mcard .tx b{color:var(--deep)}
.mcard .tx b.h{display:block;font-size:.95rem;margin-bottom:2px}
.mcard.wrong{animation:shake .35s;border-color:var(--bad)}
.cmp{width:100%;border-collapse:collapse;font-size:.87rem}
.cmp th,.cmp td{padding:8px;border-bottom:1px solid var(--line);text-align:center}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp .yes{color:var(--ok);font-weight:800}

/* ---- เพิ่มเติมสำหรับเกมการแบ่งเซลล์ ---- */
.cyc{max-width:420px;margin:0 auto;display:block}
.cyc .seg{cursor:pointer;transition:.15s}
.cyc .seg:hover{filter:brightness(1.06)}
.cellview{display:grid;gap:12px;margin:14px 0}
@media(min-width:760px){.cellview{grid-template-columns:1fr 1fr}}
.cellbox{background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.cellbox h4{margin:0 0 6px;font-size:.92rem}
.cellbox .big{font-size:1.7rem;font-weight:800;color:var(--deep);font-variant-numeric:tabular-nums}
.cellbox .lbl{font-size:.78rem;color:var(--muted)}
/* ---- ห้องทดลองของ Griffith (ด่าน 2) — ใช้คำนำหน้า gl- ทั้งหมดกันชนกับคลาสอื่น ---- */
.gl-lab{background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.62));
  border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;
  box-shadow:0 10px 30px -22px rgba(8,74,36,.6)}
.gl-benchrow{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:760px){.gl-benchrow{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}}
.gl-panel{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:14px;padding:12px}
.gl-panel h4{margin:0 0 8px;font-size:.9rem;color:var(--deep);display:flex;align-items:center;gap:6px}
.gl-rack{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gl-tube{cursor:grab;touch-action:none;text-align:center;border-radius:12px;padding:8px 4px 6px;
  border:2px solid transparent;background:rgba(255,255,255,.7);transition:.15s}
.gl-tube:hover{border-color:var(--line)}
.gl-tube.sel{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,103,22,.18)}
.gl-tube.used{opacity:.42;cursor:default}
.gl-tube svg{width:100%;max-width:54px;height:auto;display:block;margin:0 auto}
.gl-tube .gl-cap{display:block;font-size:.68rem;font-weight:700;line-height:1.35;margin-top:4px;color:var(--deep)}
.gl-bench{position:relative;display:flex;align-items:center;justify-content:space-around;gap:10px;
  min-height:170px;border-radius:14px;padding:10px;
  background:repeating-linear-gradient(90deg,rgba(175,210,188,.22) 0 22px,rgba(175,210,188,.10) 22px 44px)}
.gl-drop{border:2px dashed transparent;border-radius:14px;padding:8px;transition:.15s;text-align:center}
.gl-drop.armed{border-color:var(--gold);background:rgba(242,103,22,.08)}
.gl-drop.hot{border-color:var(--lime);background:rgba(47,125,79,.12)}
.gl-drop svg{width:100%;max-width:150px;height:auto;display:block;margin:0 auto}
#avTube svg{max-width:76px}   /* หลอดทดลองทรงสูง ไม่ให้กว้างเท่าเข็มฉีดยา */
.gl-drop .gl-cap{display:block;font-size:.72rem;font-weight:700;margin-top:4px;color:var(--muted)}
.gl-ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%);width:54px}
.gl-predict{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.gl-log{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:10px}
.gl-log th,.gl-log td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.gl-log th{color:var(--deep);font-weight:800;white-space:nowrap}
.gl-log td.gl-res{font-weight:800;white-space:nowrap}
.gl-log tr.gl-todo td{color:var(--muted)}
.gl-dead{color:var(--bad)} .gl-alive{color:var(--ok)}
@media(max-width:430px){   /* ตารางสรุปผลต้องพอดีจอแคบ */
  .gl-log{font-size:.74rem}
  .gl-log th,.gl-log td{padding:6px 4px}
  .gl-log td.gl-res{white-space:normal}
}
@keyframes gl-shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.gl-bench.gl-inject{animation:gl-shake .4s}

/* ── แท่นประกอบนิวคลีโอไทด์ (ด่าน 3) ─────────────────────────────── */
.nb-lab{border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--panel2)}
.nb-task{background:var(--green-pale);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;font-size:.92rem;line-height:1.65}
.nb-bench{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;margin:12px 0;
  padding:14px 8px;border-radius:14px;
  background:repeating-linear-gradient(90deg,rgba(124,184,148,.10) 0 22px,rgba(124,184,148,.03) 22px 44px)}
.nb-slot{flex:0 0 auto;width:118px;min-height:116px;border:2px dashed rgba(8,74,36,.3);border-radius:14px;
  background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;padding:8px 6px;text-align:center;transition:border-color .15s,box-shadow .15s}
.nb-slot.armed{border-color:var(--gold)}
.nb-slot.hot{border-color:var(--lime);box-shadow:0 0 0 5px rgba(47,125,79,.16)}
.nb-slot.full{border-style:solid;border-color:var(--ok);background:var(--green-pale)}
.nb-slot img{max-width:100%;height:auto;display:block}
.nb-slot .nb-num{font-size:1.3rem;font-weight:800;color:rgba(8,74,36,.35);line-height:1}
.nb-cap{font-size:.67rem;font-weight:700;line-height:1.35;color:var(--deep)}
.nb-link{font-weight:800;font-size:1.3rem;color:rgba(8,74,36,.4);padding:0 2px}
@media(max-width:520px){   /* บีบให้สามช่องอยู่แถวเดียวกันบนจอมือถือ */
  .nb-bench{gap:2px;padding:10px 4px}
  .nb-slot{width:94px;min-height:104px;padding:6px 4px}
  .nb-link{font-size:1rem;padding:0}
}
.nb-tray{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.nb-piece{cursor:grab;touch-action:none;border:1.5px solid var(--line);border-radius:12px;background:#fff;
  padding:8px 6px 6px;text-align:center;transition:border-color .15s,box-shadow .15s,opacity .2s}
.nb-piece:hover{border-color:rgba(8,74,36,.35)}
.nb-piece.sel{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,103,22,.18)}
.nb-piece.used{opacity:.35;cursor:default}
.nb-piece img{max-width:100%;height:auto;display:block;margin:0 auto 4px}
.nb-ghost img{height:56px;width:auto;filter:drop-shadow(0 10px 18px rgba(4,38,30,.4))}
.nb-shelf{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
@media(min-width:620px){.nb-shelf{grid-template-columns:repeat(4,1fr)}}
.nb-chip{border:1px dashed var(--line);border-radius:12px;padding:8px 6px;text-align:center;
  font-size:.74rem;font-weight:700;color:var(--muted);background:rgba(255,255,255,.5)}
.nb-chip.done{border-style:solid;border-color:var(--ok);color:var(--deep);background:var(--green-pale)}
.nb-chip img{height:40px;width:auto;display:block;margin:0 auto 4px}
/* ── เครื่องจำลองดีเอ็นเอ 3 มิติ (ด่าน 4) ─────────────────────────── */
.dh-lab{border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--panel2)}
.dh-row{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:760px){.dh-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.dh-panel{border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;background:#fff}
.dh-panel h4{margin:0 0 8px;font-size:.88rem;color:var(--deep)}
.dh-stage{position:relative;height:336px;perspective:1000px;perspective-origin:50% 46%;
  border-radius:12px;overflow:hidden;border:2px dashed transparent;transition:.15s;
  background:radial-gradient(120% 90% at 50% 0%,rgba(124,184,148,.18),rgba(124,184,148,.04) 70%)}
.dh-stage.armed{border-color:var(--gold)}
.dh-stage.hot{border-color:var(--lime);background:rgba(47,125,79,.10)}
.dh{position:absolute;left:50%;top:22px;width:0;height:0;transform-style:preserve-3d;
  animation:dh-rock 9s ease-in-out infinite alternate}
.dh.dh-spin{animation:dh-turn 15s linear infinite}
@keyframes dh-rock{from{transform:rotateY(-30deg)}to{transform:rotateY(30deg)}}
@keyframes dh-turn{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
.dh-rung{position:absolute;left:-86px;top:0;width:172px;height:20px;
  display:flex;align-items:center;gap:3px;transform-style:preserve-3d}
.dh-bb{width:21px;height:21px;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 34% 28%,#fff,var(--bb) 78%);
  border:1px solid rgba(4,38,30,.3);box-shadow:0 2px 5px -2px rgba(4,38,30,.5)}
.dh-bb.old{--bb:#5C90A6}
.dh-bb.new{--bb:#F26716}
.dh-bb.gone{opacity:0;transform:translateX(26px)}
.dh-base{position:relative;flex:1 1 0;height:14px;border-radius:3px;border:1px solid rgba(4,38,30,.3);
  transform-style:preserve-3d;font-size:.58rem;font-weight:800;color:#12251A}
.dh-base span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  backface-visibility:hidden}
.dh-base span.bk{transform:rotateY(180deg)}
.dh-half{position:absolute;left:-86px;top:0;width:172px;height:15px;
  display:flex;align-items:center;justify-content:space-between;transform-style:preserve-3d;
  pointer-events:none}
.dh-half .dh-bb{width:15px;height:15px}
.dh-base.empty{background:repeating-linear-gradient(45deg,rgba(8,74,36,.09) 0 4px,transparent 4px 8px);
  border-style:dashed;color:transparent}
.dh-seq{margin-top:10px;font-size:.74rem;line-height:2.1;color:var(--deep)}
.dh-seq b{display:inline-block;min-width:66px;font-size:.72rem}
.dh-seq i{display:inline-block;width:19px;text-align:center;font-style:normal;font-weight:800;
  border-radius:4px;border:1px solid rgba(4,38,30,.22);margin:0 1px}
.dh-seq i.blank{border-style:dashed;color:transparent;background:rgba(8,74,36,.05)}
.dh-seq i.now{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,103,22,.25)}
@media(max-width:430px){
  .dh-seq{font-size:.68rem}
  .dh-seq b{min-width:54px}
  .dh-seq i{width:16px;margin:0}
}
.dh-base.gone{opacity:0}
.dh-rung.active .dh-base.empty{border-color:var(--gold);border-style:solid;
  box-shadow:0 0 0 3px rgba(242,103,22,.3);animation:dh-pulse 1.1s ease-in-out infinite}
@keyframes dh-pulse{0%,100%{box-shadow:0 0 0 2px rgba(242,103,22,.25)}
  50%{box-shadow:0 0 0 6px rgba(242,103,22,.12)}}
.dh-base.fresh{box-shadow:0 0 0 2px rgba(242,103,22,.5)}
.dh-end{position:absolute;left:50%;transform:translateX(-50%);font-size:.66rem;font-weight:800;
  color:var(--muted);white-space:nowrap}
.dh-tray{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.dh-tok{cursor:grab;touch-action:none;border:1.5px solid var(--line);border-radius:12px;background:#fff;
  padding:8px 4px 6px;text-align:center;transition:border-color .15s,box-shadow .15s}
.dh-tok:hover{border-color:rgba(8,74,36,.35)}
.dh-tok.sel{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,103,22,.18)}
.dh-chip{display:block;height:26px;border-radius:5px;border:1px solid rgba(4,38,30,.3);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;color:#12251A}
.dh-tok .gl-cap{display:block;font-size:.64rem;font-weight:700;margin-top:5px;color:var(--deep)}
.dh-ghost{width:56px}
.dh-ghost .dh-chip{box-shadow:0 12px 24px -10px rgba(4,38,30,.65)}
.dh-step{background:var(--green-pale);border:1px solid var(--line);border-radius:12px;
  padding:9px 12px;font-size:.88rem;line-height:1.6;margin-bottom:10px}
.dh-legend{font-size:.72rem;color:var(--muted);margin-top:8px;line-height:1.7}
.dh-dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;
  border:1px solid rgba(4,38,30,.3)}
/* ── ห้องถอดรหัส–แปลรหัส (ด่าน 5) ───────────────────────────────── */
.tx-lab{border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--panel2)}
.tx-step{background:var(--green-pale);border:1px solid var(--line);border-radius:12px;
  padding:9px 12px;font-size:.88rem;line-height:1.6;margin-bottom:10px}
.tx-row{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:880px){.tx-row{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.tx-panel{border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;background:#fff}

<body>
<div class="wrap">

  <div class="hud">
    <div class="brand"><span class="leaf">🔬</span><span>ศูนย์ถอดรหัสชีวิต</span></div>
    <div class="spacer"></div>
    <div class="chip xp">⚡ XP <b id="hudXp">0</b></div>
    <div class="chip">⭐ <b id="hudStars">0</b>/18</div>
    <button class="btn sm ghost" id="btnHome">🗺️ แผนที่</button>
  </div>

  <div id="app"></div>

  <div class="footer">
    <div class="fb"><img src="../icons/brand.png" alt="โลโก้ Biology" onerror="this.remove()"><span>Biology<b>.</b></span></div>
    เกมประกอบตำราชีววิทยา ม.4 เล่ม 2 · บทที่ 4 เรื่อง <b>โครโมโซมและสารพันธุกรรม</b><br>
    อิงหลักสูตร สสวท. (ฉบับปรับปรุง พ.ศ. 2560) · ความก้าวหน้าถูกบันทึกไว้ในเครื่องของผู้เล่นเอง
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================================
   ศูนย์ถอดรหัสชีวิต — เกมประกอบการเรียนรู้ เรื่องโครโมโซมและสารพันธุกรรม (ม.4 เล่ม 2 บทที่ 4)
   ไฟล์เดียว ทำงานออฟไลน์ · ใช้เครื่องยนต์ชุดเดียวกับเกมอื่นในเว็บไซต์นี้
   ========================================================================= */

const app   = document.getElementById('app');
const toastEl = document.getElementById('toast');
const SAVE_KEY = 'dna-chromosome-quest-v1';

const defaultState = { xp:0, stars:{}, plays:{}, secs:{}, miss:{} };
let S = load();

function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return structuredClone(defaultState);
    return Object.assign(structuredClone(defaultState), JSON.parse(raw));
  }catch(e){ return structuredClone(defaultState); }
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function totalStars(){ return Object.values(S.stars).reduce((a,b)=>a+b,0); }
function syncHud(){
  document.getElementById('hudXp').textContent = S.xp;
  document.getElementById('hudStars').textContent = totalStars();
}
let toastTimer;
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 2200);
}
function shuffle(a){
  const r=a.slice();
  for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}
function stars(n,max=3){ let s=''; for(let i=0;i<max;i++) s+= i<n?'★':'<span class="off">★</span>'; return s; }

const STAGES = [
  { id:'chromosome', ic:'🔬', title:'ห้องแคริโอไทป์',   desc:'รูปร่าง จำนวน และส่วนประกอบของโครโมโซม · ยีนกับจีโนม', req:0 },
  { id:'discover',   ic:'🕵️', title:'ห้องสืบคดี DNA',    desc:'การทดลองที่พิสูจน์ว่า DNA เป็นสารพันธุกรรม', req:1 },
  { id:'builder',    ic:'🧩', title:'ห้องประกอบเกลียวคู่', desc:'นิวคลีโอไทด์ · เบสคู่สม · กฎของ Chargaff · โครงสร้างเกลียวคู่', req:2 },
  { id:'copy',       ic:'📄', title:'ห้องจำลองดีเอ็นเอ',  desc:'การจำลองแบบกึ่งอนุรักษ์ · ลีดดิงและแลกกิงสแทรนด์', req:3 },
  { id:'factory',    ic:'🏭', title:'ห้องถอดรหัส–แปลรหัส', desc:'การสังเคราะห์โปรตีน · mRNA tRNA rRNA · รหัสพันธุกรรม', req:4 },
  { id:'boss',       ic:'👹', title:'บอส: ห้องวินิจฉัยการกลาย', desc:'มิวเทชันระดับยีนและระดับโครโมโซม · วินิจฉัยกรณีศึกษา', req:5 }
];

function renderMap(){
  syncHud();
  const cleared = STAGES.filter(s=>S.stars[s.id]>0).length;
  app.innerHTML = `
    <div class="hero">
      <div class="pub"><img src="../icons/brand.png" alt="โลโก้ Biology" onerror="this.remove()"><span>Biology<b>.</b></span></div>
      <h1>ศูนย์ถอดรหัสชีวิต</h1>
      <p>ลักษณะของสิ่งมีชีวิตถูกเก็บไว้ใน<strong>โครโมโซม</strong>อย่างไร<br>
         และ<strong>DNA</strong> แปลข้อมูลนั้นออกมาเป็นสิ่งมีชีวิตได้อย่างไร</p>
      <div class="eq">DNA → นิวคลีโอโซม → โครมาทิน → โครโมโซม · DNA → mRNA → โปรตีน</div>
      <div id="classSlot"></div>
    </div>
    <div class="maplist">
      ${STAGES.map((s,i)=>{
        const got=S.stars[s.id]||0, locked=cleared<s.req;
        return `<div class="node ${locked?'locked':''} ${got?'done':''}" data-id="${s.id}">
          <span class="no">ด่าน ${i+1}</span>
          <div class="ic">${locked?'🔒':s.ic}</div>
          <div class="body">
            <div class="t">${s.title}</div>
            <div class="d">${locked?`ผ่านด่านก่อนหน้าให้ครบ ${s.req} ด่านเพื่อปลดล็อก`:s.desc}</div>
            ${locked?'':`<div class="stars">${stars(got)}</div>`}
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="card" style="margin-top:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
      <div style="font-size:2rem">🃏</div>
      <div style="flex:1;min-width:190px">
        <div style="font-weight:800">การ์ดคำศัพท์</div>
        <div class="small muted">${CARDS.length} การ์ด ทบทวนศัพท์ไทย–อังกฤษ พร้อมนิยาม เปิดเล่นได้ตลอดเวลา</div>
      </div>
      <button class="btn gold" id="btnCards">เปิดสำรับ</button>
    </div>
    ${certCardHtml()}
    <div class="center endrow" style="margin-top:18px">
      <a class="btn ghost sm" href="../">🏠 กลับหน้าแรก</a>
      <button class="btn ghost sm" id="btnReset">🔄 เริ่มใหม่ทั้งหมด</button>
    </div>
  `;
  app.querySelectorAll('.node').forEach(n=>{
    n.addEventListener('click',()=>{
      if(n.classList.contains('locked')){ toast('🔒 ยังไม่ปลดล็อกด่านนี้'); return; }
      openStage(n.dataset.id);
    });
  });
  document.getElementById('btnCards').onclick = renderCards;
  const certBtn = document.getElementById('btnCert');
  if(certBtn && !certBtn.disabled) certBtn.onclick = renderCert;
  document.getElementById('btnReset').onclick = ()=>{
    if(confirm('ล้างดาวและคะแนนทั้งหมดในเครื่องนี้? (ห้องเรียนที่เข้าร่วมไว้ยังอยู่)')){
      S=structuredClone(defaultState); save(); renderMap(); toast('เริ่มใหม่แล้ว');
    }
  };
  renderClassChip();
  window.scrollTo({top:0,behavior:'smooth'});
}

function stageShell(id, extraHtml=''){
  const st = STAGES.find(s=>s.id===id);
  return `<div class="stagehead">
      <div class="ic">${st.ic}</div>
      <div style="flex:1;min-width:200px"><h2>${st.title}</h2><div class="sub">${st.desc}</div></div>
    </div>${extraHtml}`;
}
let stageT0 = 0;        // เวลาเริ่มด่าน ใช้คำนวณเวลาที่ใช้ต่อด่าน
let stageMiss = 0;      // จำนวนครั้งที่ตอบผิดในด่านที่กำลังเล่น (ตั้งค่าก่อนเรียก finishStage)
function openStage(id){
  window.scrollTo({top:0});
  stageT0 = Date.now(); stageMiss = 0;
  ({chromosome:stageChromosome, discover:stageDiscover, builder:stageBuilder,
    copy:stageCopy, factory:stageFactory, boss:stageBoss})[id]();
}
function finishStage(id, got, xp, summaryHtml){
  const prev=S.stars[id]||0; if(got>prev) S.stars[id]=got;
  S.plays = S.plays || {}; S.plays[id] = (S.plays[id]||0) + 1;
  S.xp+=xp; save(); syncHud();
  const secs = stageT0 ? Math.round((Date.now()-stageT0)/1000) : 0;
  const misses = Math.max(0, stageMiss|0); stageMiss = 0;
  S.secs = S.secs || {}; S.miss = S.miss || {};
  S.secs[id] = secs; S.miss[id] = misses;   // เก็บไว้เผื่อเข้าร่วมห้องทีหลัง จะได้ส่งเวลาจริงตามไปด้วย
  save();
  sendScore(id, got, misses, secs);   // ส่งคะแนนให้ครู (ถ้าเข้าร่วมห้อง)
  app.innerHTML = `
    <div class="card result">
      <div class="big">${stars(got)}</div>
      <h2>${got===3?'สมบูรณ์แบบ!':got===2?'เก่งมาก!':got===1?'ผ่านแล้ว':'ยังไม่ผ่าน'}</h2>
      <p class="muted">ได้รับ <b style="color:var(--lime)">+${xp} XP</b></p>
      <div style="text-align:left;max-width:640px;margin:18px auto 0">${summaryHtml}</div>
      <div style="margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn" id="again">เล่นด่านนี้อีกครั้ง</button>
        <button class="btn primary" id="back">กลับแผนที่ →</button>
      </div>
    </div>`;
  document.getElementById('again').onclick = ()=>openStage(id);
  document.getElementById('back').onclick  = renderMap;
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- เครื่องมือที่ใช้ร่วมกันหลายด่าน ---------- */
/* กระดานติดป้ายรอบภาพ (ใช้ในด่าน 1) — จอกว้างเป็นป้ายรอบภาพ จอแคบเป็นรายการหมายเลข */
const MB = { w:1000, h:723, x0:0.145, y0:0.20, iw:0.73, ih:0.3978 };
const mbX = u => (MB.x0 + u*MB.iw) * MB.w;
const mbY = v => (MB.y0 + v*MB.ih) * MB.w;
/* คำนวณความสูงของกรอบใหม่ตามสัดส่วนภาพ (เช่น '1920/1080') เพื่อให้เส้นประชี้ตรงจุดเสมอ
   ไม่ว่าจะเปลี่ยนไปใช้ภาพที่สัดส่วนต่างจากเดิม */
function mbFit(ratio){
  const a = String(ratio).split('/').map(Number);
  if(a.length===2 && a[0]>0 && a[1]>0) MB.ih = MB.iw * (a[1]/a[0]);
  MB.h = Math.round((MB.y0 + MB.ih + 0.125) * MB.w);   // ขอบบน + ภาพ + ขอบล่าง (ตรงกับ padding ของ .mboard)
}
function calloutBoard(svg, ratio, parts){
  mbFit(ratio);
  const ra = String(ratio).split('/').map(Number);
  const ar = (ra.length===2 && ra[1]) ? ra[0]/ra[1] : 99;
  const tall = ar < 0.8 ? ' taller' : ar < 1.2 ? ' tall' : '';
  const pcx = n => (n/MB.w*100).toFixed(2)+'%';
  const pcy = n => (n/MB.h*100).toFixed(2)+'%';
  const lines = parts.map(p=>`<line x1="${p.lx}" y1="${p.ly}" x2="${mbX(p.u)}" y2="${mbY(p.v)}"
      stroke="#04261E" stroke-width="1.6" stroke-dasharray="7 5" opacity=".65" vector-effect="non-scaling-stroke"/>`).join('');
  return `<div class="bank" id="bank">
    ${shuffle(parts).map(p=>`<div class="tok" data-key="${p.key}">${p.label}</div>`).join('')}
  </div>
  <div class="mwrap${tall}"><div class="mboard">
    <div class="mimg" style="aspect-ratio:${ratio}">
      ${svg}
      ${parts.map((p,i)=>`<div class="anchor" id="pin-${p.key}"
          style="left:${(p.u*100).toFixed(2)}%;top:${(p.v*100).toFixed(2)}%">${i+1}</div>`).join('')}
    </div>
    <svg class="leads" viewBox="0 0 ${MB.w} ${MB.h}" preserveAspectRatio="none" aria-hidden="true">${lines}</svg>
    <div class="cwrap">
      ${parts.map((p,i)=>`<div class="slot callout" data-key="${p.key}"
          style="left:${pcx(p.lx)};top:${pcy(p.ly)}"><i>${i+1}</i><span class="ans">? ? ?</span></div>`).join('')}
    </div>
  </div></div>`;
}
/* ผูกเหตุการณ์ให้กระดานติดป้าย แล้วเรียก onDone(จำนวนที่ผิด) เมื่อวางครบ */
function bindCallout(parts, onDone){
  let placed=0, mistakes=0, armed=null;
  const fb=document.getElementById('fb'), pb=document.getElementById('pb');
  app.querySelectorAll('#bank .tok').forEach(t=>{
    t.onclick = ()=>{
      app.querySelectorAll('.tok').forEach(x=>x.classList.remove('sel'));
      app.querySelectorAll('.slot').forEach(x=>x.classList.remove('armed'));
      if(armed===t.dataset.key){ armed=null; return; }
      armed=t.dataset.key; t.classList.add('sel');
      app.querySelectorAll('.slot:not(.filled)').forEach(x=>x.classList.add('armed'));
    };
  });
  app.querySelectorAll('.slot').forEach(sl=>{
    sl.onclick = ()=>{
      if(!armed || sl.classList.contains('filled')) return;
      const part = parts.find(p=>p.key===armed);
      if(sl.dataset.key===armed){
        sl.classList.add('filled'); sl.classList.remove('armed');
        sl.querySelector('.ans').textContent=part.label;
        const pin=document.getElementById('pin-'+part.key); if(pin) pin.classList.add('done');
        app.querySelector(`.tok[data-key="${armed}"]`).classList.add('used');
        placed++; if(pb) pb.style.width=(placed/parts.length*100)+'%';
        fb.className='feedback show good'; fb.innerHTML=`✅ <b>${part.label}</b> — ${part.info}`;
        armed=null; app.querySelectorAll('.slot').forEach(x=>x.classList.remove('armed'));
        if(placed===parts.length) setTimeout(()=>onDone(mistakes),950);
      }else{
        mistakes++; sl.classList.add('wrong'); setTimeout(()=>sl.classList.remove('wrong'),400);
        fb.className='feedback show bad';
        fb.innerHTML=`❌ หมายเลขนี้ยังไม่ใช่ <b>${part.label}</b> — ลองดูรูปร่างและตำแหน่งของมันอีกครั้ง`;
      }
    };
  });
}
/* จัดกลุ่มลงกล่อง — items = [{n, g, e}] · groups = {key:'ชื่อกล่อง'} */
function bindBuckets(items, groups, pbId, fbId, onDone){
  let armed=null, placed=0, wrong=0;
  const fb=document.getElementById(fbId), pb=document.getElementById(pbId);
  app.querySelectorAll('#pool .tok').forEach(t=>{
    t.onclick=()=>{
      app.querySelectorAll('#pool .tok').forEach(x=>x.classList.remove('sel'));
      app.querySelectorAll('.bucket').forEach(x=>x.classList.remove('armed'));
      if(armed===t.dataset.n){ armed=null; return; }
      armed=t.dataset.n; t.classList.add('sel');
      app.querySelectorAll('.bucket').forEach(x=>x.classList.add('armed'));
    };
  });
  app.querySelectorAll('.bucket').forEach(b=>{
    b.onclick=()=>{
      if(!armed) return;
      const it=items.find(x=>x.n===armed);
      if(it.g===b.dataset.g){
        document.getElementById('items-'+it.g).insertAdjacentHTML('beforeend', `<span>${it.n}</span>`);
        app.querySelector(`#pool .tok[data-n="${armed}"]`).classList.add('used');
        placed++; if(pb) pb.style.width=(placed/items.length*100)+'%';
        fb.className='feedback show good'; fb.innerHTML=`✅ <b>${it.n}</b> — ${it.e}`;
        armed=null; app.querySelectorAll('.bucket').forEach(x=>x.classList.remove('armed'));
        if(placed===items.length) setTimeout(()=>onDone(wrong),1000);
      }else{
        wrong++; b.classList.add('wrong'); setTimeout(()=>b.classList.remove('wrong'),400);
        fb.className='feedback show bad';
        fb.innerHTML=`❌ <b>${it.n}</b> ยังไม่ใช่กล่องนี้ — ลองอ่านหัวข้อกล่องอีกครั้ง`;
      }
    };
  });
}
/* เรียงลำดับขั้นตอน — steps = [{n, e}] เรียงถูกตามลำดับใน array */
function orderBoard(steps, hint){
  const pool = shuffle(steps.map((z,i)=>({...z,i})));
  return `<div class="chain" id="chain"><span class="ph">${hint}</span></div>
    <div class="pool" id="pool">${pool.map(p=>`<div class="tok" data-i="${p.i}">${p.n}</div>`).join('')}</div>`;
}
function bindOrder(steps, onDone){
  let idx=0, wrong=0;
  const chain=document.getElementById('chain'), fb=document.getElementById('fb'), pb=document.getElementById('pb');
  app.querySelectorAll('#pool .tok').forEach(t=>{
    t.onclick=()=>{
      const i=+t.dataset.i;
      if(i===idx){
        if(idx===0) chain.innerHTML=''; else chain.insertAdjacentHTML('beforeend','<span class="arrow">→</span>');
        chain.insertAdjacentHTML('beforeend', `<span class="link">${steps[i].n}</span>`);
        t.classList.add('used');
        fb.className='feedback show good'; fb.innerHTML=`✅ <b>${steps[i].n}</b><br>${steps[i].e}`;
        idx++; if(pb) pb.style.width=(idx/steps.length*100)+'%';
        if(idx===steps.length) setTimeout(()=>onDone(wrong),1300);
      }else{
        wrong++; t.classList.add('bad'); setTimeout(()=>t.classList.remove('bad'),400);
        fb.className='feedback show bad';
        fb.innerHTML=`❌ ยังไม่ถึงคิวของ <b>${steps[i].n}</b> — ลองนึกว่าตอนนี้เซลล์อยู่ขั้นไหน`;
      }
    };
  });
}
/* จับคู่การ์ด — pairs = [{k, n, em, h, d}] */
function matchBoard(pairs){
  const cards = shuffle(pairs);
  return `<div class="bank" id="pool">${shuffle(pairs).map(j=>`<div class="tok" data-k="${j.k}">${j.n}</div>`).join('')}</div>
    <div class="match" id="match" style="margin-top:14px">
      ${cards.map(j=>`<div class="mcard" data-k="${j.k}">
        <div class="em">${j.em}</div>
        <div class="tx"><b class="h">${j.h}</b>${j.d}</div>
      </div>`).join('')}
    </div>`;
}
function bindMatch(pairs, onDone){
  let armed=null, done=0, wrong=0;
  const fb=document.getElementById('fb'), pb=document.getElementById('pb');
  app.querySelectorAll('#pool .tok').forEach(t=>{
    t.onclick=()=>{
      app.querySelectorAll('#pool .tok').forEach(x=>x.classList.remove('sel'));
      app.querySelectorAll('.mcard').forEach(x=>x.classList.remove('armed'));
      if(armed===t.dataset.k){ armed=null; return; }
      armed=t.dataset.k; t.classList.add('sel');
      app.querySelectorAll('.mcard:not(.done)').forEach(x=>x.classList.add('armed'));
    };
  });
  app.querySelectorAll('.mcard').forEach(c=>{
    c.onclick=()=>{
      if(!armed || c.classList.contains('done')) return;
      const j=pairs.find(x=>x.k===armed);
      if(c.dataset.k===armed){
        c.classList.add('done'); c.classList.remove('armed');
        c.querySelector('.tx').insertAdjacentHTML('afterbegin', `<b class="h" style="color:var(--lime)">✅ ${j.n}</b>`);
        app.querySelector(`#pool .tok[data-k="${armed}"]`).classList.add('used');
        done++; if(pb) pb.style.width=(done/pairs.length*100)+'%';
        fb.className='feedback show good'; fb.innerHTML=`✅ <b>${j.n}</b> — ${j.d}`;
        armed=null; app.querySelectorAll('.mcard').forEach(x=>x.classList.remove('armed'));
        if(done===pairs.length) setTimeout(()=>onDone(wrong),1100);
      }else{
        wrong++; c.classList.add('wrong'); setTimeout(()=>c.classList.remove('wrong'),400);
        fb.className='feedback show bad'; fb.innerHTML=`❌ <b>${j.n}</b> ยังไม่ใช่การ์ดนี้ ลองอ่านคำอธิบายอีกครั้ง`;
      }
    };
  });
}
/* ชุดคำถามปรนัยท้ายด่าน — qs = [{q, o[], a, e}] */
function quizRun(qs, hostId, onDone){
  let qi=0, wrong=0;
  const host=document.getElementById(hostId);
  function draw(){
    const q=qs[qi];
    host.innerHTML = `<div class="scene">
      <div class="small muted">คำถาม ${qi+1}/${qs.length}</div>
      <h3 style="margin:6px 0 4px">${q.q}</h3>
      <div class="opts">${q.o.map((o,j)=>`<div class="opt" data-i="${j}">${o}</div>`).join('')}</div>
      <div class="feedback" id="qfb"></div>
    </div>`;
    host.querySelectorAll('.opt').forEach(op=>{
      op.onclick=()=>{
        const j=+op.dataset.i, ok=j===q.a; if(!ok) wrong++;
        host.querySelectorAll('.opt').forEach((x,k)=>{
          x.classList.add('disabled');
          if(k===q.a) x.classList.add('correct'); else if(k===j) x.classList.add('incorrect');
        });
        const f=host.querySelector('#qfb'); f.className='feedback show '+(ok?'good':'bad');
        f.innerHTML=(ok?'✅ ถูกต้อง! ':'❌ ยังไม่ใช่ ')+q.e+
          `<div style="margin-top:12px"><button class="btn primary sm" id="nx">${qi===qs.length-1?'สรุปผล →':'ข้อถัดไป →'}</button></div>`;
        f.querySelector('#nx').onclick=()=>{ qi++; if(qi<qs.length){ draw(); window.scrollTo({top:0,behavior:'smooth'}); } else onDone(wrong); };
      };
    });
  }
  draw();
}

function withImage(src, ok, fail){
  const im = new Image(); im.onload = ()=>ok(); im.onerror = ()=>fail(); im.src = src;
}

      orderWrong = mistakes; toast('ติดป้ายครบแล้ว! ไปช่วงที่ 2'); setTimeout(drawMatch,900);
    });
  }

  /* กระดานสำรองเมื่อโหลดภาพไม่ได้ — เนื้อหาเดียวกันแต่ให้เรียงลำดับแทนการชี้ตำแหน่ง */
  function drawOrder(){
    app.innerHTML = stageShell('chromosome', `
      <div class="note">🎯 <b>ช่วงที่ 1:</b> สาย DNA ยาวมากถูกอัดจนกลายเป็นโครโมโซมได้อย่างไร —
        แตะการ์ดเรียงจาก<b>สายยืด</b>ไปหา<b>แท่งที่มองเห็นใต้กล้อง</b></div>
      <div class="bar"><i id="pb" style="width:0%"></i></div>

      <div class="feedback" id="fb"></div>
    `);
    bindOrder(PACK_STEPS, wrong=>{
      orderWrong = wrong; toast('ถูกทั้งลำดับ! ไปช่วงที่ 2'); setTimeout(drawMatch,900);
    });
  }

  function drawMatch(){
    app.innerHTML = stageShell('chromosome', `
      <div class="note">🎯 <b>ช่วงที่ 2:</b> แตะชื่อศัพท์ แล้วแตะการ์ดคำอธิบายที่ตรงกัน
        (ครบ ${CHROM_PAIRS.length} คำ)</div>
      <div class="bar"><i id="pb" style="width:0%"></i></div>
      ${matchBoard(CHROM_PAIRS)}
      <div class="feedback" id="fb"></div>
    `);
    bindMatch(CHROM_PAIRS, wrong=>{
      matchWrong = wrong; toast('จับคู่ครบแล้ว! ไปช่วงที่ 3'); setTimeout(drawQuiz,900);
    });
  }

  function drawQuiz(){
    app.innerHTML = stageShell('chromosome', `
      <div class="note">🎯 <b>ช่วงที่ 3:</b> ตอบคำถามเรื่องโครโมโซมให้ครบ ${CHROM_Q.length} ข้อ</div>
      <div class="bar"><i id="pb" style="width:0%"></i></div>
      <div id="qhost"></div>
    `);
    quizRun(CHROM_Q, 'qhost', qWrong=>{
      const miss = orderWrong + matchWrong + qWrong;
      const got = miss<=2?3:miss<=4?2:1;
      stageMiss = miss;
      finishStage('chromosome', got, 75-Math.min(miss*7,45), `
        <div class="note key">🟡 <b>สรุปที่ต้องจำ</b><br>
          • การอัดตัว: <b>DNA → นิวคลีโอโซม (พันรอบฮิสโทน 8 โมเลกุล) → โครมาทิน → โครโมโซม</b><br>
          • จำแนกโครโมโซมด้วย <b>ขนาด</b> และ <b>ตำแหน่งเซนโทรเมียร์</b><br>
          • <b>ยีน</b> = ช่วงของ DNA ที่กำหนดลักษณะทางพันธุกรรม จึงเป็นส่วนหนึ่งของโครโมโซม<br>
          • <b>จีโนม</b> = สารพันธุกรรมทั้งหมดของโครโมโซม 1 ชุด</div>
        <div class="note miss">🔴 <b>ระวังเข้าใจผิด:</b> <b>จำนวนโครโมโซมไม่ได้บอกความซับซ้อนของสิ่งมีชีวิต</b>
          และใช้ระบุสปีชีส์ไม่ได้ — สน มะเขือเทศ และข้าว มี 24 โครโมโซมเท่ากัน
          ส่วนมนุษย์มี 46 แต่มี<b>จำนวนยีน</b>มากกว่ายีสต์และแบคทีเรีย เพราะต้องใช้โปรตีนหลากหลายกว่า</div>
        <div class="small muted">ตอบผิดทั้งหมด ${miss} ครั้ง</div>`);
    });
  }
}


/* =========================================================================
   ลากวางชิ้นส่วน — ใช้ร่วมกันระหว่างห้องทดลอง Griffith และแท่นประกอบนิวคลีโอไทด์
   รองรับทั้งลาก (มีเงาตามนิ้ว) และแตะเลือกชิ้นแล้วแตะปลายทาง
   o.tok/o.drop = ตัวเลือก CSS · o.key(el) = คีย์ของชิ้น · o.ghost(el) = HTML ของเงา
   o.busy() = true เมื่อห้ามแตะ · o.onArm(key) = ไฮไลต์ · o.onDrop(ปลายทาง, คีย์)
   ========================================================================= */
function pickDrag(host, o){
  let armed = null;
  const busy = ()=> !!(o.busy && o.busy());
  const arm = k=>{ armed = k; if(o.onArm) o.onArm(k); };
  const dropAt = (x,y)=>{ const el = document.elementFromPoint(x,y); return el ? el.closest(o.drop) : null; };
  host.querySelectorAll(o.tok).forEach(el=>{
    let ghost = null, moved = false, sx = 0, sy = 0;
    const key = ()=>o.key(el);
    el.addEventListener('pointerdown', ev=>{
      if(busy()) return;
      ev.preventDefault(); moved = false; sx = ev.clientX; sy = ev.clientY;
      el.setPointerCapture(ev.pointerId);
    });
    el.addEventListener('pointermove', ev=>{
      if(busy() || !el.hasPointerCapture(ev.pointerId)) return;
      if(!moved && Math.hypot(ev.clientX-sx, ev.clientY-sy) < 8) return;
      if(!moved){
        moved = true; arm(key());
        ghost = document.createElement('div');
        ghost.className = o.ghostClass || 'gl-ghost';
        ghost.innerHTML = o.ghost(el);
        document.body.appendChild(ghost);
      }
      ghost.style.left = ev.clientX+'px'; ghost.style.top = (ev.clientY-24)+'px';
      const over = dropAt(ev.clientX, ev.clientY);
      host.querySelectorAll(o.drop).forEach(d=>d.classList.toggle('hot', d===over));
    });
    el.addEventListener('pointerup', ev=>{
      if(ghost){ ghost.remove(); ghost = null; }
      host.querySelectorAll(o.drop).forEach(d=>d.classList.remove('hot'));
      if(busy()) return;
      if(moved){
        const over = dropAt(ev.clientX, ev.clientY);
        if(over) o.onDrop(over, key()); else arm(null);
      }else{
        arm(armed===key() ? null : key());
      }
    });
    el.addEventListener('keydown', ev=>{
      if(ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); arm(key()); }
    });
  });
  host.querySelectorAll(o.drop).forEach(d=>{
    d.onclick = ()=>{ if(!busy()) o.onDrop(d, armed); };
  });
  return { arm };          /* ผู้เรียกใช้ล้างชิ้นที่เลือกเองได้ เช่น หลังวางสำเร็จ */
}

  { k:'mix', no:4, name:'S ที่ต้มฆ่าแล้ว + R ที่มีชีวิต',    short:'S ต้ม + R มีชีวิต', liquid:'#B39DDB', dies:true,

/* hostId = ชั้นวาง+โต๊ะทดลอง · logId = ตารางสรุปผล (วางใต้กล่องคำอธิบาย) · onDone(จำนวนที่ทำนายผิด) */
function griffithLab(hostId, logId, onDone){
  const host = document.getElementById(hostId), logHost = document.getElementById(logId);
  let loaded = null, done = 0, wrong = 0, busy = false;
  const results = {};

  function draw(){
    host.innerHTML = `
      <div class="gl-lab">
        <div class="gl-benchrow">
          <div class="gl-panel">
            <h4>🧪 ชั้นวางหลอดทดลอง</h4>
            <div class="gl-rack" id="glRack">
              ${GRIF_TRIALS.map(t=>`<div class="gl-tube${results[t.k]?' used':''}" data-k="${t.k}"
                  role="button" tabindex="0" aria-label="${t.name}">
                ${glTubeSvg(t.liquid, !results[t.k])}
                <span class="gl-cap">${t.no}. ${t.short}</span></div>`).join('')}
            </div>
            <div class="small muted" style="margin-top:8px">ลากหลอดไปใส่เข็มฉีดยา หรือแตะหลอดแล้วแตะเข็มก็ได้</div>
          </div>
          <div class="gl-panel">
            <h4>🔬 โต๊ะทดลอง</h4>
            <div class="gl-bench" id="glBench">
              <div class="gl-drop" id="glSyr" data-drop="syr">
                ${glSyringeSvg(loaded ? loaded.liquid : null)}
                <span class="gl-cap">${loaded ? loaded.short : 'เข็มฉีดยา (ยังว่าง)'}</span>
              </div>
              <div class="gl-drop" id="glCage" data-drop="cage">
                ${glMouseSvg('alive')}
                <span class="gl-cap">หนูทดลอง</span>
              </div>
            </div>
            <div id="glAct"></div>
          </div>
        </div>
      </div>`;
    drawLog();
    bind();
  }

  function drawLog(){
    logHost.innerHTML = `
      <table class="gl-log">
        <tr><th>ชุด</th><th>สิ่งที่ฉีด</th><th>ผล</th><th>ตรวจเลือด</th></tr>
        ${GRIF_TRIALS.map(t=>{
          const r = results[t.k];
          return `<tr class="${r?'':'gl-todo'}"><th>${t.no}</th><td>${t.name}</td>
            <td class="gl-res ${r ? (t.dies?'gl-dead':'gl-alive') : ''}">${r ? (t.dies?'💀 หนูตาย':'😀 หนูไม่ตาย') : '—'}</td>
            <td>${r ? t.blood : '—'}</td></tr>`;
        }).join('')}
      </table>`;
  }

  function setArmed(k){          /* pickDrag เก็บสถานะชิ้นที่เลือกไว้เอง ที่นี่แค่ไฮไลต์ */
    host.querySelectorAll('.gl-tube').forEach(t=>t.classList.toggle('sel', t.dataset.k===k));
    const syr = document.getElementById('glSyr');
    if(syr) syr.classList.toggle('armed', !!k);
  }

  function loadSyringe(k){
    const t = GRIF_TRIALS.find(x=>x.k===k);
    if(!t || results[k]) return;
    loaded = t; setArmed(null); draw();
    const fb = document.getElementById('fb');
    fb.className = 'feedback show';
    fb.innerHTML = `💉 ดูดของเหลวจากหลอดที่ ${t.no} — <b>${t.name}</b> ใส่เข็มแล้ว · ลองทายก่อนฉีดว่าหนูจะเป็นอย่างไร`;
    document.getElementById('glAct').innerHTML = `
      <div class="gl-predict">
        <button class="btn sm" data-guess="alive">😀 ทายว่าหนูไม่ตาย</button>
        <button class="btn sm" data-guess="dead">💀 ทายว่าหนูตาย</button>
      </div>`;
    document.getElementById('glCage').classList.add('armed');
    host.querySelectorAll('[data-guess]').forEach(b=>b.onclick = ()=>inject(b.dataset.guess));
  }

  function inject(guess){
    if(!loaded || busy) return;
    busy = true;
    const t = loaded, ok = (guess==='dead') === t.dies;
    if(!ok) wrong++;
    const bench = document.getElementById('glBench');
    bench.classList.add('gl-inject');
    document.getElementById('glAct').innerHTML = '';
    setTimeout(()=>{
      results[t.k] = true; done++; drawLog();
      const cage = document.getElementById('glCage');
      cage.innerHTML = `${glMouseSvg(t.dies?'dead':'alive')}<span class="gl-cap">${t.dies?'หนูตาย':'หนูไม่ตาย'}</span>`;
      const fb = document.getElementById('fb');
      fb.className = 'feedback show ' + (ok?'good':'bad');
      fb.innerHTML = `${ok?'✅ ทายถูก':'❌ ทายผิด'} — ชุดที่ ${t.no} ฉีด“<b>${t.name}</b>” แล้ว
        <b class="${t.dies?'gl-dead':'gl-alive'}">${t.dies?'หนูตาย':'หนูไม่ตาย'}</b> · ตรวจเลือดพบ: ${t.blood}<br>${t.why}`;
      const pb = document.getElementById('pb'); if(pb) pb.style.width = (done/GRIF_TRIALS.length*100)+'%';
      setTimeout(()=>{
        loaded = null; busy = false; draw();
        if(done === GRIF_TRIALS.length) setTimeout(()=>onDone(wrong), 1400);
      }, 1700);
    }, 700);
  }

  function bind(){
    pickDrag(host, {
      tok:'.gl-tube:not(.used)', drop:'.gl-drop', ghostClass:'gl-ghost',
      key: el=>el.dataset.k,
      busy: ()=>busy,
      ghost: el=>glTubeSvg(GRIF_TRIALS.find(t=>t.k===el.dataset.k).liquid, true),
      onArm: setArmed,
      onDrop: (d,k)=>{ if(d.dataset.drop==='syr' && k) loadSyringe(k); else nudgeCage(); }
    });
  }
  function nudgeCage(){
    const fb = document.getElementById('fb');
    fb.className = 'feedback show bad';
    fb.innerHTML = loaded
      ? '❌ ยังฉีดไม่ได้ — <b>ทายผลก่อน</b>ว่าหนูจะเป็นอย่างไร แล้วเข็มจะฉีดให้เอง'
      : '❌ เข็มฉีดยายังว่างอยู่ — ต้อง<b>ลากหลอดทดลองมาใส่เข็ม</b>ก่อน';
  }
  draw();
}

function avBottleSvg(fill, lit){
  return `<svg viewBox="0 0 60 116" aria-hidden="true">
    <rect x="23" y="4" width="14" height="12" rx="3" fill="#B9C4D2"/>
    <rect x="26" y="16" width="8" height="14" fill="#DCE3EB" stroke="#7E8CA0" stroke-width="2"/>
    <rect x="12" y="30" width="36" height="76" rx="11" fill="#F4FAFF" stroke="#7E8CA0" stroke-width="3"/>
    <path d="M16 62 h28 v40 a7 7 0 0 1-7 7 h-14 a7 7 0 0 1-7-7 z" fill="${fill}" opacity=".95"/>
    ${lit?'<circle cx="30" cy="80" r="3.2" fill="#fff" opacity=".85"/>':''}
  </svg>`;
}
/* จานเพาะเชื้อ · state: 'none' ยังไม่เพาะ · 'R' พบเฉพาะ R · 'SR' พบทั้ง S และ R */
function avDishSvg(state){
  const rough = [[54,56],[98,46],[64,98],[116,62],[88,104],[124,94],[78,72]];
  const smooth = [[86,62],[110,82],[62,80]];
  return `<svg viewBox="0 0 170 140" aria-hidden="true">
    <ellipse cx="85" cy="74" rx="74" ry="60" fill="#E4EADF" stroke="#A9B4A5" stroke-width="3"/>
    <ellipse cx="85" cy="74" rx="64" ry="51" fill="#F7F3DE" stroke="#C3CCBA" stroke-width="2"/>
    ${state==='none' ? '' : rough.map(([x,y])=>
      `<circle cx="${x}" cy="${y}" r="4.2" fill="#C2AF8C" stroke="#A3906D" stroke-width="1"/>`).join('')}
    ${state==='SR' ? smooth.map(([x,y])=>
      `<g><circle cx="${x}" cy="${y}" r="9" fill="#9CC2DE" stroke="#5E8FB0" stroke-width="1.6"/>
         <circle cx="${x-3}" cy="${y-3.4}" r="2.6" fill="#fff" opacity=".85"/></g>`).join('') : ''}
  </svg>`;
}
/* hostId = โต๊ะทดลอง · logId = ตารางสรุปผล · onDone(จำนวนที่ทำนายผิด) */
function averyLab(hostId, logId, onDone){
  const host = document.getElementById(hostId), logHost = document.getElementById(logId);
  let loaded = null, done = 0, wrong = 0, busy = false;
  const results = {};

  function draw(){
    host.innerHTML = `
      <div class="gl-lab">
        <div class="gl-benchrow">
          <div class="gl-panel">
            <h4>🧴 ชั้นวางเอนไซม์</h4>
            <div class="gl-rack" id="avRack">
              ${AVERY_TRIALS.map(t=>`<div class="gl-tube gl-bottle${results[t.k]?' used':''}" data-k="${t.k}"
                  role="button" tabindex="0" aria-label="${t.name}">
                ${avBottleSvg(t.liquid, !results[t.k])}
                <span class="gl-cap">${t.no}. ${t.short}</span></div>`).join('')}
            </div>
            <div class="small muted" style="margin-top:8px">ลากขวดเอนไซม์ไปเทใส่หลอด หรือแตะขวดแล้วแตะหลอดก็ได้</div>
          </div>
          <div class="gl-panel">
            <h4>🔬 โต๊ะทดลอง</h4>
            <div class="gl-bench" id="avBench">
              <div class="gl-drop" id="avTube" data-drop="tube">
                ${glTubeSvg(loaded ? loaded.liquid : '#B39DDB', true)}
                <span class="gl-cap">${loaded
                  ? 'เติม ' + loaded.short + ' แล้ว'
                  : 'สารสกัดจาก S ที่ต้มฆ่าแล้ว<br>+ R ที่มีชีวิต'}</span>
              </div>
              <div class="gl-drop" id="avDish" data-drop="dish">
                ${avDishSvg('none')}
                <span class="gl-cap">จานเพาะเชื้อ</span>
              </div>
            </div>
            <div id="avAct"></div>
            <div class="small muted" style="margin-top:8px">
              🔵 โคโลนีผิวเรียบเป็นมัน = <b>S</b> · 🟤 โคโลนีผิวขรุขระด้าน = <b>R</b></div>
          </div>
        </div>
      </div>`;
    drawLog();
    bind();
  }

  function drawLog(){
    logHost.innerHTML = `
      <table class="gl-log">
        <tr><th>ชุด</th><th>เอนไซม์ที่เติม</th><th>สารที่ถูกย่อย</th><th>ผลบนจานเพาะเชื้อ</th></tr>
        ${AVERY_TRIALS.map(t=>{
          const r = results[t.k];
          return `<tr class="${r?'':'gl-todo'}"><th>${t.no}</th><td>${t.name}</td><td>${r?t.digest:'—'}</td>
            <td class="gl-res ${r ? (t.trans?'gl-alive':'gl-dead') : ''}">${r ? t.plate : '—'}</td></tr>`;
        }).join('')}
      </table>`;
  }

  function setArmed(k){                /* pickDrag เก็บสถานะชิ้นที่เลือกไว้เอง ที่นี่แค่ไฮไลต์ */
    host.querySelectorAll('.gl-bottle').forEach(t=>t.classList.toggle('sel', t.dataset.k===k));
    const tube = document.getElementById('avTube');
    if(tube) tube.classList.toggle('armed', !!k);
  }

  function pour(k){
    const t = AVERY_TRIALS.find(x=>x.k===k);
    if(!t || results[k]) return;
    loaded = t; setArmed(null); draw();
    const fb = document.getElementById('fb');
    fb.className = 'feedback show';
    fb.innerHTML = `${t.k==='ctrl'
        ? '🧴 <b>ชุดควบคุม</b> — เติมเฉพาะบัฟเฟอร์ ไม่ย่อยอะไรเลย'
        : `🧴 เติม<b>${t.name}</b> ลงในหลอดแล้ว — ${t.digest}ในสารสกัดจะถูกย่อยจนหมด`}
      · ลองทายก่อนเพาะเลี้ยงว่า <b>R จะเปลี่ยนเป็น S ได้หรือไม่</b>`;
    document.getElementById('avAct').innerHTML = `
      <div class="gl-predict">
        <button class="btn sm" data-guess="trans">🔵 ทายว่ายังเปลี่ยนเป็น S ได้</button>
        <button class="btn sm" data-guess="stop">🟤 ทายว่าเปลี่ยนไม่ได้ พบเฉพาะ R</button>
      </div>`;
    document.getElementById('avDish').classList.add('armed');
    host.querySelectorAll('[data-guess]').forEach(b=>b.onclick = ()=>incubate(b.dataset.guess));
  }

  function incubate(guess){
    if(!loaded || busy) return;
    busy = true;
    const t = loaded, ok = (guess==='trans') === t.trans;
    if(!ok) wrong++;
    document.getElementById('avBench').classList.add('gl-inject');
    document.getElementById('avAct').innerHTML = '<div class="small muted">⏳ กำลังเพาะเลี้ยงบนอาหารเลี้ยงเชื้อ…</div>';
    setTimeout(()=>{
      results[t.k] = true; done++; drawLog();
      document.getElementById('avAct').innerHTML = '';
      const dish = document.getElementById('avDish');
      dish.innerHTML = `${avDishSvg(t.trans?'SR':'R')}<span class="gl-cap">${t.dish}</span>`;
      const fb = document.getElementById('fb');
      fb.className = 'feedback show ' + (ok?'good':'bad');
      fb.innerHTML = `${ok?'✅ ทายถูก':'❌ ทายผิด'} — ชุดที่ ${t.no} “<b>${t.name}</b>” →
        <b class="${t.trans?'gl-alive':'gl-dead'}">${t.trans?'ยังเปลี่ยน R เป็น S ได้':'เปลี่ยนไม่ได้ พบเฉพาะ R'}</b><br>${t.why}`;
      const pb = document.getElementById('pb'); if(pb) pb.style.width = (done/AVERY_TRIALS.length*100)+'%';
      setTimeout(()=>{
        loaded = null; busy = false; draw();
        if(done === AVERY_TRIALS.length) setTimeout(()=>onDone(wrong), 1400);
      }, 1900);
    }, 900);
  }

  function bind(){
    pickDrag(host, {
      tok:'.gl-bottle:not(.used)', drop:'.gl-drop', ghostClass:'gl-ghost',
      key: el=>el.dataset.k,
      busy: ()=>busy,
      ghost: el=>avBottleSvg(AVERY_TRIALS.find(t=>t.k===el.dataset.k).liquid, true),
      onArm: setArmed,
      onDrop: (d,k)=>{ if(d.dataset.drop==='tube' && k) pour(k); else nudge(); }
    });
  }
  function nudge(){
    const fb = document.getElementById('fb');
    fb.className = 'feedback show bad';
    fb.innerHTML = loaded
      ? '❌ ยังเพาะเลี้ยงไม่ได้ — <b>ทายผลก่อน</b>ว่า R จะเปลี่ยนเป็น S ได้หรือไม่'
      : '❌ ยังไม่ได้เติมเอนไซม์ — ต้อง<b>ลากขวดเอนไซม์มาเทใส่หลอด</b>ก่อน';
  }

  draw();
}

      <div class="note">🎯 <b>ช่วงที่ 4:</b> วิเคราะห์การทดลองให้ครบ ${DISC_Q.length} ข้อ</div>
      <div class="bar"><i id="pb" style="width:0%"></i></div>
      <div id="qhost"></div>
    `);
    quizRun(DISC_Q, 'qhost', qWrong=>{
      const miss = sortWrong + averyWrong + matchWrong + qWrong;
      const got = miss<=2?3:miss<=5?2:1;
      stageMiss = miss;
      finishStage('discover', got, 80-Math.min(miss*7,50), `
        <div class="note key">🟡 <b>สรุปที่ต้องจำ</b><br>
          • <b>Griffith</b> ค้นพบ<b>ปรากฏการณ์</b>เปลี่ยนสายพันธุ์ แต่ยังไม่รู้ว่าสารนั้นคืออะไร<br>
          • <b>Avery · MacLeod · McCarty</b> ใช้เอนไซม์ย่อยทีละชนิดจนพบว่าเป็น <b>DNA</b><br>
          • <b>Chargaff</b> ให้ข้อมูลปริมาณเบส · <b>Franklin และ Wilkins</b> ให้ภาพเอกซ์เรย์<br>
          • <b>Watson และ Crick</b> นำข้อมูลของคนอื่นมาประกอบเป็น<b>แบบจำลองเกลียวคู่</b></div>
        <div class="note miss">🔴 <b>บทเรียนเรื่องวิธีการทางวิทยาศาสตร์:</b>
          ไม่มีใครค้นพบเรื่องนี้ได้คนเดียว — นักวิทยาศาสตร์<b>ใช้ข้อมูลที่คนอื่นค้นพบไว้แล้ว</b>
          มาต่อยอดการทดลองของตนเอง และ<b>ชุดควบคุม</b>คือสิ่งที่ทำให้ตีความผลได้</div>
        <div class="small muted">ตอบผิดทั้งหมด ${miss} ครั้ง</div>`);
    });
  }
}

/* =========================================================================
   แท่นประกอบนิวคลีโอไทด์ — ลากภาพหมู่ฟอสเฟต น้ำตาล และเบส มาต่อกัน
   ภาพประกอบตัดจากแผนภาพในหนังสือเรียน (หมู่ฟอสเฟต · ดีออกซีไรโบส · เบส 4 ชนิด)
   ========================================================================= */
const NUC_BASES = {
  A:{ n:'อะดีนีน (A)', img:'parts/base-a.png', g:'pur', pair:'T', hb:2 },
  G:{ n:'กวานีน (G)',  img:'parts/base-g.png', g:'pur', pair:'C', hb:3 },
  C:{ n:'ไซโทซีน (C)', img:'parts/base-c.png', g:'pyr', pair:'G', hb:3 },
  T:{ n:'ไทมีน (T)',   img:'parts/base-t.png', g:'pyr', pair:'A', hb:2 }
};
const NUC_GROUP = { pur:'พิวรีน — วงแหวนคู่', pyr:'ไพริมิดีน — วงแหวนเดี่ยว' };
const NUC_BACK = {
  p:{ n:'หมู่ฟอสเฟต', img:'parts/phosphate.png', num:'1',
      hit:'มีอะตอม <b>P</b> อยู่ตรงกลาง ล้อมด้วยออกซิเจน' },
  s:{ n:'น้ำตาลดี⁠ออก⁠ซี⁠ไร⁠โบส', img:'parts/sugar.png', num:'2',
      hit:'<b>วงแหวนห้าเหลี่ยม</b> มีคาร์บอนหมายเลข 1–5' }
};
const NUC_ROUNDS = [
  { b:'A', clue:'เบส<b>พิวรีน</b> (วงแหวนคู่) ที่เข้าคู่กับ<b>ไทมีน</b>ด้วยพันธะไฮโดรเจน <b>2 พันธะ</b>' },
  { b:'T', clue:'เบส<b>ไพริมิดีน</b> (วงแหวนเดี่ยว) ที่มี<b>หมู่เมทิล (—CH<sub>3</sub>)</b> ยื่นออกมาจากวง' },
  { b:'C', clue:'เบส<b>ไพริมิดีน</b> ที่เข้าคู่กับ<b>กวานีน</b>ด้วยพันธะไฮโดรเจน <b>3 พันธะ</b>' },
  { b:'G', clue:'เบส<b>พิวรีน</b>ที่เหลือ — เข้าคู่กับ<b>ไซโทซีน</b>' }
];
/* hostId = แท่นประกอบ · shelfId = ชั้นเก็บนิวคลีโอไทด์ที่สร้างเสร็จ · onDone(จำนวนที่ผิด) */
function nucleoLab(hostId, shelfId, onDone){
  const host = document.getElementById(hostId), shelf = document.getElementById(shelfId);
  let ri = 0, wrong = 0, busy = false;
  let filled = { p:false, s:false, b:null };
  const built = [];

  function slotHTML(key){
    if(key==='b'){
      const b = filled.b && NUC_BASES[filled.b];
      return b ? `<img src="${b.img}" alt="${b.n}"><span class="nb-cap">${b.n}</span>`
               : `<span class="nb-num">3</span><span class="nb-cap">ไนโตรจีนัสเบส</span>`;
    }
    const part = NUC_BACK[key];
    return filled[key] ? `<img src="${part.img}" alt="${part.n}"><span class="nb-cap">${part.n}</span>`
                       : `<span class="nb-num">${part.num}</span><span class="nb-cap">${part.n}</span>`;
  }

  function draw(){
    const R = NUC_ROUNDS[ri], carry = ri>0;
    const pieces = [];
    if(!carry){
      pieces.push({ k:'p', n:NUC_BACK.p.n, img:NUC_BACK.p.img, used:filled.p });
      pieces.push({ k:'s', n:NUC_BACK.s.n, img:NUC_BACK.s.img, used:filled.s });
    }
    Object.keys(NUC_BASES).forEach(k=>pieces.push({
      k, n:NUC_BASES[k].n, img:NUC_BASES[k].img, used:built.includes(k) || filled.b===k }));
    host.innerHTML = `
      <div class="nb-lab">
        <div class="nb-task">🧬 <b>นิวคลีโอไทด์ชุดที่ ${ri+1} จาก 4</b> — ประกอบให้ได้นิวคลีโอไทด์ที่มี${R.clue}
          ${carry ? '<br><span class="small muted">แกนน้ำตาล–ฟอสเฟตใช้ชุดเดิมได้เลย เปลี่ยนเฉพาะเบส</span>' : ''}</div>
        <div class="nb-bench" id="nbBench">
          <div class="nb-slot ${filled.p?'full':''}" data-slot="p">${slotHTML('p')}</div>
          <span class="nb-link">–</span>
          <div class="nb-slot ${filled.s?'full':''}" data-slot="s">${slotHTML('s')}</div>
          <span class="nb-link">–</span>
          <div class="nb-slot ${filled.b?'full':''}" data-slot="b">${slotHTML('b')}</div>
        </div>
        <div class="nb-tray">
          ${pieces.map(p=>`<div class="nb-piece${p.used?' used':''}" data-k="${p.k}"
              role="button" tabindex="0" aria-label="${p.n}">
            <img src="${p.img}" alt=""><span class="nb-cap">${p.n}</span></div>`).join('')}
        </div>
        <div class="small muted" style="margin-top:8px">ลากชิ้นส่วนไปวางในช่อง หรือแตะชิ้นส่วนแล้วแตะช่องก็ได้</div>
      </div>`;
    shelf.innerHTML = `
      <div class="nb-shelf">
        ${NUC_ROUNDS.map((r,i)=>{
          const done = built.includes(r.b), b = NUC_BASES[r.b];
          return `<div class="nb-chip ${done?'done':''}">
            ${done ? `<img src="${b.img}" alt="">` : ''}
            ${done ? `นิวคลีโอไทด์ ${b.n}` : `ชุดที่ ${i+1} · ยังไม่ประกอบ`}</div>`;
        }).join('')}
      </div>`;
    bind();
  }

  function setArmed(k){
    host.querySelectorAll('.nb-piece').forEach(e=>e.classList.toggle('sel', e.dataset.k===k));
    host.querySelectorAll('.nb-slot').forEach(e=>e.classList.toggle('armed', !!k && !e.classList.contains('full')));
  }

  function say(cls, html){
    const fb = document.getElementById('fb');
    fb.className = 'feedback show ' + cls; fb.innerHTML = html;
  }

  function place(slot, k){
    if(busy || !k) return;
    const isBase = !!NUC_BASES[k];
    if(slot==='b'){
      if(!isBase){ wrong++; say('bad',
        `❌ ช่องที่ 3 ต้องเป็น<b>ไนโตรจีนัสเบส</b> — ${NUC_BACK[k].n}เป็นส่วนของ<b>แกนน้ำตาล–ฟอสเฟต</b>`); return; }
      if(built.includes(k)){ say('bad', `❌ ใช้${NUC_BASES[k].n}ไปแล้วในชุดก่อนหน้า — เหลือเบสอื่นอีก`); return; }
      const want = NUC_ROUNDS[ri].b;
      if(k !== want){
        wrong++;
        const w = NUC_BASES[k], t = NUC_BASES[want];
        say('bad', w.g !== t.g
          ? `❌ ${w.n} เป็น<b>${NUC_GROUP[w.g]}</b> แต่โจทย์ต้องการ<b>${NUC_GROUP[t.g]}</b>`
          : `❌ ${w.n} เป็น<b>${NUC_GROUP[w.g]}</b> ถูกแล้ว แต่เข้าคู่กับ<b>${NUC_BASES[w.pair].n}</b> ไม่ใช่${NUC_BASES[t.pair].n}`);
        return;
      }
      filled.b = k;
    }else{
      if(isBase){ wrong++; say('bad',
        `❌ ${NUC_BASES[k].n} เป็น<b>ไนโตรจีนัสเบส</b> — ต้องวางในช่องที่ 3`); return; }
      if(k !== slot){ wrong++; say('bad',
        `❌ ช่องที่ ${NUC_BACK[slot].num} ต้องเป็น<b>${NUC_BACK[slot].n}</b> — ${NUC_BACK[slot].hit}`); return; }
      filled[slot] = true;
      say('good', `✅ วาง<b>${NUC_BACK[k].n}</b>ถูกช่องแล้ว`);
    }
    draw();
    if(filled.p && filled.s && filled.b) complete();
  }

  function complete(){
    busy = true;
    const b = NUC_BASES[filled.b];
    built.push(filled.b); draw();           // อัปเดตชั้นเก็บทันทีที่ประกอบเสร็จ
    const pb = document.getElementById('pb');
    if(pb) pb.style.width = (built.length/NUC_ROUNDS.length*100)+'%';
    say('good', `✅ ได้<b>นิวคลีโอไทด์</b>ที่มี${b.n} แล้ว · เบสนี้เป็น<b>${NUC_GROUP[b.g]}</b>
      เข้าคู่กับ<b>${NUC_BASES[b.pair].n}</b> ด้วยพันธะไฮโดรเจน <b>${b.hb} พันธะ</b><br>
      ทุกนิวคลีโอไทด์ใช้<b>หมู่ฟอสเฟตและน้ำตาลดีออกซีไรโบสชุดเดียวกัน</b> ต่างกันที่<b>ชนิดของเบส</b>เท่านั้น`);
    setTimeout(()=>{
      if(built.length === NUC_ROUNDS.length){ onDone(wrong); return; }
      ri++; filled = { p:true, s:true, b:null }; busy = false; draw();
    }, 1800);
  }

  function bind(){
    pickDrag(host, {
      tok:'.nb-piece:not(.used)', drop:'.nb-slot', ghostClass:'gl-ghost nb-ghost',
      key: el=>el.dataset.k,
      busy: ()=>busy,
      ghost: el=>`<img src="${el.querySelector('img').src}" alt="">`,
      onArm: setArmed,
      onDrop: (d,k)=>{
        if(!k){ say('bad', '❌ ยังไม่ได้เลือกชิ้นส่วน — <b>แตะชิ้นส่วนด้านล่างก่อน</b> แล้วค่อยแตะช่อง'); return; }
        if(d.classList.contains('full')){ say('bad', '❌ ช่องนี้มีชิ้นส่วนอยู่แล้ว'); return; }
        place(d.dataset.slot, k);
      }
    });
  }

  draw();
}

function stageBuilder(){
