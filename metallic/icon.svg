<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="เมืองทะเลอิเล็กตรอน">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8EC"/><stop offset="1" stop-color="#EAE4C6"/>
    </linearGradient>
    <radialGradient id="p" cx="34%" cy="30%" r="72%">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset=".42" stop-color="#F2994A"/><stop offset="1" stop-color="#B84418"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- ทะเลอิเล็กตรอนที่ห่อหุ้มไอออนบวกทั้งหมดไว้ -->
  <rect x="72" y="72" width="368" height="368" rx="48"
        fill="#F26716" fill-opacity=".12" stroke="#F26716" stroke-opacity=".38" stroke-width="5"/>
  <!-- ไอออนบวกของโลหะเรียงชิดกัน 3x3 -->
  <g fill="url(#p)" stroke="#B84418" stroke-width="5">
    <circle cx="140" cy="140" r="46"/><circle cx="256" cy="140" r="46"/><circle cx="372" cy="140" r="46"/>
    <circle cx="140" cy="256" r="46"/><circle cx="256" cy="256" r="46"/><circle cx="372" cy="256" r="46"/>
    <circle cx="140" cy="372" r="46"/><circle cx="256" cy="372" r="46"/><circle cx="372" cy="372" r="46"/>
  </g>
  <g fill="#fff" font-family="sans-serif" font-weight="700" font-size="46" text-anchor="middle">
    <text x="140" y="157">+</text><text x="256" y="157">+</text><text x="372" y="157">+</text>
    <text x="140" y="273">+</text><text x="256" y="273">+</text><text x="372" y="273">+</text>
    <text x="140" y="389">+</text><text x="256" y="389">+</text><text x="372" y="389">+</text>
  </g>
  <!-- อิเล็กตรอนอิสระที่แทรกอยู่ตามช่องว่างระหว่างไอออน -->
  <g fill="#FFD682" stroke="#F26716" stroke-width="4">
    <circle cx="198" cy="198" r="11"/><circle cx="314" cy="198" r="11"/>
    <circle cx="198" cy="314" r="11"/><circle cx="314" cy="314" r="11"/>
    <circle cx="256" cy="198" r="11"/><circle cx="256" cy="314" r="11"/>
    <circle cx="198" cy="256" r="11"/><circle cx="314" cy="256" r="11"/>
  </g>
</svg>
