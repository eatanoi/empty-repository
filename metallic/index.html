<style>
:root{
  /* ── พาเลตเดียวกับเกมสังเคราะห์แสง: F2EDD5 · E7390D · F26716 · 084A24 · 04261E ── */
  --cream:#F2EDD5; --cream-hi:#FBF8EC; --cream-lo:#E9E1BE;
  --ink:#04261E; --deep:#084A24;
  --bg0:#FBF8EC; --bg1:#F2EDD5; --bg2:#EAE4C6;
  --panel:rgba(255,255,255,.58);
  --panel2:rgba(255,255,255,.85);
  --line:rgba(8,74,36,.18);
  --green:#4E9370; --lime:#2F7D4F; --teal:#7CB894;
  --gold:#F26716; --rose:#E7390D;
  --violet:#5C90A6; --sky:#5C90A6;
  --green-soft:#AFD2BC; --green-pale:#DCEBE1;
  --orange-soft:#F7C39C; --orange-pale:#FBE4D2;
  --red-soft:#F4B7A6; --blue-soft:#BCD6E0;
  --text:#04261E; --muted:#6B8A76;
  --ok:#2F7D4F; --bad:#D6350B;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100dvh; color:var(--text);
  font-family:"Sukhumvit Set","Noto Sans Thai","IBM Plex Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
  background:
    radial-gradient(1100px 700px at 12% -8%, rgba(175,210,188,.55), transparent 62%),
    radial-gradient(900px 600px at 92% 0%, rgba(247,195,156,.42), transparent 60%),
    radial-gradient(800px 600px at 50% 112%, rgba(188,214,224,.38), transparent 62%),
    linear-gradient(rgba(251,248,236,.72),rgba(242,237,213,.80)),
    linear-gradient(170deg,var(--bg0),var(--bg1) 45%,var(--bg2));
  background-attachment:fixed;
  line-height:1.65; letter-spacing:.01em;
}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 90px}

.hud{
  position:sticky;top:0;z-index:60;margin:-16px -16px 18px;padding:12px 16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:linear-gradient(180deg,rgba(251,248,236,.96),rgba(242,237,213,.80));
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.02rem;letter-spacing:.02em;color:var(--deep)}
.brand .leaf{font-size:1.35rem;filter:drop-shadow(0 1px 3px rgba(8,74,36,.3))}
.hud .spacer{flex:1}
@media(max-width:520px){
  .hud{gap:7px;padding:9px 12px;flex-wrap:nowrap}
  .brand{font-size:.86rem;min-width:0}
  .brand span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brand .leaf{font-size:1.1rem}
  .chip{padding:4px 8px;font-size:.72rem}
  .hud .btn.sm{padding:5px 9px;font-size:.75rem}
}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);font-size:.82rem;font-weight:700;white-space:nowrap;
}
.chip b{color:var(--gold)}
.chip.xp b{color:var(--lime)}

button{font-family:inherit}
.btn{
  appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);
  padding:11px 20px;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer;
  transition:.16s transform,.16s background,.16s border-color;
}
.btn:hover{background:var(--panel2);border-color:rgba(8,74,36,.35)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#4E9370,#2F7D4F);color:#FBF8EC;border-color:transparent;box-shadow:0 8px 20px -10px rgba(8,74,36,.65)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--rose));color:#FFF7F0;border-color:transparent;box-shadow:0 8px 20px -10px rgba(231,57,13,.5)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:7px 14px;font-size:.85rem}
a.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.endrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;
  box-shadow:0 2px 12px rgba(8,74,36,.06)}
h1,h2,h3{line-height:1.35;margin:0 0 .5em}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.center{text-align:center}
.hidden{display:none !important}

.pub{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:6px}
.pub img{height:38px;width:auto;filter:drop-shadow(0 1px 2px rgba(8,74,36,.18))}
.pub span{font-weight:800;font-size:1.05rem;color:var(--deep);letter-spacing:.02em}
.pub span b{color:var(--gold)}
/* ---- ระบบชั้นเรียน ---- */
.classchip{display:inline-flex;align-items:center;gap:8px;margin:12px auto 0;padding:8px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:.85rem;font-weight:700;color:var(--deep);cursor:pointer;transition:.15s}
.classchip:hover{background:var(--panel2);border-color:rgba(8,74,36,.35)}
.classchip.joined{background:rgba(175,210,188,.55);border-color:var(--green);cursor:default}
.classchip.stuck{display:block;margin-top:6px;background:rgba(242,103,22,.14);border-color:var(--gold);color:var(--deep);cursor:pointer;font-size:.78rem}
.classchip .x{color:var(--rose);font-weight:800;margin-left:2px;cursor:pointer;padding:0 4px}
.modalbg{position:fixed;inset:0;background:rgba(4,38,30,.5);backdrop-filter:blur(3px);z-index:300;display:grid;place-items:center;padding:16px}
.modal{background:var(--cream-hi);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:380px;width:100%;box-shadow:0 22px 60px -20px rgba(0,0,0,.5)}
.modal h3{margin:0 0 4px;color:var(--deep);font-size:1.15rem}
.modal .msub{margin:0 0 14px;color:var(--muted);font-size:.85rem}
.modal label{display:block;font-size:.82rem;font-weight:700;color:var(--deep);margin:10px 0 4px}
.modal input{width:100%;font-family:inherit;font-size:.95rem;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}
.modal input:focus{outline:none;border-color:var(--green)}
.modal input#jcode{text-transform:uppercase;letter-spacing:3px;font-weight:800}
.modal .mrow{display:flex;gap:8px;margin-top:16px}
.modal .mrow .btn{flex:1}
.modal .mmsg{font-size:.85rem;margin-top:10px;min-height:1em;color:var(--muted)}
.modal .mmsg.err{color:var(--bad)}
/* ---- เกียรติบัตร ---- */
.certwrap{max-width:820px;margin:10px auto 0}
.certwrap canvas{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--line);
  box-shadow:0 18px 40px -22px rgba(8,74,36,.55);background:#fff}
.certform{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin:14px 0}
.certform input{flex:1;min-width:220px;max-width:420px;font-family:inherit;font-size:1rem;font-weight:700;
  padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.certform input:focus{outline:none;border-color:var(--green)}
.certbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.lockcard{opacity:.75}
.certprog{height:9px;border-radius:99px;background:rgba(8,74,36,.10);overflow:hidden;margin-top:8px}
.certprog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--rose));transition:width .5s}
.hero{text-align:center;padding:14px 12px 8px}
.hero h1{font-size:clamp(1.7rem,5.2vw,2.6rem);margin-bottom:.25em;
  background:linear-gradient(100deg,var(--deep),#2F7D4F 42%,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#4A6A58;margin:0;font-size:.98rem}
.eq{display:inline-block;margin-top:14px;padding:9px 18px;border-radius:999px;
  background:rgba(175,210,188,.45);border:1px solid rgba(8,74,36,.25);color:var(--deep);
  font-size:.9rem;font-weight:700;letter-spacing:.03em}
.eq sub{font-size:.72em}

.maplist{display:grid;gap:12px;margin-top:22px}
@media(min-width:720px){.maplist{grid-template-columns:1fr 1fr}}
.node{
  display:flex;gap:14px;align-items:center;
  padding:16px;border-radius:var(--r);cursor:pointer;position:relative;overflow:hidden;
  background:var(--panel);border:1px solid var(--line);
  transition:.18s transform,.18s border-color,.18s background;
}
.node:hover{transform:translateY(-3px);border-color:rgba(8,74,36,.38);background:var(--panel2)}
.node.locked{opacity:.5;cursor:not-allowed;filter:grayscale(.55)}
.node.locked:hover{transform:none;border-color:var(--line);background:var(--panel)}
.node .ic{
  width:56px;height:56px;flex:0 0 56px;border-radius:15px;display:grid;place-items:center;font-size:1.7rem;
  background:rgba(255,255,255,.75);border:1px solid var(--line);
}
.stage-ic-img{width:100%;height:100%;object-fit:contain;padding:3px;display:block}
.stagehead .ic .stage-ic-img{width:46px;height:46px;padding:0}
.node .body{flex:1;text-align:left}
.node .body .t{font-weight:800;font-size:1.02rem}
.node .body .d{font-size:.84rem;color:var(--muted);line-height:1.5}
.node .stars{font-size:.9rem;letter-spacing:2px;color:var(--gold);margin-top:3px}
.node .stars .off{color:rgba(8,74,36,.16)}
.node.done{border-color:rgba(8,74,36,.4)}
.node.done .ic{background:rgba(175,210,188,.65)}
.node .no{position:absolute;top:8px;right:12px;font-size:.7rem;font-weight:800;color:var(--muted);letter-spacing:.1em}

.stagehead{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stagehead .ic{font-size:2rem}
.stagehead h2{margin:0}
.stagehead .sub{color:var(--muted);font-size:.88rem}
.bar{height:7px;border-radius:99px;background:rgba(8,74,36,.10);overflow:hidden;margin:10px 0 18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--lime));transition:width .4s cubic-bezier(.4,0,.2,1)}

.note{
  border-radius:12px;padding:12px 14px;font-size:.88rem;margin:12px 0;
  border-left:4px solid var(--sky);background:rgba(92,144,166,.13);
}
.note.warn{border-left-color:var(--gold);background:rgba(242,103,22,.11)}
.note.key{border-left-color:var(--lime);background:rgba(47,125,79,.11)}
.note.miss{border-left-color:var(--rose);background:rgba(231,57,13,.09)}
.note b{color:var(--deep)}

.feedback{border-radius:12px;padding:12px 14px;margin-top:14px;font-size:.9rem;display:none}
.feedback.show{display:block;animation:pop .3s}
.feedback.good{background:rgba(47,125,79,.14);border:1px solid rgba(47,125,79,.4)}
.feedback.bad{background:rgba(231,57,13,.11);border:1px solid rgba(231,57,13,.35)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* อนิเมชันสั่นตอนตอบผิด ใช้ร่วมกันทั้งการ์ดจับคู่ ชิ้นเรียงลำดับ และกล่องจัดกลุ่ม */
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tok{
  padding:8px 14px;border-radius:999px;font-size:.85rem;font-weight:700;cursor:pointer;
  background:var(--panel2);border:1px solid var(--line);transition:.15s;
}
.tok:hover{border-color:var(--lime)}
.tok.sel{background:linear-gradient(135deg,var(--gold),var(--rose));color:#FFF7F0;border-color:transparent;transform:translateY(-2px);
  box-shadow:0 5px 14px -6px rgba(231,57,13,.6)}
.tok.used{display:none}

/* chain */
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:56px;
  padding:14px;border-radius:14px;background:rgba(255,255,255,.66);border:1px solid var(--line)}
.chain .ph{color:var(--muted);font-size:.85rem}
.link{padding:8px 13px;border-radius:11px;font-size:.82rem;font-weight:700;color:var(--deep);
  background:rgba(175,210,188,.8);border:1px solid rgba(8,74,36,.32);animation:pop .25s}
.arrow{color:var(--muted);font-size:.9rem}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pool .tok{font-size:.82rem}
.pool .tok.bad{animation:shake .35s;background:rgba(231,57,13,.16);border-color:var(--bad)}

/* wheel / phases */
.calvin{display:grid;gap:16px}
@media(min-width:800px){.calvin{grid-template-columns:1fr 1.1fr}}
.wheel{position:relative;aspect-ratio:1;max-width:340px;margin:0 auto;width:100%}
.wheel svg{width:100%;height:100%}
.phase{padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.66);margin-bottom:12px;transition:.2s}
.phase.active{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,103,22,.16)}
.phase.solved{border-color:rgba(8,74,36,.42);background:rgba(175,210,188,.4)}
.phase h4{margin:0 0 4px;font-size:.98rem}
.phase .hintline{font-size:.8rem;color:var(--muted);margin-bottom:10px}
.step{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:7px 0;flex-wrap:wrap}
.step .nm{font-size:.88rem;font-weight:700}
.stepper{display:flex;align-items:center;gap:4px;background:rgba(8,74,36,.07);border-radius:10px;padding:3px}
.stepper button{width:30px;height:30px;border-radius:8px;border:none;background:rgba(255,255,255,.9);
  color:var(--deep);font-size:1.05rem;font-weight:800;cursor:pointer;line-height:1}
.stepper button:active{background:var(--green);color:#FBF8EC}
.stepper .n{min-width:34px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}

/* ledger (sim) */
.sim{display:grid;gap:16px}
@media(min-width:820px){.sim{grid-template-columns:1fr 1.05fr}}
.specbox{background:rgba(255,255,255,.66);border:1px solid var(--line);border-radius:14px;padding:14px;
  box-shadow:0 2px 12px rgba(8,74,36,.06)}
.toggle{display:flex;gap:8px;margin:6px 0 14px}
.toggle button{flex:1;padding:9px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);font-weight:700;font-size:.82rem;cursor:pointer}
.toggle button.on{background:rgba(175,210,188,.8);border-color:var(--green);color:var(--deep)}
.tlabel{font-size:.82rem;font-weight:700;color:var(--deep);margin-bottom:2px}
.ledtable{width:100%;border-collapse:collapse;font-size:.86rem}
.ledtable th,.ledtable td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right}
.ledtable th:first-child,.ledtable td:first-child{text-align:left}
.ledtable th{color:var(--deep);font-size:.82rem}
.ledtable tfoot td{font-weight:800;border-top:2px solid var(--line);border-bottom:none;font-size:1rem;color:var(--deep)}
.ledtable .zero{color:var(--muted);opacity:.6}
.totbox{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;margin-top:12px}
.totbox .k{font-size:.78rem;color:var(--muted)}
.totbox .v{font-size:2.4rem;font-weight:800;color:var(--lime);font-variant-numeric:tabular-nums;line-height:1.1}
.mito-vis{background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.mito-vis svg{width:100%;height:auto;display:block}

/* scenarios */
.scene{background:rgba(255,255,255,.68);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;
  box-shadow:0 2px 12px rgba(8,74,36,.06)}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{
  text-align:left;padding:12px 14px;border-radius:12px;cursor:pointer;font-size:.9rem;
  background:var(--panel);border:1px solid var(--line);transition:.15s;
}
.opt:hover{background:var(--panel2);border-color:rgba(8,74,36,.38)}
.opt.correct{background:rgba(47,125,79,.18);border-color:var(--ok)}
.opt.incorrect{background:rgba(231,57,13,.13);border-color:var(--bad)}
.opt.disabled{pointer-events:none;opacity:.75}

/* flashcards */
.deckbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.deckbar button{padding:7px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);font-size:.83rem;font-weight:700;cursor:pointer}
.deckbar button.on{background:linear-gradient(135deg,var(--gold),var(--rose));color:#FFF7F0;border-color:transparent}
.fcstage{perspective:1400px;margin:0 auto;max-width:560px}
.fc{position:relative;width:100%;min-height:290px;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1)}
.fc.flip{transform:rotateY(180deg)}
.fc .side{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:20px;padding:26px;display:flex;flex-direction:column;justify-content:center;
  border:1px solid var(--line);box-shadow:0 6px 22px -10px rgba(8,74,36,.35);
}
.fc .front{background:linear-gradient(150deg,rgba(175,210,188,.72),rgba(220,235,225,.55)),#fff;align-items:center;text-align:center}
.fc .back{background:linear-gradient(150deg,rgba(247,195,156,.6),rgba(251,228,210,.45)),#fff;transform:rotateY(180deg)}
.fc .tag{font-size:.7rem;letter-spacing:.14em;color:#5F7D6B;text-transform:uppercase;margin-bottom:10px}
.fc .term{font-size:1.5rem;font-weight:800;margin-bottom:6px;line-height:1.3;color:var(--deep)}
.fc .en{font-size:.9rem;color:var(--muted);font-style:italic}
.fc .def{font-size:.98rem;line-height:1.7}
.fc .hint{margin-top:auto;padding-top:14px;font-size:.75rem;color:var(--muted);text-align:center}
.fcnav{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:18px}
.fcnav .count{font-weight:800;font-variant-numeric:tabular-nums;min-width:76px;text-align:center}

.result{text-align:center;padding:26px 16px}
.result .big{font-size:3rem;letter-spacing:6px;color:var(--gold)}
.result .big .off{color:rgba(8,74,36,.16)}
.result h2{margin-top:10px}

.footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
  color:var(--muted);font-size:.78rem;text-align:center;line-height:1.8}
.footer .fb{display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:9px}
.footer .fb img{height:26px;width:auto;opacity:.92}
.footer .fb span{font-weight:800;color:var(--deep);font-size:.92rem}
.footer .fb span b{color:var(--gold)}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140%);
  background:linear-gradient(135deg,#2F7D4F,#4E9370);color:#FBF8EC;
  padding:11px 22px;border-radius:999px;font-weight:800;font-size:.9rem;z-index:200;
  box-shadow:0 12px 30px -10px rgba(8,74,36,.6);
  /* ซ่อนสนิทตอนไม่มีข้อความ ไม่ให้โผล่เป็นแถบเขียวที่ขอบล่างจอ */
  opacity:0;visibility:hidden;pointer-events:none;
  transition:transform .35s cubic-bezier(.4,0,.2,1), opacity .25s linear, visibility 0s linear .35s;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;
  transition:transform .35s cubic-bezier(.4,0,.2,1), opacity .2s linear, visibility 0s}

.buckets{display:grid;gap:10px;margin-top:14px}
@media(min-width:700px){.buckets{grid-template-columns:repeat(3,1fr)}}
.bucket{background:rgba(255,255,255,.66);border:2px dashed var(--line);border-radius:14px;padding:12px;min-height:96px;transition:.15s}
.bucket.armed{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,103,22,.18)}
.bucket h4{margin:0 0 8px;font-size:.92rem;display:flex;align-items:center;gap:6px}
.bucket .items{display:flex;flex-wrap:wrap;gap:6px}
.bucket .items span{font-size:.78rem;font-weight:700;padding:5px 10px;border-radius:999px;
  background:rgba(175,210,188,.75);border:1px solid rgba(8,74,36,.28);animation:pop .25s}
.match{display:grid;gap:10px}
@media(min-width:760px){.match{grid-template-columns:1fr 1fr}}
.mcard{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:13px;
  background:rgba(255,255,255,.7);border:1px solid var(--line);cursor:pointer;transition:.15s}
.mcard:hover{border-color:rgba(8,74,36,.4)}
.mcard.armed{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,103,22,.18)}
.mcard.done{background:rgba(175,210,188,.5);border-color:var(--green);cursor:default}
.mcard .em{font-size:1.5rem;line-height:1.2}
.mcard .tx{flex:1;font-size:.87rem;line-height:1.55}
.mcard .tx b{color:var(--deep)}
.mcard .tx b.h{display:block;font-size:.95rem;margin-bottom:2px}
.mcard.wrong{animation:shake .35s;border-color:var(--bad)}
.mcard.quiet .tx{min-height:34px;display:flex;align-items:center}
.mcard.quiet .tx b.h{font-weight:600;font-size:.86rem;opacity:.75}
.cmp{width:100%;border-collapse:collapse;font-size:.87rem}
.cmp th,.cmp td{padding:8px;border-bottom:1px solid var(--line);text-align:center}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp .yes{color:var(--ok);font-weight:800}

/* ── ห้องทดลองสามแบบของเกมนี้ ────────────────────────────────────────────
   ด่าน 1 ทะเลอิเล็กตรอน · ด่าน 2 ผลึกโลหะ 3 มิติ · ด่าน 4 ตอกแผ่นโลหะ · ด่าน 5 โลหะผสม
   ทั้งสามใช้กรอบ .lab ร่วมกัน ต่างกันแค่สิ่งที่อยู่ข้างใน */
.lab{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 16px;margin-top:14px}
.labtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.labtop .fml{font-size:1.5rem;font-weight:800;letter-spacing:.5px}
.labtop .nm{color:var(--muted);font-size:.9rem}
.labtop .cnt{margin-left:auto;font-size:.82rem;color:var(--muted);font-weight:700}
.molwrap{position:relative;background:radial-gradient(120% 100% at 30% 12%,#fff 0%,var(--bg1) 62%,var(--bg2) 100%);
  border:1px solid var(--line);border-radius:14px;padding:6px;max-width:520px;margin:0 auto;overflow:hidden}
.spinhint{position:absolute;right:10px;bottom:8px;font-size:.74rem;color:var(--muted);
  background:rgba(255,255,255,.72);border-radius:20px;padding:3px 10px;pointer-events:none;z-index:2}
.palette{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.atomt,.iont{font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none;
  paint-order:stroke fill;stroke:rgba(4,38,30,.35);stroke-width:2.5px;stroke-linejoin:round;fill:#fff}

/* สรุปสมการตอนทำสำเร็จ · ใช้ทั้งด่าน 1 ด่าน 2 และด่าน 5 */
.ioneq{margin-top:10px;display:grid;gap:5px;font-size:.9rem;line-height:1.5}
.ioneq .tot{border-top:1px dashed var(--line);padding-top:6px;margin-top:2px;font-size:.95rem}
.ioneq sup{font-size:.72em}

/* ── ด่าน 1 · ฉากทะเลอิเล็กตรอน (ภาพระนาบเดียว จะได้เห็นจุดชัดและแตะง่าย) ── */
.tsvg{display:block;width:100%;height:auto;touch-action:none;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
.tball{pointer-events:none;filter:drop-shadow(0 2px 3px rgba(4,38,30,.28));transition:r .28s}
.edot{fill:var(--rose);pointer-events:none;transition:.15s}
.edot.sel{fill:var(--gold);stroke:#fff;stroke-width:2.5;filter:drop-shadow(0 0 5px rgba(242,103,22,.9))}
.efree{fill:var(--gold);opacity:.9;pointer-events:none;filter:drop-shadow(0 0 4px rgba(242,103,22,.55))}
.efree.sm{opacity:.72;filter:none}
.seabg{fill:rgba(242,103,22,.09);stroke:rgba(242,103,22,.32);stroke-width:2;stroke-dasharray:8 6;pointer-events:none}
.ehit{fill:transparent;cursor:pointer}
.tchg{font-size:15px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:var(--deep);
  pointer-events:none;paint-order:stroke fill;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.tflow{font-size:13px;font-weight:800;text-anchor:middle;fill:var(--muted);pointer-events:none}

/* ── ด่าน 2 · ผลึก 3 มิติ ── */
.molsvg{display:block;width:100%;height:auto;touch-action:none;cursor:grab;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.molsvg:active{cursor:grabbing}
.ionb{pointer-events:none;filter:drop-shadow(0 2px 3px rgba(4,38,30,.26))}
.latbond{stroke:var(--muted);stroke-width:2.2;opacity:.34;pointer-events:none}
.latbond.cn{stroke:var(--gold);stroke-width:1.8;opacity:.42;stroke-dasharray:5 4}
.hole{fill:rgba(255,255,255,.72);stroke:var(--gold);stroke-width:2.5;stroke-dasharray:6 5;cursor:pointer}
.holeq{font-weight:800;text-anchor:middle;dominant-baseline:central;fill:var(--gold);pointer-events:none}
.bchip{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);
  border-radius:12px;padding:9px 13px;font-weight:700;font-size:.9rem;cursor:pointer;
  user-select:none;-webkit-user-select:none;transition:.14s}
.bchip:hover{border-color:var(--lime)}
.bchip.sel{background:linear-gradient(135deg,var(--gold),var(--rose));color:#FFF7F0;border-color:transparent;
  box-shadow:0 8px 18px -8px rgba(231,57,13,.6)}
.ionchip{display:inline-grid;place-items:center;min-width:34px;height:26px;padding:0 7px;border-radius:8px;
  font-weight:800;font-size:.82rem;color:#FFF7F0}
.ionchip sup{font-size:.72em}
.ionchip.pos{background:linear-gradient(135deg,#F2994A,#B84418)}
.bchip.sel .ionchip{box-shadow:0 0 0 2px rgba(255,255,255,.75)}

/* ── ด่าน 4 · ทดลองตอกแผ่นโลหะ ── */
.britsplit{stroke:var(--muted);stroke-width:2;stroke-dasharray:7 6;opacity:.65}
.britq{font-size:15px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:#fff;pointer-events:none}
.britcap{font-size:12.5px;font-weight:700;text-anchor:middle;fill:var(--muted);pointer-events:none}
.attract line{stroke:var(--lime);stroke-width:3.2;stroke-linecap:round}
.attract path{fill:var(--lime)}

/* ── ด่าน 5 · ห้องโลหะผสม ── */
.alt{font-size:14px;font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none;
  paint-order:stroke fill;stroke:rgba(4,38,30,.35);stroke-width:2.5px;stroke-linejoin:round;fill:#fff}
.alt.sm{font-size:11px;stroke-width:2px}
.aslot{fill:rgba(255,255,255,.6);stroke:var(--line);stroke-width:2;stroke-dasharray:5 4;cursor:pointer;transition:.14s}
.aslot.on{fill:rgba(242,103,22,.14);stroke:var(--gold);stroke-width:2.5}
.block line{stroke:var(--bad);stroke-width:3.4;stroke-linecap:round;opacity:.9}
.ionchip.guest{background:linear-gradient(135deg,#4E9370,#26603C)}

@media(max-width:640px){
  .labtop .fml{font-size:1.25rem}
  .bchip{padding:8px 11px;font-size:.84rem;flex:1 1 44%;justify-content:center}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="hud">
    <div class="brand"><span class="leaf">⚡</span><span>เมืองทะเลอิเล็กตรอน</span></div>
    <div class="spacer"></div>
    <div class="chip xp">⚡ XP <b id="hudXp">0</b></div>
    <div class="chip">⭐ <b id="hudStars">0</b>/18</div>
    <button class="btn sm ghost" id="btnHome">🗺️ แผนที่</button>
  </div>

  <div id="app"></div>

  <div class="footer">
    <div class="fb"><img src="../icons/brand-chem.png" alt="โลโก้ Chemistry" onerror="this.remove()"><span>Chemistry<b>.</b></span></div>
    เกมประกอบตำราเคมี ม.4 · หน่วยที่ 3 พันธะเคมี เรื่อง <b>พันธะโลหะ</b><br>
    อิงหลักสูตร สสวท. (ฉบับปรับปรุง พ.ศ. 2560) · ความก้าวหน้าถูกบันทึกไว้ในเครื่องของผู้เล่นเอง
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================================
   เมืองทะเลอิเล็กตรอน — เกมประกอบการเรียนรู้ เรื่องพันธะโลหะ (เคมี ม.4)
   ไฟล์เดียว ทำงานออฟไลน์ · ใช้โครงเดียวกับเกมชีววิทยาชุดเดิมในเว็บไซต์นี้
   ========================================================================= */

const app   = document.getElementById('app');
const toastEl = document.getElementById('toast');
const SAVE_KEY = 'metallic-quest-v1';

const defaultState = { xp:0, stars:{}, plays:{}, secs:{}, miss:{} };
let S = load();

function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return structuredClone(defaultState);
    return Object.assign(structuredClone(defaultState), JSON.parse(raw));
  }catch(e){ return structuredClone(defaultState); }
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function totalStars(){ return Object.values(S.stars).reduce((a,b)=>a+b,0); }
function syncHud(){
  document.getElementById('hudXp').textContent = S.xp;
  document.getElementById('hudStars').textContent = totalStars();
}
let toastTimer;
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 2200);
}
function shuffle(a){
  const r=a.slice();
  for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}
/* สุ่มหยิบตัวอย่างมาเล่นครั้งละชุด · หยิบแยกตามกลุ่มความยาก ไม่ใช่สุ่มล้วน
   ถ้าสุ่มล้วนจากคลังเดียว บางรอบจะได้ของง่ายหมดหรือยากหมด ความยากของด่านจะไม่คงที่
   plan = { ชื่อกลุ่ม: จำนวนที่หยิบ } · คืนค่าเรียงตามลำดับเดิมในคลัง ความยากจึงยังไล่จากง่ายไปยาก */
function pickByGroup(pool, plan){
  const out = [];
  Object.entries(plan).forEach(([g, n]) => out.push(...shuffle(pool.filter(x => x.g === g)).slice(0, n)));
  return out.sort((a, b) => pool.indexOf(a) - pool.indexOf(b));
}
/* สุ่มหยิบจากคลังที่ไม่ได้แบ่งกลุ่ม · ใช้กับการ์ดจับคู่ที่ความยากใกล้เคียงกันอยู่แล้ว */
function pickSome(pool, n){
  return shuffle(pool).slice(0, n).sort((a, b) => pool.indexOf(a) - pool.indexOf(b));
}
function stars(n,max=3){ let s=''; for(let i=0;i<max;i++) s+= i<n?'★':'<span class="off">★</span>'; return s; }

const STAGES = [
  { id:'sea',      ic:'⚡', title:'ห้องทะเลอิเล็กตรอน', desc:'ปล่อยเวเลนซ์อิเล็กตรอนออกจากอะตอมโลหะ · เกิดไอออนบวกในทะเลอิเล็กตรอน', req:0 },
  { id:'pack',     ic:'🧊', title:'ห้องจัดเรียงอะตอม',  desc:'ผลึกโลหะ 3 มิติ · BCC · FCC · HCP · เลขโคออร์ดิเนชันกับการจัดเรียงชิด', req:1 },
  { id:'strength', ic:'💪', title:'ห้องวัดความแข็งแรง',  desc:'เวเลนซ์อิเล็กตรอนกับขนาดไอออน กำหนดจุดหลอมเหลวของโลหะอย่างไร', req:2 },
  { id:'props',    ic:'✨', title:'คลังสมบัติโลหะ',      desc:'ตีแผ่ได้ · นำไฟฟ้าทุกสถานะ · เป็นมันวาว · อธิบายด้วยทะเลอิเล็กตรอน', req:3 },
  { id:'alloy',    ic:'🔩', title:'ห้องโลหะผสม',        desc:'แทนที่กับแทรกช่องว่าง · ทองเหลือง เหล็กกล้า สแตนเลส', req:4 },
  { id:'boss',     ic:'👹', title:'บอส: ห้องตรวจคุณภาพ', desc:'วินิจฉัยสารที่ไม่รู้จัก และสรุปเทียบพันธะทั้งสามชนิด', req:5 }
];

function renderMap(){
  syncHud();
  const cleared = STAGES.filter(s=>S.stars[s.id]>0).length;
  app.innerHTML = `
    <div class="hero">
      <div class="pub"><img src="../icons/brand-chem.png" alt="โลโก้ Chemistry" onerror="this.remove()"><span>Chemistry<b>.</b></span></div>
      <h1>เมืองทะเลอิเล็กตรอน</h1>
      <p>ทำไมโลหะถึง<strong>นำไฟฟ้าได้ตั้งแต่ตอนเป็นของแข็ง</strong><br>
         ตีแผ่เป็นแผ่นบางได้โดยไม่แตก และเป็นมันวาว — ทั้งที่ผลึกเกลือทำไม่ได้สักอย่าง</p>
      <div class="eq">พันธะโลหะ = แรงดึงดูดระหว่าง<b>ไอออนบวก</b>ที่เรียงชิดกัน กับ<b>ทะเลอิเล็กตรอน</b>ที่เคลื่อนที่ได้อิสระรอบตัว</div>
      <div id="classSlot"></div>
    </div>
    <div class="maplist">
      ${STAGES.map((s,i)=>{
        const got=S.stars[s.id]||0, locked=cleared<s.req;
        return `<div class="node ${locked?'locked':''} ${got?'done':''}" data-id="${s.id}">
          <span class="no">ด่าน ${i+1}</span>
          <div class="ic">${locked?'🔒':s.ic}</div>
          <div class="body">
            <div class="t">${s.title}</div>
            <div class="d">${locked?`ผ่านด่านก่อนหน้าให้ครบ ${s.req} ด่านเพื่อปลดล็อก`:s.desc}</div>
            ${locked?'':`<div class="stars">${stars(got)}</div>`}
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="card" style="margin-top:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
      <div style="font-size:2rem">🃏</div>
      <div style="flex:1;min-width:190px">
        <div style="font-weight:800">การ์ดคำศัพท์</div>
        <div class="small muted">${CARDS.length} การ์ด ทบทวนศัพท์ไทย–อังกฤษ พร้อมนิยาม เปิดเล่นได้ตลอดเวลา</div>
      </div>
      <button class="btn gold" id="btnCards">เปิดสำรับ</button>
    </div>
    ${certCardHtml()}
    <div class="center endrow" style="margin-top:18px">
      <a class="btn ghost sm" href="../">🏠 กลับหน้าแรก</a>
      <button class="btn ghost sm" id="btnReset">🔄 เริ่มใหม่ทั้งหมด</button>
    </div>
  `;
  app.querySelectorAll('.node').forEach(n=>{
    n.addEventListener('click',()=>{
      if(n.classList.contains('locked')){ toast('🔒 ยังไม่ปลดล็อกด่านนี้'); return; }
      openStage(n.dataset.id);
    });
  });
  document.getElementById('btnCards').onclick = renderCards;
  const certBtn = document.getElementById('btnCert');
  if(certBtn && !certBtn.disabled) certBtn.onclick = renderCert;
  document.getElementById('btnReset').onclick = ()=>{
    if(confirm('ล้างดาวและคะแนนทั้งหมดในเครื่องนี้? (ห้องเรียนที่เข้าร่วมไว้ยังอยู่)')){
      S=structuredClone(defaultState); save(); renderMap(); toast('เริ่มใหม่แล้ว');
    }
  };
  renderClassChip();
  window.scrollTo({top:0,behavior:'smooth'});
}

function stageShell(id, extraHtml=''){
  const st = STAGES.find(s=>s.id===id);
  return `<div class="stagehead">
      <div class="ic">${st.ic}</div>
      <div style="flex:1;min-width:200px"><h2>${st.title}</h2><div class="sub">${st.desc}</div></div>
    </div>${extraHtml}`;
}
let stageT0 = 0;        // เวลาเริ่มด่าน ใช้คำนวณเวลาที่ใช้ต่อด่าน
let stageMiss = 0;      // จำนวนครั้งที่ตอบผิดในด่านที่กำลังเล่น (ตั้งค่าก่อนเรียก finishStage)
function openStage(id){
  window.scrollTo({top:0});
  stageT0 = Date.now(); stageMiss = 0;
  ({sea:stageSea, pack:stagePack, strength:stageStrength,
    props:stageProps, alloy:stageAlloy, boss:stageBoss})[id]();
}
function finishStage(id, got, xp, summaryHtml){
  const prev=S.stars[id]||0; if(got>prev) S.stars[id]=got;
  S.plays = S.plays || {}; S.plays[id] = (S.plays[id]||0) + 1;
  S.xp+=xp; save(); syncHud();
  const secs = stageT0 ? Math.round((Date.now()-stageT0)/1000) : 0;
  const misses = Math.max(0, stageMiss|0); stageMiss = 0;
  S.secs = S.secs || {}; S.miss = S.miss || {};
  S.secs[id] = secs; S.miss[id] = misses;   // เก็บไว้เผื่อเข้าร่วมห้องทีหลัง จะได้ส่งเวลาจริงตามไปด้วย
  save();
  sendScore(id, got, misses, secs);   // ส่งคะแนนให้ครู (ถ้าเข้าร่วมห้อง)
  app.innerHTML = `
    <div class="card result">
      <div class="big">${stars(got)}</div>
      <h2>${got===3?'สมบูรณ์แบบ!':got===2?'เก่งมาก!':got===1?'ผ่านแล้ว':'ยังไม่ผ่าน'}</h2>
      <p class="muted">ได้รับ <b style="color:var(--lime)">+${xp} XP</b></p>
      <div style="text-align:left;max-width:640px;margin:18px auto 0">${summaryHtml}</div>
      <div style="margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn" id="again">เล่นด่านนี้อีกครั้ง</button>
        <button class="btn primary" id="back">กลับแผนที่ →</button>
      </div>
    </div>`;
  document.getElementById('again').onclick = ()=>openStage(id);
  document.getElementById('back').onclick  = renderMap;
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- เครื่องมือที่ใช้ร่วมกันหลายด่าน ---------- */
/* จัดกลุ่มลงกล่อง — items = [{n, g, e}] · groups = {key:'ชื่อกล่อง'} */
function bindBuckets(items, groups, pbId, fbId, onDone){
  let armed=null, placed=0, wrong=0;
  const fb=document.getElementById(fbId), pb=document.getElementById(pbId);
  app.querySelectorAll('#pool .tok').forEach(t=>{
    t.onclick=()=>{
      app.querySelectorAll('#pool .tok').forEach(x=>x.classList.remove('sel'));
      app.querySelectorAll('.bucket').forEach(x=>x.classList.remove('armed'));
      if(armed===t.dataset.n){ armed=null; return; }
      armed=t.dataset.n; t.classList.add('sel');
      app.querySelectorAll('.bucket').forEach(x=>x.classList.add('armed'));
    };
  });
  app.querySelectorAll('.bucket').forEach(b=>{
    b.onclick=()=>{
      if(!armed) return;
      const it=items.find(x=>x.n===armed);
      if(it.g===b.dataset.g){
        document.getElementById('items-'+it.g).insertAdjacentHTML('beforeend', `<span>${it.n}</span>`);
        app.querySelector(`#pool .tok[data-n="${armed}"]`).classList.add('used');
        placed++; if(pb) pb.style.width=(placed/items.length*100)+'%';
        fb.className='feedback show good'; fb.innerHTML=`✅ <b>${it.n}</b> — ${it.e}`;
        armed=null; app.querySelectorAll('.bucket').forEach(x=>x.classList.remove('armed'));
        if(placed===items.length) setTimeout(()=>onDone(wrong),1000);
      }else{
        wrong++; b.classList.add('wrong'); setTimeout(()=>b.classList.remove('wrong'),400);
        fb.className='feedback show bad';
        fb.innerHTML=`❌ <b>${it.n}</b> ยังไม่ใช่กล่องนี้ — ลองอ่านหัวข้อกล่องอีกครั้ง`;
      }
    };
  });
}
/* เรียงลำดับขั้นตอน — steps = [{n, e}] เรียงถูกตามลำดับใน array */
function orderBoard(steps, hint){
  const pool = shuffle(steps.map((z,i)=>({...z,i})));
  return `<div class="chain" id="chain"><span class="ph">${hint}</span></div>
    <div class="pool" id="pool">${pool.map(p=>`<div class="tok" data-i="${p.i}">${p.n}</div>`).join('')}</div>`;
}
function bindOrder(steps, onDone){
  let idx=0, wrong=0;
  const chain=document.getElementById('chain'), fb=document.getElementById('fb'), pb=document.getElementById('pb');
  app.querySelectorAll('#pool .tok').forEach(t=>{
    t.onclick=()=>{
      const i=+t.dataset.i;
      if(i===idx){
        if(idx===0) chain.innerHTML=''; else chain.insertAdjacentHTML('beforeend','<span class="arrow">→</span>');
        chain.insertAdjacentHTML('beforeend', `<span class="link">${steps[i].n}</span>`);
        t.classList.add('used');
        fb.className='feedback show good'; fb.innerHTML=`✅ <b>${steps[i].n}</b><br>${steps[i].e}`;
        idx++; if(pb) pb.style.width=(idx/steps.length*100)+'%';
        if(idx===steps.length) setTimeout(()=>onDone(wrong),1300);
      }else{
        wrong++; t.classList.add('bad'); setTimeout(()=>t.classList.remove('bad'),400);
        fb.className='feedback show bad';
        fb.innerHTML=`❌ ยังไม่ถึงคิวของ <b>${steps[i].n}</b> — ลองไล่ดูว่าขั้นก่อนหน้านี้ต้องเกิดอะไรขึ้นก่อน`;
      }
    };
  });
}
/* จับคู่การ์ด — pairs = [{k, n, em, h, d}] */
/* กระดานจับคู่ · โหมดของ hide
     'all'  ซ่อนทั้งคำใบ้และคำอธิบาย — ใช้เมื่อคำใบ้คือเฉลย เช่นจำนวนอะตอมในด่านตั้งชื่อ
     'desc' โชว์คำใบ้ไว้ ซ่อนแต่คำอธิบาย — ใช้เมื่อคำใบ้คือโจทย์ เช่นโครงสร้างผลึกในด่านสมบัติสาร
     ไม่ใส่ โชว์ทั้งหมดตั้งแต่แรก */
function matchBoard(pairs, hide){
  const cards = shuffle(pairs);
  return `<div class="bank" id="pool">${shuffle(pairs).map(j=>`<div class="tok" data-k="${j.k}">${j.n}</div>`).join('')}</div>
    <div class="match" id="match" style="margin-top:14px">
      ${cards.map(j=>{
        const body = hide==='all'  ? '<b class="h muted">เลือกชื่อที่ตรงกับการ์ดนี้</b>'
                   : hide==='desc' ? `<b class="h">${j.h}</b>`
                   : `<b class="h">${j.h}</b>${j.d}`;
        return `<div class="mcard${hide?' quiet':''}" data-k="${j.k}">
          <div class="em">${j.em}</div><div class="tx">${body}</div>
        </div>`;
      }).join('')}
    </div>`;
}
function bindMatch(pairs, onDone){
  let armed=null, done=0, wrong=0;
  const fb=document.getElementById('fb'), pb=document.getElementById('pb');
  app.querySelectorAll('#pool .tok').forEach(t=>{

      app.querySelectorAll('#pool .tok').forEach(x=>x.classList.remove('sel'));

      if(armed===t.dataset.k){ armed=null; return; }
      armed=t.dataset.k; t.classList.add('sel');
      app.querySelectorAll('.mcard:not(.done)').forEach(x=>x.classList.add('armed'));

  app.querySelectorAll('.mcard').forEach(c=>{

        if(c.classList.contains('quiet')){       // เปิดคำอธิบายที่ซ่อนไว้ออกมาตอนตอบถูก
          c.classList.remove('quiet');

        app.querySelector(`#pool .tok[data-k="${armed}"]`).classList.add('used');

        armed=null; app.querySelectorAll('.mcard').forEach(x=>x.classList.remove('armed'));
        if(done===pairs.length) setTimeout(()=>onDone(wrong),1100);
      }else{
        wrong++; c.classList.add('wrong'); setTimeout(()=>c.classList.remove('wrong'),400);
        fb.className='feedback show bad'; fb.innerHTML=`❌ <b>${j.n}</b> ยังไม่ใช่การ์ดนี้ ลองอ่านคำอธิบายอีกครั้ง`;
      }
    };
  });
}
/* สลับตำแหน่งตัวเลือกแล้วคืนชุดใหม่พร้อมเลขข้อที่ถูกตามตำแหน่งใหม่
   ทำทุกครั้งที่เล่น ผู้เล่นจึงจำไม่ได้ว่าเฉลยอยู่ข้อไหน และเดาจากตำแหน่งไม่ได้
   (คำอธิบายจึงต้องไม่อ้างอิงลำดับตัวเลือกเด็ดขาด) */
function shuffleOpts(q){
  const idx = shuffle(q.o.map((_,i)=>i));
  return { ...q, o: idx.map(i=>q.o[i]), a: idx.indexOf(q.a) };
}
/* ชุดคำถามปรนัยท้ายด่าน — qs = [{q, o[], a, e}] */
function quizRun(qs, hostId, onDone){
  let qi=0, wrong=0;
  const host=document.getElementById(hostId);
  const set = qs.map(shuffleOpts);
  function draw(){
    const q=set[qi];
    host.innerHTML = `<div class="scene">
      <div class="small muted">คำถาม ${qi+1}/${set.length}</div>
      <h3 style="margin:6px 0 4px">${q.q}</h3>
      <div class="opts">${q.o.map((o,j)=>`<div class="opt" data-i="${j}">${o}</div>`).join('')}</div>
      <div class="feedback" id="qfb"></div>
    </div>`;
    host.querySelectorAll('.opt').forEach(op=>{
      op.onclick=()=>{
        const j=+op.dataset.i, ok=j===q.a; if(!ok) wrong++;
        host.querySelectorAll('.opt').forEach((x,k)=>{
          x.classList.add('disabled');
          if(k===q.a) x.classList.add('correct'); else if(k===j) x.classList.add('incorrect');
        });
        const f=host.querySelector('#qfb'); f.className='feedback show '+(ok?'good':'bad');
        f.innerHTML=(ok?'✅ ถูกต้อง! ':'❌ ยังไม่ใช่ ')+q.e+
          `<div style="margin-top:12px"><button class="btn primary sm" id="nx">${qi===set.length-1?'สรุปผล →':'ข้อถัดไป →'}</button></div>`;
        f.querySelector('#nx').onclick=()=>{ qi++; if(qi<set.length){ draw(); window.scrollTo({top:0,behavior:'smooth'}); } else onDone(wrong); };
      };
    });
  }
  draw();
}

   ตัวช่วยที่ใช้ร่วมกันหลายด่านของเกมนี้
   ========================================================================= */
/* หมุนภาพ 3 มิติด้วยการลาก · จับ pointer หลังขยับเกิน 5px เท่านั้น
   การแตะสั้น ๆ จะได้ยังนับเป็นการกดวัตถุในภาพ ไม่กลายเป็นการหมุน */
function spinner(svg, get, redraw, onTap){
  let sx=0, sy=0, px=0, py=0, spin=false, moved=false, pid=null;
  function end(){
    if(pid!==null && svg.hasPointerCapture && svg.hasPointerCapture(pid)) svg.releasePointerCapture(pid);
    spin=false; pid=null;
  }
  svg.addEventListener('pointerdown', ev=>{
    spin=true; moved=false; pid=ev.pointerId;
    sx=px=ev.clientX; sy=py=ev.clientY;
  });
  svg.addEventListener('pointermove', ev=>{
    if(!spin) return;
    if(ev.pointerType==='mouse' && !ev.buttons){ end(); return; }
    if(!moved && Math.hypot(ev.clientX-sx, ev.clientY-sy) > 5){ moved=true; svg.setPointerCapture(pid); }
    if(!moved) return;
    const v = get();
    v.ry += (ev.clientX-px)*0.011;
    v.rx = Math.max(-1.35, Math.min(1.35, v.rx + (ev.clientY-py)*0.009));
    px=ev.clientX; py=ev.clientY; redraw();
  });
  svg.addEventListener('pointerup', ev=>{
    const wasMoved = moved; end();
    if(!wasMoved && onTap) onTap(ev);
  });
  svg.addEventListener('pointercancel', end);
}

/* หมุนรอบแกน Y แล้วแกน X จากนั้นฉายภาพแบบมีเปอร์สเปกทีฟ
   คืนพิกัดบนจอ พร้อมค่า z ไว้เรียงลำดับการวาด และ k ไว้ย่อ-ขยายตามระยะ */
function project3(p, view){
  const [x,y,z] = p, { rx, ry, scale, cx, cy, dist } = view;
  const cy_ = Math.cos(ry), sy_ = Math.sin(ry);
  const x1 =  x*cy_ + z*sy_;
  const z1 = -x*sy_ + z*cy_;
  const cx_ = Math.cos(rx), sx_ = Math.sin(rx);
  const y2 = y*cx_ - z1*sx_;
  const z2 = y*sx_ + z1*cx_;
  const k = dist/(dist - z2);
  return { x: cx + x1*scale*k, y: cy - y2*scale*k, z: z2, k };
}
const chg = q => q===0 ? '' : (Math.abs(q)>1 ? Math.abs(q) : '') + (q>0 ? '+' : '−');

/* สีและขนาดของโลหะที่ใช้ในเกม · r = รัศมีอะตอมกลาง · ri = รัศมีไอออนบวกหลังเสียอิเล็กตรอน */

/* =========================================================================
   ด่าน 1 — ห้องทะเลอิเล็กตรอน
   พันธะโลหะไม่ได้ให้-รับกันเหมือนไอออนิก และไม่ได้ใช้ร่วมกันเป็นคู่เหมือนโคเวเลนต์
   แต่เวเลนซ์อิเล็กตรอนหลุดออกมาเป็น "ของส่วนกลาง" ที่วิ่งไปทั่วทั้งก้อน
   ด่านนี้จึงให้ผู้เล่นแตะปล่อยอิเล็กตรอนออกจากอะตอมเอง แล้วเห็นมันวิ่งจริง ๆ
   ========================================================================= */
const SEA_SET = [
  { el:'Na', n:6, tip:'โซเดียมมีเวเลนซ์อิเล็กตรอนเพียง 1 ตัว และพลังงานไอออไนเซชันต่ำ อิเล็กตรอนจึงหลุดออกมาง่าย' },
  { el:'Mg', n:6, tip:'แมกนีเซียมปล่อยได้อะตอมละ 2 ตัว ทะเลอิเล็กตรอนจึงหนาแน่นกว่าโซเดียมเท่าตัว' },
  { el:'Al', n:6, tip:'อะลูมิเนียมปล่อยได้ถึงอะตอมละ 3 ตัว เป็นเหตุผลที่พันธะโลหะของมันแข็งแรงที่สุดในสามตัวนี้' }
];

/* เล่นห้องทะเลอิเล็กตรอนจนครบทุกโลหะ แล้วเรียก onDone พร้อมจำนวนครั้งที่ทำผิด */
function seaLab(hostId, pbId, onDone){
  const host = document.getElementById(hostId), pb = document.getElementById(pbId);
  const VB_W = 470, VB_H = 300;
  let idx = 0, wrong = 0;

  function start(){
    const S = SEA_SET[idx], E = MET[S.el];
    const freed = Array(S.n).fill(0);              // อะตอมตัวที่ i ปล่อยอิเล็กตรอนไปแล้วกี่ตัว
    let done = false, flow = 0, raf = null;        // flow = เฟสของการเคลื่อนที่ของอิเล็กตรอนอิสระ
    const need = E.v * S.n;

    /* วางอะตอมเป็นตะแกรง 3 × 2 แบบผลึกโลหะที่อัดกันแน่น แถวล่างเยื้องครึ่งช่อง */
    const COLS = 3, GAPX = 108, GAPY = 96;
    const pos = i => ({
      x: VB_W/2 + ((i%COLS) - (COLS-1)/2)*GAPX + (i>=COLS ? GAPX/2 : 0) - (i>=COLS ? GAPX/4 : 0),
      y: VB_H/2 + (Math.floor(i/COLS) - 0.5)*GAPY
    });

    host.innerHTML = `<div class="lab">
      <div class="labtop">
        <div><span class="fml">${S.el}</span> <span class="nm">${E.nm} · เวเลนซ์อิเล็กตรอน ${E.v} ต่ออะตอม</span></div>
        <div class="cnt" id="cnt"></div>
      </div>
      <div class="molwrap" style="max-width:520px">
        <svg class="tsvg" id="sea" viewBox="0 0 ${VB_W} ${VB_H}"
             aria-label="แผนภาพทะเลอิเล็กตรอนของโลหะ ${S.el}"></svg>
      </div>
      <div class="palette">
        <button class="btn ghost sm" id="undo">↺ เริ่มใหม่</button>
        <span class="small muted" style="align-self:center">
          แตะ<b>จุดอิเล็กตรอนสีแดง</b>รอบอะตอม เพื่อปล่อยให้เป็นอิเล็กตรอนอิสระ</span>
      </div>
      <div class="feedback" id="sfb"></div>
    </div>`;
    const svg = document.getElementById('sea'), fb = document.getElementById('sfb');
    document.getElementById('undo').onclick = ()=>{
      if(done) return;
      freed.fill(0); fb.className='feedback'; draw();
    };

    /* อิเล็กตรอนอิสระวิ่งวนอยู่ในก้อนโลหะ ตำแหน่งคำนวณจากเฟส flow
       ใช้เส้นทางลิสซาจูส์ จะได้ดูเหมือนวิ่งไปทั่วไม่เป็นวงกลมซ้ำที่เดิม */
    function freePos(k, total){
      const t = flow + k*2*Math.PI/Math.max(total,1);
      return { x: VB_W/2 + Math.sin(t*1.0 + k)*160, y: VB_H/2 + Math.sin(t*1.6 + k*2.1)*82 };
    }

    function draw(){
      const gone = freed.reduce((a,b)=>a+b,0);
      let g = `<defs><radialGradient id="m-${S.el}" cx="34%" cy="30%" r="72%">
          <stop offset="0%" stop-color="#fff" stop-opacity=".82"/>
          <stop offset="42%" stop-color="${E.c}"/><stop offset="100%" stop-color="${E.d}"/></radialGradient>
        </defs>`;
      // พื้นหลังทะเลอิเล็กตรอน เข้มขึ้นตามจำนวนอิเล็กตรอนที่ปล่อยออกมา
      if(gone) g += `<rect class="seabg" x="6" y="6" width="${VB_W-12}" height="${VB_H-12}" rx="16"
          opacity="${(gone/need*0.5).toFixed(2)}"/>`;
      g += `<text class="tflow" x="${VB_W/2}" y="24">${gone===need
        ? 'ทะเลอิเล็กตรอน · อิเล็กตรอนวิ่งไปทั่วทั้งก้อน ไม่เป็นของอะตอมใดอะตอมหนึ่ง'
        : 'แตะจุดสีแดงเพื่อปล่อยเวเลนซ์อิเล็กตรอนออกมา'}</text>`;

      // อิเล็กตรอนอิสระที่ปล่อยออกมาแล้ว วาดไว้ใต้ลูกกลม
      for(let k=0;k<gone;k++){
        const q = freePos(k, need);
        g += `<circle class="efree" cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="6"/>`;
      }
      // อะตอมกับเวเลนซ์อิเล็กตรอนที่ยังไม่ได้ปล่อย
      for(let i=0;i<S.n;i++){
        const p = pos(i), left = E.v - freed[i], isIon = left===0;
        const r = isIon ? E.ri : E.r;
        for(let k=0;k<left;k++){
          const a = -Math.PI/2 + k*2*Math.PI/Math.max(left,1);
          const x = p.x + Math.cos(a)*(r+13), y = p.y + Math.sin(a)*(r+13);
          g += `<circle class="edot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6.5"/>`;
          if(!done) g += `<circle class="ehit" data-e="${i}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="18"/>`;
        }
        g += `<circle class="tball" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r}"
                fill="url(#m-${S.el})" stroke="${E.d}" stroke-width="2"/>
          <text class="atomt" x="${p.x.toFixed(1)}" y="${p.y.toFixed(1)}"
                font-size="${(r*0.9).toFixed(0)}" fill="#fff">${S.el}</text>
          ${isIon ? `<text class="tchg" x="${(p.x+r*0.95).toFixed(1)}" y="${(p.y-r*0.85).toFixed(1)}"
                >${chg(E.v)}</text>` : ''}`;
      }
      svg.innerHTML = g;
      document.getElementById('cnt').textContent =
        `ปล่อยแล้ว ${gone}/${need} อิเล็กตรอน · โลหะที่ ${idx+1}/${SEA_SET.length}`;

      svg.querySelectorAll('.ehit').forEach(h=>{
        h.onclick = ()=>{
          if(done) return;
          freed[+h.dataset.e]++;
          fb.className='feedback show good';
          fb.innerHTML = `✅ อิเล็กตรอนหลุดออกจากอะตอมแล้ว — จากนี้มัน<b>ไม่ได้เป็นของอะตอมเดิม</b>อีกต่อไป
            แต่วิ่งไปทั่วทั้งก้อนโลหะ`;
          draw(); check();
        };
      });
    }

    /* ปล่อยครบแล้วให้อิเล็กตรอนอิสระวิ่งวนไปเรื่อย ๆ จะได้เห็นว่ามันเคลื่อนที่ได้จริง */
    function animate(){
      flow += 0.016; draw();
      raf = requestAnimationFrame(animate);
    }

    function check(){
      if(freed.reduce((a,b)=>a+b,0) !== need) return;
      done = true;
      animate();
      if(pb) pb.style.width = ((idx+1)/SEA_SET.length*100)+'%';
      fb.className='feedback show good';
      fb.innerHTML = `🎉 <b>เกิดพันธะโลหะแล้ว!</b> ${S.tip}
        <div class="ioneq">
          <div>${S.el} → ${S.el}<sup>${chg(E.v)}</sup> + ${E.v===1?'e⁻':E.v+'e⁻'}
            <span class="small muted">(ทำแบบนี้ทุกอะตอมพร้อมกันทั้งก้อน)</span></div>
          <div>อะตอมทั้ง ${S.n} ตัวปล่อยรวมกัน <b>${need} อิเล็กตรอน</b> กลายเป็นของส่วนกลาง</div>
          <div class="tot">พันธะโลหะ = แรงดึงดูดระหว่าง <b>${S.el}<sup>${chg(E.v)}</sup> ที่เรียงชิดกัน</b>
            กับ <b>ทะเลอิเล็กตรอน</b> ที่ล้อมรอบ</div>
        </div>
        <div class="small muted" style="margin-top:8px">💡 สังเกตว่าอิเล็กตรอน<b>ไม่ได้ถูกยกให้อะตอมใดอะตอมหนึ่ง</b>
          เหมือนพันธะไอออนิก และ<b>ไม่ได้จับเป็นคู่</b>เหมือนพันธะโคเวเลนต์ — นี่คือจุดที่ต่างกัน</div>
        <div style="margin-top:12px"><button class="btn primary sm" id="nx">
          ${idx===SEA_SET.length-1?'ไปช่วงคำถาม →':'โลหะถัดไป →'}</button></div>`;
      fb.querySelector('#nx').onclick = ()=>{
        if(raf) cancelAnimationFrame(raf);
        idx++;
        if(idx < SEA_SET.length){ start(); window.scrollTo({top:0,behavior:'smooth'}); }
        else onDone(wrong);
      };
    }
    draw();
  }
  start();
}

/* =========================================================================
   ด่าน 2 — ห้องจัดเรียงอะตอม
   ไอออนบวกในโลหะไม่ต้องสลับประจุเหมือนผลึกไอออนิก จึงเรียงชิดกันได้แน่นที่สุด
   ด่านนี้ให้เติมอะตอมลงช่องว่างในผลึกจริงสามแบบ แล้วเทียบเลขโคออร์ดิเนชันกัน
   ========================================================================= */
/* เส้นกรอบของหน่วยเซลล์ · เชื่อมเฉพาะคู่ที่ห่างกันเท่ากับด้านสั้นที่สุดในกลุ่มที่ระบุ
   ทำให้ลูกบาศก์ (BCC · FCC) และหกเหลี่ยม (HCP) อ่านออกว่าเป็นรูปทรงอะไร ไม่ใช่กองลูกกลม */
function frameEdges(sites, idxs){
  const d3 = (a,b)=>Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]);
  let min = Infinity;
  for(let a=0;a<idxs.length;a++) for(let b=a+1;b<idxs.length;b++)
    min = Math.min(min, d3(sites[idxs[a]], sites[idxs[b]]));
  const out = [];
  for(let a=0;a<idxs.length;a++) for(let b=a+1;b<idxs.length;b++)
    if(Math.abs(d3(sites[idxs[a]], sites[idxs[b]]) - min) < 0.01) out.push([idxs[a], idxs[b]]);
  return out;
}

      .concat([0,1,2].map(i=>[Math.cos(i*2*Math.PI/3+0.52)*0.50, -0.72, Math.sin(i*2*Math.PI/3+0.52)*0.50])),
    note:'อะตอมกลางถูกล้อมด้วยเพื่อนบ้าน <b>12 ตัว</b> — 6 ตัวในระนาบเดียวกัน กับชั้นบน-ล่างชั้นละ 3 ตัว · แน่น <b>74%</b>' }

/* เล่นห้องจัดเรียงอะตอมจนครบทุกโครงสร้าง แล้วเรียก onDone พร้อมจำนวนครั้งที่วางผิด */
function packLab(hostId, pbId, onDone){
  const host = document.getElementById(hostId), pb = document.getElementById(pbId);
  const VB_W = 470, VB_H = 350, NEAR = 46;
  let idx = 0, wrong = 0;

  function start(){
    const P = PACK_SET[idx], E = MET[P.el];
    const filled = {};
    let armed = false, done = false;
    const view = { rx:P.rx, ry:P.ry, scale:P.scale, cx:VB_W/2, cy:VB_H/2 - 4, dist:16 };

    host.innerHTML = `<div class="lab">
      <div class="labtop">
        <div><span class="fml">${P.nm}</span> <span class="nm">${P.en}</span></div>
        <div class="cnt" id="cnt"></div>
      </div>
      <div class="molwrap" style="max-width:520px">
        <svg class="molsvg" id="pk" viewBox="0 0 ${VB_W} ${VB_H}"
             aria-label="ผลึกโลหะแบบ ${P.en}"></svg>
        <div class="spinhint">🔄 ลากที่ภาพเพื่อหมุนดูรอบด้าน</div>
      </div>
      <div class="palette" id="pal">
        <button class="bchip" data-t="a"><span class="ionchip pos">${P.el}<sup>${chg(E.v)}</sup></span>
          ไอออนบวกของ ${E.nm}</button>
        <span class="small muted" style="align-self:center">เลือกไอออนแล้วแตะช่องว่าง <b>?</b> ในผลึก</span>
      </div>
      <div class="feedback" id="pfb"></div>
    </div>`;
    const svg = document.getElementById('pk'), fb = document.getElementById('pfb');
    const holes = P.holes.filter(i=>i < P.sites.length);

    document.querySelector('#pal .bchip').onclick = function(){
      if(done) return;
      armed = !armed;
      this.classList.toggle('sel', armed);
    };

    function draw(){
      const Q = P.sites.map(p=>project3(p, view));
      const it = [];
      P.sites.forEach((p, i)=>{
        const hole = holes.includes(i) && !filled[i];
        const r = PACK_R*view.scale*Q[i].k;
        if(hole){
          it.push({ z:Q[i].z, hit:{ i, x:Q[i].x, y:Q[i].y },
            g:`<circle class="hole" cx="${Q[i].x.toFixed(1)}" cy="${Q[i].y.toFixed(1)}" r="${r.toFixed(1)}"/>
               <text class="holeq" x="${Q[i].x.toFixed(1)}" y="${Q[i].y.toFixed(1)}"
                 font-size="${(r*0.9).toFixed(0)}">?</text>` });
        }else{
          it.push({ z:Q[i].z, g:`<circle class="ionb" cx="${Q[i].x.toFixed(1)}" cy="${Q[i].y.toFixed(1)}"
            r="${r.toFixed(1)}" fill="url(#mp)" stroke="${E.d}" stroke-width="${(1.5*Q[i].k).toFixed(1)}"/>
            <text class="iont" x="${Q[i].x.toFixed(1)}" y="${Q[i].y.toFixed(1)}"
              font-size="${(r*0.66).toFixed(1)}">${P.el}</text>` });
        }
      });
      it.sort((a,b)=> a.z - b.z);
      // เส้นกรอบวาดก่อนลูกกลมทั้งหมด จะได้เป็นโครงจาง ๆ อยู่ด้านหลัง
      const ln = p => `x1="${Q[p[0]].x.toFixed(1)}" y1="${Q[p[0]].y.toFixed(1)}"
                       x2="${Q[p[1]].x.toFixed(1)}" y2="${Q[p[1]].y.toFixed(1)}"`;
      let wire = frameEdges(P.sites, P.frame).map(e=>`<line class="latbond" ${ln(e)}/>`).join('');
      if(P.hub != null)                      // เส้นประจากอะตอมกลางไปหาเพื่อนบ้านทุกตัว = เลขโคออร์ดิเนชัน
        wire += P.sites.map((_, i)=> i===P.hub ? '' :
          `<line class="latbond cn" ${ln([P.hub, i])}/>`).join('');
      svg.innerHTML = `<defs><radialGradient id="mp" cx="34%" cy="30%" r="72%">
          <stop offset="0%" stop-color="#fff" stop-opacity=".82"/>
          <stop offset="42%" stop-color="${E.c}"/><stop offset="100%" stop-color="${E.d}"/></radialGradient></defs>`
        + wire + it.map(o=>o.g).join('');
      svg._hits = it.filter(o=>o.hit).map(o=>o.hit);
      const left = holes.filter(i=>!filled[i]).length;
      document.getElementById('cnt').textContent =
        `เหลือช่องว่าง ${left} ช่อง · โครงสร้างที่ ${idx+1}/${PACK_SET.length}`;
    }

    function holeAt(cx, cy){
      let best = null, bd = NEAR;
      (svg._hits||[]).forEach(h=>{
        const d = Math.hypot(h.x-cx, h.y-cy);
        if(d < bd){ bd = d; best = h; }
      });
      return best;
    }
    spinner(svg, ()=>view, draw, ev=>{
      if(done) return;
      const r = svg.getBoundingClientRect();
      const pt = { x:(ev.clientX-r.left)/r.width*VB_W, y:(ev.clientY-r.top)/r.height*VB_H };
      const h = holeAt(pt.x, pt.y);
      if(!h) return;
      if(!armed){
        fb.className='feedback show bad';
        fb.innerHTML='❌ ยังไม่ได้เลือกไอออน — แตะปุ่ม<b>ไอออนบวก</b>ด้านล่างก่อน';
        return;
      }
      filled[h.i] = true;
      fb.className='feedback show good';
      fb.innerHTML = `✅ ถูกต้อง — ในผลึกโลหะทุกช่องเป็น<b>ไอออนบวกชนิดเดียวกันหมด</b>
        ไม่ต้องสลับประจุเหมือนผลึกไอออนิก จึงเรียงชิดกันได้แน่นกว่า`;
      draw();
      if(holes.every(i=>filled[i])) finish();
    });

    function finish(){
      done = true;
      if(pb) pb.style.width = ((idx+1)/PACK_SET.length*100)+'%';
      fb.className='feedback show good';
      fb.innerHTML = `🎉 <b>ผลึก${P.nm}สมบูรณ์!</b> ${P.note}
        <div class="ioneq">
          <div>เลขโคออร์ดิเนชัน: <b>${P.cn}</b> · ประสิทธิภาพการจัดเรียง: <b>${P.eff}</b></div>
          <div class="tot">โลหะที่มีโครงสร้างแบบนี้: <b>${P.ex}</b></div>
        </div>
        <div style="margin-top:12px"><button class="btn primary sm" id="nx">
          ${idx===PACK_SET.length-1?'ไปช่วงที่ 2 →':'โครงสร้างถัดไป →'}</button></div>`;
      fb.querySelector('#nx').onclick = ()=>{
        idx++;
        if(idx < PACK_SET.length){ start(); window.scrollTo({top:0,behavior:'smooth'}); }
        else onDone(wrong);
      };
    }
    draw();
  }
  start();
}

        <div class="note">🔵 <b>ต่อยอด:</b> จุดหลอมเหลว ความแข็ง และความหนาแน่น ล้วนเป็น<b>ผล</b>
          ของความแข็งแรงของพันธะ ไม่ใช่สาเหตุ — จะได้เห็นสมบัติอื่น ๆ อีกในด่านถัดไป</div>
        <div class="small muted">ตอบผิดทั้งหมด ${miss} ครั้ง</div>`);
    });
  }
}

/* =========================================================================
   ด่าน 4 — คลังสมบัติโลหะ
   ช่วงแรกเป็นการทดลองตอกโลหะ ซึ่งเป็น "คู่แฝด" ของการทดลองตอกผลึกเกลือในเกมพันธะไอออนิก
   ตอกเหมือนกัน เลื่อนระนาบเหมือนกัน แต่ผลลัพธ์ตรงข้ามกัน เพราะทะเลอิเล็กตรอนยังยึดไว้
   ========================================================================= */
function malleableLab(hostId, onDone){
  const host = document.getElementById(hostId);
  const COLS = 6, ROWS = 4, GAP = 52, R = 17;
  const SPLIT = 34;                              // ช่องว่างระหว่างสองระนาบ เผื่อที่วาดลูกศรบอกแรง
  const VB_W = COLS*GAP + 60, VB_H = ROWS*GAP + 70 + SPLIT;
  const rowY = r => 40 + r*GAP + (r >= ROWS/2 ? SPLIT : 0);
  let shift = 0, answered = false;

  host.innerHTML = `<div class="lab">
    <div class="labtop">
      <div><span class="fml">แผ่นทองแดง</span> <span class="nm">ทดลองออกแรงตอกให้ระนาบเลื่อน</span></div>
      <div class="cnt" id="mcnt">ยังไม่ได้ตอก</div>
    </div>
    <div class="molwrap" style="max-width:520px">
      <svg class="tsvg" id="mal" viewBox="0 0 ${VB_W} ${VB_H}"
           aria-label="แผนภาพโลหะก่อนและหลังเลื่อนระนาบ"></svg>
    </div>
    <div class="palette">
      <button class="btn gold sm" id="hit">🔨 ตอกให้ระนาบบนเลื่อนไป 1 ช่อง</button>
      <button class="btn ghost sm" id="rst">↺ เริ่มใหม่</button>
    </div>
    <div class="feedback" id="mfb"></div>
    <div id="mq"></div>
  </div>`;
  const svg = document.getElementById('mal'), fb = document.getElementById('mfb');

  function draw(){
    const half = ROWS/2, E = MET.Cu;
    let g = `<defs><radialGradient id="cu" cx="34%" cy="30%" r="72%">
        <stop offset="0%" stop-color="#fff" stop-opacity=".82"/>
        <stop offset="42%" stop-color="${E.c}"/><stop offset="100%" stop-color="${E.d}"/></radialGradient></defs>`;
    const splitY = (rowY(half-1) + rowY(half))/2;
    g += `<line class="britsplit" x1="8" y1="${splitY}" x2="${VB_W-8}" y2="${splitY}"/>`;

    // ทะเลอิเล็กตรอนวาดคลุมทั้งก้อน · ยังอยู่ครบแม้ระนาบจะเลื่อนไปแล้ว
    for(let k=0;k<26;k++){
      const x = 30 + (k*97)%(VB_W-60), y = 30 + (k*61)%(VB_H-60);
      g += `<circle class="efree sm" cx="${x}" cy="${y}" r="4.5"/>`;
    }
    for(let r=0;r<ROWS;r++){
      const dx = r < half ? shift*GAP : 0;
      for(let c=0;c<COLS;c++){
        const x = 40 + c*GAP + dx, y = rowY(r);
        if(x < 12 || x > VB_W-12) continue;
        g += `<circle class="ionb" cx="${x}" cy="${y}" r="${R}" fill="url(#cu)"
                stroke="${E.d}" stroke-width="1.6"/>
              <text class="britq" x="${x}" y="${y}">+</text>`;
      }
    }
    /* แรงระหว่างสองระนาบ · ในโลหะทุกอนุภาคเป็นบวกเหมือนกันหมด
       ถ้าไม่มีทะเลอิเล็กตรอนมันจะผลักกันทันที แต่อิเล็กตรอนอิสระยังยึดไว้ได้ทุกตำแหน่ง
       ลูกศรจึงเป็นสีเขียว "ดึงดูด" ทั้งก่อนและหลังเลื่อน ต่างจากผลึกไอออนิก */
    const rTop = half-1, rBot = half;
    for(let c=0;c<COLS;c++){
      const src = c - shift;
      if(src < 0 || src >= COLS) continue;
      const x = 40 + c*GAP;
      if(x < 12 || x > VB_W-12) continue;
      const y1 = rowY(rTop) + R + 5, y2 = rowY(rBot) - R - 5, ym = (y1+y2)/2;
      const head = (y, dir)=> `<path d="M${x-5.5},${(y-dir*7).toFixed(1)} L${x+5.5},${(y-dir*7).toFixed(1)} L${x},${y.toFixed(1)} Z"/>`;
      g += `<g class="attract"><line x1="${x}" y1="${y1.toFixed(1)}" x2="${x}" y2="${(ym-7).toFixed(1)}"/>
             ${head(ym-2, 1)}
             <line x1="${x}" y1="${y2.toFixed(1)}" x2="${x}" y2="${(ym+7).toFixed(1)}"/>
             ${head(ym+2, -1)}</g>`;
    }
    // คำบรรยายแบ่งสองบรรทัด เพราะกรอบภาพกว้างไม่พอสำหรับข้อความยาว
    g += `<text class="britcap" x="${VB_W/2}" y="${VB_H-28}">${shift
      ? 'ระนาบเลื่อนแล้ว · ทะเลอิเล็กตรอนยังยึดไว้เหมือนเดิม'
      : 'โลหะปกติ · ไอออนบวกจมอยู่ในทะเลอิเล็กตรอนเดียวกัน'}</text>
      <text class="britcap" x="${VB_W/2}" y="${VB_H-11}">${shift
      ? '→ แผ่นแบนลงโดยไม่แตก'
      : 'กดปุ่มค้อนเพื่อออกแรงตอก'}</text>`;
    svg.innerHTML = g;
    document.getElementById('mcnt').textContent = shift ? 'ตอกแล้ว · แผ่นแบนลง ไม่แตก' : 'ยังไม่ได้ตอก';
  }

  document.getElementById('rst').onclick = ()=>{ shift = 0; fb.className='feedback'; draw(); };
  document.getElementById('hit').onclick = ()=>{
    if(shift) return;
    shift = 1; draw();
    fb.className='feedback show good';
    fb.innerHTML = `🔨 <b>แผ่นทองแดงแบนลงโดยไม่แตก!</b> ระนาบบนเลื่อนไปหนึ่งช่องแล้ว
      แต่<b>ทะเลอิเล็กตรอนเคลื่อนที่ตามไปด้วย</b> ไอออนบวกจึงยังถูกยึดไว้ทุกตำแหน่งเหมือนเดิม
      ไม่มีจังหวะไหนที่ประจุเหมือนกันมาเจอกันแล้วผลักจนแตก`;
    if(!answered) askQ();
  };

  function askQ(){
    const box = document.getElementById('mq');
    const Q = {
      q:'เทียบกับการตอก<b>ผลึกเกลือ</b>ที่แตกเป็นเสี่ยง — ทำไมโลหะจึงแบนลงแทนที่จะแตก',
      o:['เพราะทะเลอิเล็กตรอนเคลื่อนที่ตามไปยึดไอออนบวกไว้ได้ทุกตำแหน่ง',
         'เพราะไอออนบวกในโลหะมีขนาดเล็กกว่าไอออนในผลึกเกลือมาก',
         'เพราะพันธะโลหะอ่อนกว่าพันธะไอออนิก จึงยืดหยุ่นได้มากกว่า',
         'เพราะโลหะมีช่องว่างระหว่างไอออนมากกว่า จึงยุบตัวลงได้'],
      a:0,
      e:'ในผลึกเกลือ ประจุอยู่<b>ตำแหน่งตายตัว</b> เลื่อนเมื่อไรประจุเหมือนกันจะมาเจอกันแล้วผลักจนแตก<br>' +
        'ในโลหะ ไอออนบวกทุกตัวเหมือนกันหมดและจมอยู่ใน<b>ทะเลอิเล็กตรอนเดียวกัน</b> ' +
        'เลื่อนไปตำแหน่งไหนก็ยังมีอิเล็กตรอนยึดไว้ จึง<b>ตีแผ่</b>เป็นแผ่นและ<b>ดึงเป็นเส้น</b>ได้<br>' +
        'สังเกตว่าพันธะโลหะ<b>ไม่ได้อ่อน</b> — ทองแดงหลอมเหลวที่ 1,085 °C ซึ่งสูงกว่าเกลือแกงเสียอีก'
    };
    box.innerHTML = `<div class="scene" style="margin-top:14px">
      <div style="font-weight:800;font-size:.95rem">${Q.q}</div>
      <div class="opts">${Q.o.map((o,j)=>`<div class="opt" data-i="${j}">${o}</div>`).join('')}</div>
      <div class="feedback" id="mqfb"></div>
    </div>`;
    box.querySelectorAll('.opt').forEach(op=>{
      op.onclick = ()=>{
        if(answered) return;
        answered = true;
        const j = +op.dataset.i, ok = j===Q.a;
        box.querySelectorAll('.opt').forEach((x,k)=>{
          x.classList.add('disabled');
          if(k===Q.a) x.classList.add('correct'); else if(k===j) x.classList.add('incorrect');
        });
        const f = box.querySelector('#mqfb');
        f.className = 'feedback show ' + (ok?'good':'bad');
        f.innerHTML = (ok?'✅ ถูกต้อง! ':'❌ ยังไม่ใช่ ') + Q.e +
          `<div style="margin-top:12px"><button class="btn primary sm" id="mnx">ไปช่วงที่ 2 →</button></div>`;
        f.querySelector('#mnx').onclick = ()=> onDone(ok?0:1);
      };
    });
  }
  draw();
}

function stageProps(){
  let malWrong = 0, sortWrong = 0;
  drawMal();

  function drawMal(){
    app.innerHTML = stageShell('props', `
      <div class="note">🎯 <b>ช่วงที่ 1:</b> ทดลองตอกโลหะให้ระนาบเลื่อน แล้วเทียบกับตอนตอกผลึกเกลือในเกมพันธะไอออนิก</div>
      <div id="lab"></div>
    `);
    malleableLab('lab', wrong=>{
      malWrong = wrong; toast('เห็นภาพแล้ว! ไปช่วงที่ 2 กันต่อ'); setTimeout(drawSort, 800);
    });
  }

  function drawSort(){
    const B = { m:{t:'⚡ โลหะ<br><span class="small muted">ไอออนบวก + ทะเลอิเล็กตรอน</span>'},
                i:{t:'🧊 สารประกอบไอออนิก<br><span class="small muted">ไอออนบวก + ไอออนลบ</span>'} };
    app.innerHTML = stageShell('props', `
      <div class="note">🎯 <b>ช่วงที่ 2:</b> แตะข้อความ แล้วแตะกล่องที่ถูกต้อง — จัดให้ครบ ${PROP_ITEMS.length} ชิ้น</div>
      <div class="bar"><i id="pb" style="width:0%"></i></div>
      <div class="bank" id="pool">
        ${shuffle(PROP_ITEMS).map(it=>`<div class="tok" data-n="${it.n}">${it.n}</div>`).join('')}
      </div>
      <div class="buckets" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
        ${Object.entries(B).map(([k,v])=>`<div class="bucket" data-g="${k}">
          <h4>${v.t}</h4><div class="items" id="items-${k}"></div></div>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
      <div class="note" style="margin-top:16px">
        🔵 <b>คำถามที่ใช้ตัดสินได้เสมอ:</b> <b>ของแข็ง</b>นำไฟฟ้าไหม?
        ถ้านำตั้งแต่เป็นของแข็ง → <b>โลหะ</b> · ถ้าต้องหลอมหรือละลายก่อน → <b>ไอออนิก</b>
      </div>

      sortWrong = wrong; toast('เยี่ยม! ไปช่วงสุดท้ายกันต่อ'); setTimeout(drawQuiz, 800);
    });
  }

  function drawQuiz(){
    app.innerHTML = stageShell('props', `
      <div class="note">🎯 <b>ช่วงที่ 3:</b> ตอบคำถามเรื่องสมบัติของโลหะให้ครบ ${PROP_Q.length} ข้อ</div>
      <div class="bar"><i id="pb" style="width:0%"></i></div>
      <div id="qhost"></div>
    `);
    quizRun(PROP_Q, 'qhost', qWrong=>{
      const miss = malWrong + sortWrong + qWrong;
      const got = miss<=1?3:miss<=4?2:1;
      stageMiss = miss;
      finishStage('props', got, 80-Math.min(miss*7,45), `
        <div class="note key">🟡 <b>สรุปที่ต้องจำ — ทุกข้อมาจากอิเล็กตรอนอิสระ</b><br>
          • <b>นำไฟฟ้าได้ทุกสถานะ</b> เพราะตัวนำคืออิเล็กตรอน ไม่ใช่ไอออนที่ต้องรอหลอมเหลว<br>
          • <b>ตีแผ่และดึงเป็นเส้นได้</b> เพราะเลื่อนระนาบแล้วทะเลอิเล็กตรอนยังยึดไว้<br>
          • <b>นำความร้อนได้ดี</b> เพราะอิเล็กตรอนพาพลังงานวิ่งไปทั่วก้อนได้เร็ว<br>
          • <b>เป็นมันวาว</b> เพราะอิเล็กตรอนอิสระคายแสงกลับออกมาแทบทุกความยาวคลื่น</div>
        <div class="note miss">🔴 <b>ระวังเข้าใจผิด:</b> โลหะ<b>ตีแผ่ได้ไม่ได้แปลว่าพันธะอ่อน</b>
          — ทองแดงหลอมที่ 1,085 °C สูงกว่าเกลือแกงที่ 801 °C เสียอีก แต่เกลือกลับเปราะ</div>
        <div class="note">🔵 <b>ต่อยอด:</b> ถ้าอยากได้โลหะที่<b>แข็งขึ้น</b>โดยยังนำไฟฟ้าได้
          ต้องทำให้ระนาบเลื่อนยากขึ้น — วิธีที่ใช้จริงคือ<b>ผสมโลหะอื่นเข้าไป</b> ซึ่งเป็นเรื่องของด่านถัดไป</div>
        <div class="small muted">ตอบผิดทั้งหมด ${miss} ครั้ง</div>`);
    });
  }
}

/* =========================================================================
   ด่าน 5 — ห้องโลหะผสม
   ต่อจากด่านที่แล้วโดยตรง · โลหะบริสุทธิ์ตีแผ่ง่ายเพราะระนาบเลื่อนสะดวก
   ถ้าเอาอะตอมขนาดต่างกันไปแทรก ระนาบจะเลื่อนยากขึ้น โลหะจึงแข็งขึ้น
   ผู้เล่นจะได้ใส่อะตอมลงในผลึกเองแล้วเห็นว่าระนาบเลื่อนไม่ผ่าน
   ========================================================================= */
const ALLOY_SET = [
  { id:'brass', nm:'ทองเหลือง', en:'brass', host:'Cu', guest:'Zn', kind:'sub',
    use:'ลูกบิดประตู · เครื่องดนตรี · ข้อต่อประปา',
    why:'สังกะสีมีขนาด<b>ใกล้เคียง</b>ทองแดง จึงเข้าไป<b>แทนที่</b>ในตำแหน่งเดิมของผลึกได้เลย' },
  { id:'steel', nm:'เหล็กกล้า', en:'carbon steel', host:'Fe', guest:'C', kind:'int',
    use:'โครงสร้างอาคาร · เครื่องมือ · รางรถไฟ',
    why:'คาร์บอน<b>เล็กกว่ามาก</b> จึงเข้าไป<b>แทรกในช่องว่าง</b>ระหว่างอะตอมเหล็ก ไม่ได้แทนที่' },
  { id:'stain', nm:'สแตนเลส', en:'stainless steel', host:'Fe', guest:'Cr', kind:'sub',
    use:'ช้อนส้อม · อ่างล้างจาน · เครื่องมือแพทย์',
    why:'โครเมียมขนาดใกล้เคียงเหล็กจึงแทนที่ได้ · และยังสร้างฟิล์มออกไซด์บาง ๆ กันสนิมให้ด้วย' }
];

/* เล่นห้องโลหะผสมจนครบทุกชนิด แล้วเรียก onDone พร้อมจำนวนครั้งที่วางผิด */
function alloyLab(hostId, pbId, onDone){
  const host = document.getElementById(hostId), pb = document.getElementById(pbId);
  const COLS = 6, ROWS = 4, GAP = 54, R = 19;
  const VB_W = COLS*GAP + 60, VB_H = ROWS*GAP + 66;
  let idx = 0, wrong = 0;

  function start(){
    const A = ALLOY_SET[idx], H = MET[A.host], G = MET[A.guest];
    const NEED = 4;                              // จำนวนอะตอมที่ต้องใส่
    const put = {};                              // ตำแหน่งที่ผู้เล่นใส่แล้ว
    let armed = false, done = false, shift = 0;
    // ตำแหน่งที่ยอมให้ใส่ · แทนที่ = ตรงตำแหน่งอะตอมเดิม · แทรก = ตรงช่องว่างระหว่างอะตอม
    const slots = A.kind === 'sub'
      ? [[1,1],[3,1],[2,2],[4,2]].map(([c,r])=>({ c, r, x:40+c*GAP, y:34+r*GAP }))
      : [[1,1],[3,1],[2,2],[4,2]].map(([c,r])=>({ c, r, x:40+c*GAP+GAP/2, y:34+r*GAP+GAP/2 }));

    host.innerHTML = `<div class="lab">
      <div class="labtop">
        <div><span class="fml">${A.nm}</span> <span class="nm">${A.en} · ${H.nm} + ${G.nm}</span></div>
        <div class="cnt" id="acnt"></div>
      </div>
      <div class="molwrap" style="max-width:520px">
        <svg class="tsvg" id="al" viewBox="0 0 ${VB_W} ${VB_H}"
             aria-label="ผลึกโลหะผสม ${A.nm}"></svg>
      </div>
      <div class="palette" id="apal">
        <button class="bchip" data-t="g"><span class="ionchip guest">${A.guest}</span> อะตอม${G.nm}</button>
        <span class="small muted" style="align-self:center">เลือกอะตอมแล้วแตะช่องที่กะพริบในผลึก</span>
      </div>
      <div class="feedback" id="afb"></div>
    </div>`;
    const svg = document.getElementById('al'), fb = document.getElementById('afb');
    document.querySelector('#apal .bchip').onclick = function(){
      if(done) return;
      armed = !armed; this.classList.toggle('sel', armed); draw();
    };

    function draw(){
      let g = `<defs>
        <radialGradient id="ah" cx="34%" cy="30%" r="72%"><stop offset="0%" stop-color="#fff" stop-opacity=".82"/>
          <stop offset="42%" stop-color="${H.c}"/><stop offset="100%" stop-color="${H.d}"/></radialGradient>
        <radialGradient id="ag" cx="34%" cy="30%" r="72%"><stop offset="0%" stop-color="#fff" stop-opacity=".82"/>
          <stop offset="42%" stop-color="${G.c}"/><stop offset="100%" stop-color="${G.d}"/></radialGradient></defs>`;
      for(let k=0;k<22;k++){
        const x = 26 + (k*89)%(VB_W-52), y = 26 + (k*57)%(VB_H-52);
        g += `<circle class="efree sm" cx="${x}" cy="${y}" r="4"/>`;
      }
      // อะตอมของโลหะหลัก · แถวบนครึ่งเลื่อนได้เมื่อกดทดสอบ
      for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
        const sub = A.kind === 'sub' && put[c+','+r];
        const dx = (r < ROWS/2) ? shift*GAP : 0;
        const x = 40 + c*GAP + dx, y = 34 + r*GAP;
        if(x < 14 || x > VB_W-14) continue;
        g += `<circle class="ionb" cx="${x.toFixed(1)}" cy="${y}" r="${R}"
                fill="url(#${sub?'ag':'ah'})" stroke="${sub?G.d:H.d}" stroke-width="1.8"/>
              <text class="alt" x="${x.toFixed(1)}" y="${y}">${sub?A.guest:A.host}</text>`;
      }
      // อะตอมที่แทรกในช่องว่าง (เฉพาะโลหะผสมแบบแทรก)
      if(A.kind === 'int') slots.forEach(s=>{
        if(!put[s.c+','+s.r]) return;
        g += `<circle class="ionb" cx="${s.x}" cy="${s.y}" r="${R*0.42}" fill="url(#ag)"
                stroke="${G.d}" stroke-width="1.4"/>
              <text class="alt sm" x="${s.x}" y="${s.y}">${A.guest}</text>`;
      });
      // ช่องที่ยังว่าง
      if(!done) slots.forEach(s=>{
        if(put[s.c+','+s.r]) return;
        g += `<circle class="aslot${armed?' on':''}" data-s="${s.c},${s.r}"
                cx="${s.x}" cy="${s.y}" r="${A.kind==='sub'?R+3:R*0.55}"/>`;
      });
      // จุดที่อะตอมต่างขนาดชนกันจนระนาบเลื่อนต่อไม่ได้ · วาดเป็นกากบาทแดง
      if(shift){
        const blocks = [];
        if(A.kind === 'sub'){
          const guests = slots.filter(s2=>put[s2.c+','+s2.r]);
          guests.filter(s2=>s2.r < ROWS/2).forEach(mv=>{
            const mx = mv.x + shift*GAP;
            guests.filter(s2=>s2.r >= ROWS/2).forEach(st=>{
              if(Math.abs(st.y - mv.y) <= GAP*1.1 && Math.abs(st.x - mx) <= GAP*0.9)
                blocks.push({ x:(mx+st.x)/2, y:(mv.y+st.y)/2 });
            });
          });
        }else{
          // อะตอมแทรกอยู่กับที่ ระนาบที่เลื่อนจึงชนมันตรง ๆ ทุกตัว
          slots.filter(s2=>put[s2.c+','+s2.r]).forEach(s2=>blocks.push({ x:s2.x+shift*GAP/2, y:s2.y }));
        }
        blocks.forEach(bk=>{
          g += `<g class="block"><line x1="${(bk.x-9).toFixed(1)}" y1="${(bk.y-9).toFixed(1)}"
                  x2="${(bk.x+9).toFixed(1)}" y2="${(bk.y+9).toFixed(1)}"/>
                <line x1="${(bk.x+9).toFixed(1)}" y1="${(bk.y-9).toFixed(1)}"
                  x2="${(bk.x-9).toFixed(1)}" y2="${(bk.y+9).toFixed(1)}"/></g>`;
        });
      }
      g += `<text class="britcap" x="${VB_W/2}" y="${VB_H-12}">${done
        ? (shift ? 'ระนาบเลื่อนไม่สะดวก — อะตอมต่างขนาดขวางไว้ โลหะจึงแข็งขึ้น'
                 : 'กดปุ่มทดสอบว่าระนาบยังเลื่อนง่ายเหมือนเดิมไหม')
        : (A.kind==='sub' ? 'แทนที่อะตอมเดิมในตำแหน่งของผลึก' : 'แทรกลงในช่องว่างระหว่างอะตอม')}</text>`;
      svg.innerHTML = g;
      document.getElementById('acnt').textContent =
        `ใส่แล้ว ${Object.keys(put).length}/${NEED} อะตอม · โลหะผสมที่ ${idx+1}/${ALLOY_SET.length}`;

      svg.querySelectorAll('.aslot').forEach(el=>{
        el.onclick = ()=>{
          if(done) return;
          if(!armed){
            fb.className='feedback show bad';
            fb.innerHTML=`❌ ยังไม่ได้เลือกอะตอม — แตะปุ่ม<b>อะตอม${G.nm}</b>ด้านล่างก่อน`;
            return;
          }
          put[el.dataset.s] = true;
          fb.className='feedback show good';
          fb.innerHTML = `✅ ใส่อะตอม${G.nm}ลงผลึกแล้ว — ${A.why}`;
          draw();
          if(Object.keys(put).length >= NEED) finish();
        };
      });
    }

    function finish(){
      done = true;
      if(pb) pb.style.width = ((idx+1)/ALLOY_SET.length*100)+'%';
      fb.className='feedback show good';
      fb.innerHTML = `🎉 <b>ได้${A.nm}แล้ว!</b> ${A.why}
        <div class="ioneq">
          <div>ชนิด: <b>${A.kind==='sub' ? 'โลหะผสมแบบแทนที่ (substitutional)' : 'โลหะผสมแบบแทรก (interstitial)'}</b></div>
          <div>ใช้ทำ: ${A.use}</div>
        </div>
        <div style="margin-top:12px">
          <button class="btn gold sm" id="test">🔨 ทดสอบตอกดู</button>
          <button class="btn primary sm" id="nx">
            ${idx===ALLOY_SET.length-1?'ไปช่วงที่ 2 →':'โลหะผสมถัดไป →'}</button></div>`;
      fb.querySelector('#test').onclick = ()=>{
        shift = shift ? 0 : 0.34; draw();
        if(shift) toast('อะตอมต่างขนาดขวางไม่ให้ระนาบเลื่อน โลหะผสมจึงแข็งกว่าโลหะบริสุทธิ์');
      };
      fb.querySelector('#nx').onclick = ()=>{
        idx++;
        if(idx < ALLOY_SET.length){ start(); window.scrollTo({top:0,behavior:'smooth'}); }
        else onDone(wrong);
      };
      draw();
    }
    draw();
  }
  start();
}

    d:'เข้าไป<b>แทนที่</b>อะตอมเดิมในตำแหน่งของผลึก · ทองเหลือง (Cu + Zn) และสแตนเลส (Fe + Cr) เป็นแบบนี้' },
  { k:'int', n:'โลหะผสมแบบแทรก', em:'📥', h:'อะตอมที่เติมเล็กกว่าโลหะหลักมาก',
    d:'เข้าไป<b>แทรกในช่องว่าง</b>ระหว่างอะตอม ไม่ได้แทนที่ · เหล็กกล้า (Fe + C) เป็นตัวอย่างที่ชัดที่สุด' },

    app.innerHTML = stageShell('alloy', `

        อะตอมที่เติม<b>ขนาดใกล้เคียง</b>โลหะหลัก → เข้าไป<b>แทนที่</b>ในตำแหน่งของผลึก (substitutional)<br>
        อะตอมที่เติม<b>เล็กกว่ามาก</b> → เข้าไป<b>แทรกในช่องว่าง</b>ระหว่างอะตอม (interstitial)
      </div>
    `);
    alloyLab('lab', 'pb', wrong=>{
      labWrong = wrong; toast('ผสมครบแล้ว! ไปช่วงที่ 2 กันต่อ'); setTimeout(drawMatch, 900);
    });
  }

  function drawMatch(){
    app.innerHTML = stageShell('alloy', `
      <div class="note">🎯 <b>ช่วงที่ 2:</b> จับคู่โลหะผสมและคำศัพท์กับความหมาย — ให้ครบ ${ALLOY_PAIRS.length} คู่</div>

      ${matchBoard(ALLOY_PAIRS, 'desc')}
      <div class="feedback" id="fb"></div>
    `);
    bindMatch(ALLOY_PAIRS, wrong=>{
      matchWrong = wrong; toast('เยี่ยม! ไปช่วงสุดท้ายกันต่อ'); setTimeout(drawQuiz, 900);
    });
  }

  function drawQuiz(){
    app.innerHTML = stageShell('alloy', `
      <div class="note">🎯 <b>ช่วงที่ 3:</b> ตอบคำถามเรื่องโลหะผสมให้ครบ ${ALLOY_Q.length} ข้อ</div>
      <div class="bar"><i id="pb" style="width:0%"></i></div>
      <div id="qhost"></div>
    `);
    quizRun(ALLOY_Q, 'qhost', qWrong=>{
      const miss = labWrong + matchWrong + qWrong;
      const got = miss<=2?3:miss<=5?2:1;
      stageMiss = miss;
      finishStage('alloy', got, 80-Math.min(miss*6,45), `
        <div class="note key">🟡 <b>สรุปที่ต้องจำ</b><br>
          • <b>โลหะผสม</b> คือโลหะที่เติมธาตุอื่นเข้าไปเพื่อปรับสมบัติให้ดีขึ้น<br>
          • อะตอม<b>ขนาดใกล้เคียง</b> → แบบ<b>แทนที่</b> (ทองเหลือง · สแตนเลส)<br>
          • อะตอม<b>เล็กกว่ามาก</b> → แบบ<b>แทรก</b> (เหล็กกล้า)<br>
          • แข็งขึ้นเพราะอะตอมต่างขนาดทำให้<b>ระนาบเลื่อนยากขึ้น</b> — และยัง<b>นำไฟฟ้าได้</b>อยู่</div>
        <div class="note miss">🔴 <b>ระวังเข้าใจผิด:</b> โลหะผสม<b>ยังเป็นพันธะโลหะ</b>
          ไม่ได้กลายเป็นสารประกอบ ไม่มีสูตรเคมีตายตัว และสัดส่วนปรับได้ตามการใช้งาน</div>
        <div class="note">🔵 <b>ต่อยอด:</b> สแตนเลสกันสนิมด้วย<b>ฟิล์มออกไซด์ของโครเมียม</b>ที่บางมาก
          — เป็นการผสมเข้าเนื้อ ต่างจากการชุบสังกะสีหรือทาสีที่เป็นการเคลือบทับผิว</div>
        <div class="small muted">ตอบผิดทั้งหมด ${miss} ครั้ง</div>`);
    });
  }
}

        <div class="note">🔵 <b>เชื่อมโยง:</b> ทั้งสามชนิดล้วนเป็นเรื่องเดียวกัน คือ<b>เวเลนซ์อิเล็กตรอนจะไปอยู่ที่ใด</b>
          — ให้ไปเลย (ไอออนิก) · แบ่งกันเป็นคู่ (โคเวเลนต์) · หรือปล่อยให้ใช้ร่วมกันทั้งก้อน (โลหะ)</div>
        <div class="small muted">ตอบถูก ${right}/${SC.length} ข้อ</div>`);
      return;
    }
    const s=SET[i];
    host.innerHTML = `<div class="scene">
      <div class="small muted">สถานการณ์ ${i+1}/${SC.length}</div>
      <h3 style="margin:6px 0 4px">${s.icon} ${s.title}</h3>
      <p style="margin:0 0 6px;font-size:.92rem">${s.body}</p>
      <div style="font-weight:800;font-size:.95rem;margin-top:10px">${s.q}</div>
      <div class="opts">${s.o.map((o,j)=>`<div class="opt" data-i="${j}">${o}</div>`).join('')}</div>
      <div class="feedback" id="qfb"></div>
    </div>`;
    host.querySelectorAll('.opt').forEach(op=>{
      op.onclick=()=>{
        const j=+op.dataset.i, ok=j===s.a; if(ok) right++;
        host.querySelectorAll('.opt').forEach((x,k)=>{
          x.classList.add('disabled');
          if(k===s.a) x.classList.add('correct'); else if(k===j) x.classList.add('incorrect');
        });
        const f=host.querySelector('#qfb'); f.className='feedback show '+(ok?'good':'bad');
        f.innerHTML=(ok?'✅ ถูกต้อง! ':'❌ ยังไม่ใช่ ')+s.e+
          `<div style="margin-top:12px"><button class="btn primary sm" id="nx">${i===SC.length-1?'สรุปผล →':'สถานการณ์ถัดไป →'}</button></div>`;
        f.querySelector('#nx').onclick=()=>{ i++; step(); window.scrollTo({top:0,behavior:'smooth'}); };
      };
    });
  }
  step();
}
