<style>
:root{
  /* ── พาเลตเดียวกับเกมสังเคราะห์แสง: F2EDD5 · E7390D · F26716 · 084A24 · 04261E ── */
  --cream:#F2EDD5; --cream-hi:#FBF8EC; --cream-lo:#E9E1BE;
  --ink:#04261E; --deep:#084A24;
  --bg0:#FBF8EC; --bg1:#F2EDD5; --bg2:#EAE4C6;
  --panel:rgba(255,255,255,.58);
  --panel2:rgba(255,255,255,.85);
  --line:rgba(8,74,36,.18);
  --green:#4E9370; --lime:#2F7D4F; --teal:#7CB894;
  --gold:#F26716; --rose:#E7390D;
  --violet:#5C90A6; --sky:#5C90A6;
  --green-soft:#AFD2BC; --green-pale:#DCEBE1;
  --orange-soft:#F7C39C; --orange-pale:#FBE4D2;
  --red-soft:#F4B7A6; --blue-soft:#BCD6E0;
  --text:#04261E; --muted:#6B8A76;
  --ok:#2F7D4F; --bad:#D6350B;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100dvh; color:var(--text);
  font-family:"Sukhumvit Set","Noto Sans Thai","IBM Plex Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
  background:
    radial-gradient(1100px 700px at 12% -8%, rgba(175,210,188,.55), transparent 62%),
    radial-gradient(900px 600px at 92% 0%, rgba(247,195,156,.42), transparent 60%),
    radial-gradient(800px 600px at 50% 112%, rgba(188,214,224,.38), transparent 62%),
    linear-gradient(rgba(251,248,236,.72),rgba(242,237,213,.80)),
    url("imag/bg.webp") center top/cover no-repeat fixed,
    linear-gradient(170deg,var(--bg0),var(--bg1) 45%,var(--bg2));
  background-attachment:fixed;
  line-height:1.65; letter-spacing:.01em;
}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 90px}

.hud{
  position:sticky;top:0;z-index:60;margin:-16px -16px 18px;padding:12px 16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:linear-gradient(180deg,rgba(251,248,236,.96),rgba(242,237,213,.80));
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.02rem;letter-spacing:.02em;color:var(--deep)}
.brand .leaf{font-size:1.35rem;filter:drop-shadow(0 1px 3px rgba(8,74,36,.3))}
.hud .spacer{flex:1}
@media(max-width:520px){
  .hud{gap:7px;padding:9px 12px;flex-wrap:nowrap}
  .brand{font-size:.86rem;min-width:0}
  .brand span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brand .leaf{font-size:1.1rem}
  .chip{padding:4px 8px;font-size:.72rem}
  .hud .btn.sm{padding:5px 9px;font-size:.75rem}
}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);font-size:.82rem;font-weight:700;white-space:nowrap;
}
.chip b{color:var(--gold)}
.chip.xp b{color:var(--lime)}

button{font-family:inherit}
.btn{
  appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);
  padding:11px 20px;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer;
  transition:.16s transform,.16s background,.16s border-color;
}
.btn:hover{background:var(--panel2);border-color:rgba(8,74,36,.35)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#4E9370,#2F7D4F);color:#FBF8EC;border-color:transparent;box-shadow:0 8px 20px -10px rgba(8,74,36,.65)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--rose));color:#FFF7F0;border-color:transparent;box-shadow:0 8px 20px -10px rgba(231,57,13,.5)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:7px 14px;font-size:.85rem}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;
  box-shadow:0 2px 12px rgba(8,74,36,.06)}
h1,h2,h3{line-height:1.35;margin:0 0 .5em}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.center{text-align:center}
.hidden{display:none !important}

.pub{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:6px}
.pub img{height:38px;width:auto;filter:drop-shadow(0 1px 2px rgba(8,74,36,.18))}
.pub span{font-weight:800;font-size:1.05rem;color:var(--deep);letter-spacing:.02em}
.pub span b{color:var(--gold)}
/* ---- ระบบชั้นเรียน ---- */
.classchip{display:inline-flex;align-items:center;gap:8px;margin:12px auto 0;padding:8px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:.85rem;font-weight:700;color:var(--deep);cursor:pointer;transition:.15s}
.classchip:hover{background:var(--panel2);border-color:rgba(8,74,36,.35)}
.classchip.joined{background:rgba(175,210,188,.55);border-color:var(--green);cursor:default}
.classchip .x{color:var(--rose);font-weight:800;margin-left:2px;cursor:pointer;padding:0 4px}
.modalbg{position:fixed;inset:0;background:rgba(4,38,30,.5);backdrop-filter:blur(3px);z-index:300;display:grid;place-items:center;padding:16px}
.modal{background:var(--cream-hi);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:380px;width:100%;box-shadow:0 22px 60px -20px rgba(0,0,0,.5)}
.modal h3{margin:0 0 4px;color:var(--deep);font-size:1.15rem}
.modal .msub{margin:0 0 14px;color:var(--muted);font-size:.85rem}
.modal label{display:block;font-size:.82rem;font-weight:700;color:var(--deep);margin:10px 0 4px}
.modal input{width:100%;font-family:inherit;font-size:.95rem;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}
.modal input:focus{outline:none;border-color:var(--green)}
.modal input#jcode{text-transform:uppercase;letter-spacing:3px;font-weight:800}
.modal .mrow{display:flex;gap:8px;margin-top:16px}
.modal .mrow .btn{flex:1}
.modal .mmsg{font-size:.85rem;margin-top:10px;min-height:1em;color:var(--muted)}
.modal .mmsg.err{color:var(--bad)}
/* ---- เกียรติบัตร ---- */
.certwrap{max-width:820px;margin:10px auto 0}
.certwrap canvas{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--line);
  box-shadow:0 18px 40px -22px rgba(8,74,36,.55);background:#fff}
.certform{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin:14px 0}
.certform input{flex:1;min-width:220px;max-width:420px;font-family:inherit;font-size:1rem;font-weight:700;
  padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.certform input:focus{outline:none;border-color:var(--green)}
.certbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.lockcard{opacity:.75}
.certprog{height:9px;border-radius:99px;background:rgba(8,74,36,.10);overflow:hidden;margin-top:8px}
.certprog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--rose));transition:width .5s}
.hero{text-align:center;padding:14px 12px 8px}
.hero h1{font-size:clamp(1.7rem,5.2vw,2.6rem);margin-bottom:.25em;
  background:linear-gradient(100deg,var(--deep),#2F7D4F 42%,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#4A6A58;margin:0;font-size:.98rem}
.eq{display:inline-block;margin-top:14px;padding:9px 18px;border-radius:999px;
  background:rgba(175,210,188,.45);border:1px solid rgba(8,74,36,.25);color:var(--deep);
  font-size:.9rem;font-weight:700;letter-spacing:.03em}
.eq sub{font-size:.72em}

.maplist{display:grid;gap:12px;margin-top:22px}
@media(min-width:720px){.maplist{grid-template-columns:1fr 1fr}}
.node{
  display:flex;gap:14px;align-items:center;
  padding:16px;border-radius:var(--r);cursor:pointer;position:relative;overflow:hidden;
  background:var(--panel);border:1px solid var(--line);
  transition:.18s transform,.18s border-color,.18s background;
}
.node:hover{transform:translateY(-3px);border-color:rgba(8,74,36,.38);background:var(--panel2)}
.node.locked{opacity:.5;cursor:not-allowed;filter:grayscale(.55)}
.node.locked:hover{transform:none;border-color:var(--line);background:var(--panel)}
.node .ic{
  width:56px;height:56px;flex:0 0 56px;border-radius:15px;display:grid;place-items:center;font-size:1.7rem;
  background:rgba(255,255,255,.75);border:1px solid var(--line);
}
.stage-ic-img{width:100%;height:100%;object-fit:contain;padding:3px;display:block}
.stagehead .ic .stage-ic-img{width:46px;height:46px;padding:0}
.node .body{flex:1;text-align:left}
.node .body .t{font-weight:800;font-size:1.02rem}
.node .body .d{font-size:.84rem;color:var(--muted);line-height:1.5}
.node .stars{font-size:.9rem;letter-spacing:2px;color:var(--gold);margin-top:3px}
.node .stars .off{color:rgba(8,74,36,.16)}
.node.done{border-color:rgba(8,74,36,.4)}
.node.done .ic{background:rgba(175,210,188,.65)}
.node .no{position:absolute;top:8px;right:12px;font-size:.7rem;font-weight:800;color:var(--muted);letter-spacing:.1em}

.stagehead{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stagehead .ic{font-size:2rem}
.stagehead h2{margin:0}
.stagehead .sub{color:var(--muted);font-size:.88rem}
.bar{height:7px;border-radius:99px;background:rgba(8,74,36,.10);overflow:hidden;margin:10px 0 18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--lime));transition:width .4s cubic-bezier(.4,0,.2,1)}

.note{
  border-radius:12px;padding:12px 14px;font-size:.88rem;margin:12px 0;
  border-left:4px solid var(--sky);background:rgba(92,144,166,.13);
}
.note.warn{border-left-color:var(--gold);background:rgba(242,103,22,.11)}
.note.key{border-left-color:var(--lime);background:rgba(47,125,79,.11)}
.note.miss{border-left-color:var(--rose);background:rgba(231,57,13,.09)}
.note b{color:var(--deep)}

.feedback{border-radius:12px;padding:12px 14px;margin-top:14px;font-size:.9rem;display:none}
.feedback.show{display:block;animation:pop .3s}
.feedback.good{background:rgba(47,125,79,.14);border:1px solid rgba(47,125,79,.4)}
.feedback.bad{background:rgba(231,57,13,.11);border:1px solid rgba(231,57,13,.35)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* labeling */
.diagram{position:relative;width:100%;aspect-ratio:900/560;margin:6px 0 4px}
.diagram svg{width:100%;height:100%;display:block}
@supports (container-type:inline-size){
  .diagram{container-type:inline-size}
  .slot{min-width:11.5cqw;font-size:clamp(7px,2.5cqw,.76rem);padding:.7cqw 1.2cqw;border-radius:min(10px,1.4cqw)}
}
.slot{
  position:absolute;transform:translate(-50%,-50%);
  min-width:104px;padding:6px 10px;border-radius:10px;text-align:center;
  font-size:.76rem;font-weight:700;cursor:pointer;
  background:rgba(255,255,255,.9);border:2px dashed rgba(8,74,36,.38);color:var(--muted);
  transition:.15s;white-space:nowrap;box-shadow:0 1px 4px rgba(8,74,36,.08);
}
.slot:hover{border-color:var(--lime);color:var(--deep)}
.slot.armed{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,103,22,.22)}
.slot.filled{border-style:solid;border-color:var(--green);background:rgba(175,210,188,.85);color:var(--deep)}
.slot.wrong{border-color:var(--bad);background:rgba(231,57,13,.16);animation:shake .35s}
@keyframes shake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 6px),-50%)}75%{transform:translate(calc(-50% + 6px),-50%)}}
/* กระดานติดป้ายรอบภาพจริง (ด่าน 1)
   จอกว้าง = ป้าย ??? วางรอบภาพ มีเส้นประชี้ไปยังจุดสีส้มบนภาพ
   จอแคบ (มือถือ) = จุดบนภาพกลายเป็นหมายเลข แล้วป้ายเรียงเป็นรายการใต้ภาพแทน ไม่เบียดกัน
   พิกัดทุกจุดคิดเป็นสัดส่วน จึงเปลี่ยนไฟล์ภาพได้โดยไม่ต้องแก้โครง */
.mboard{position:relative;max-width:1000px;margin:10px auto 0;padding:20% 12.5% 12.5% 14.5%}
.mimg{position:relative}
.mimg img{width:100%;display:block;border-radius:14px;box-shadow:0 5px 18px -8px rgba(8,74,36,.3)}
.leads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cwrap{position:absolute;inset:0;pointer-events:none}
.anchor{position:absolute;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;
  background:var(--gold);border:2px solid #fff;box-shadow:0 1px 5px rgba(8,74,36,.45);
  display:grid;place-items:center;color:#FFF7F0;font-weight:800;font-size:0}
.anchor.done{background:var(--lime)}
.slot.callout{pointer-events:auto;min-width:92px;padding:5px 9px;font-size:.74rem}
.slot.callout i{display:none}
@media (max-width:640px){
  .mboard{padding:0}
  .leads{display:none}
  .cwrap{position:static;display:grid;gap:8px;margin-top:14px;pointer-events:auto;
    grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
  .slot.callout{position:static;transform:none;display:flex;align-items:center;gap:9px;width:100%;
    min-width:0;left:auto!important;top:auto!important;text-align:left;white-space:normal;padding:9px 12px;font-size:.8rem}
  .slot.callout i{flex:0 0 auto;display:grid;place-items:center;width:25px;height:25px;border-radius:50%;
    background:var(--gold);color:#FFF7F0;font-style:normal;font-weight:800;font-size:.78rem}
  .slot.callout.filled i{background:var(--lime)}
  .anchor{width:clamp(21px,5vw,27px);height:clamp(21px,5vw,27px);font-size:clamp(.62rem,2.3vw,.8rem)}
}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tok{
  padding:8px 14px;border-radius:999px;font-size:.85rem;font-weight:700;cursor:pointer;
  background:var(--panel2);border:1px solid var(--line);transition:.15s;
}
.tok:hover{border-color:var(--lime)}
.tok.sel{background:linear-gradient(135deg,var(--gold),var(--rose));color:#FFF7F0;border-color:transparent;transform:translateY(-2px);
  box-shadow:0 5px 14px -6px rgba(231,57,13,.6)}
.tok.used{display:none}

/* chain */
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:56px;
  padding:14px;border-radius:14px;background:rgba(255,255,255,.66);border:1px solid var(--line)}
.chain .ph{color:var(--muted);font-size:.85rem}
.link{padding:8px 13px;border-radius:11px;font-size:.82rem;font-weight:700;color:var(--deep);
  background:rgba(175,210,188,.8);border:1px solid rgba(8,74,36,.32);animation:pop .25s}
.arrow{color:var(--muted);font-size:.9rem}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pool .tok{font-size:.82rem}
.pool .tok.bad{animation:shake .35s;background:rgba(231,57,13,.16);border-color:var(--bad)}

/* wheel / phases */
.calvin{display:grid;gap:16px}
@media(min-width:800px){.calvin{grid-template-columns:1fr 1.1fr}}
.wheel{position:relative;aspect-ratio:1;max-width:340px;margin:0 auto;width:100%}
.wheel svg{width:100%;height:100%}
.phase{padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.66);margin-bottom:12px;transition:.2s}
.phase.active{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,103,22,.16)}
.phase.solved{border-color:rgba(8,74,36,.42);background:rgba(175,210,188,.4)}
.phase h4{margin:0 0 4px;font-size:.98rem}
.phase .hintline{font-size:.8rem;color:var(--muted);margin-bottom:10px}
.step{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:7px 0;flex-wrap:wrap}
.step .nm{font-size:.88rem;font-weight:700}
.stepper{display:flex;align-items:center;gap:4px;background:rgba(8,74,36,.07);border-radius:10px;padding:3px}
.stepper button{width:30px;height:30px;border-radius:8px;border:none;background:rgba(255,255,255,.9);
  color:var(--deep);font-size:1.05rem;font-weight:800;cursor:pointer;line-height:1}
.stepper button:active{background:var(--green);color:#FBF8EC}
.stepper .n{min-width:34px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}

/* ledger (sim) */
.sim{display:grid;gap:16px}
@media(min-width:820px){.sim{grid-template-columns:1fr 1.05fr}}
.specbox{background:rgba(255,255,255,.66);border:1px solid var(--line);border-radius:14px;padding:14px;
  box-shadow:0 2px 12px rgba(8,74,36,.06)}
.toggle{display:flex;gap:8px;margin:6px 0 14px}
.toggle button{flex:1;padding:9px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);font-weight:700;font-size:.82rem;cursor:pointer}
.toggle button.on{background:rgba(175,210,188,.8);border-color:var(--green);color:var(--deep)}
.tlabel{font-size:.82rem;font-weight:700;color:var(--deep);margin-bottom:2px}
.ledtable{width:100%;border-collapse:collapse;font-size:.86rem}
.ledtable th,.ledtable td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right}
.ledtable th:first-child,.ledtable td:first-child{text-align:left}
.ledtable th{color:var(--deep);font-size:.82rem}
.ledtable tfoot td{font-weight:800;border-top:2px solid var(--line);border-bottom:none;font-size:1rem;color:var(--deep)}
.ledtable .zero{color:var(--muted);opacity:.6}
.totbox{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;margin-top:12px}
.totbox .k{font-size:.78rem;color:var(--muted)}
.totbox .v{font-size:2.4rem;font-weight:800;color:var(--lime);font-variant-numeric:tabular-nums;line-height:1.1}
.mito-vis{background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.mito-vis svg{width:100%;height:auto;display:block}

/* scenarios */
.scene{background:rgba(255,255,255,.68);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;
  box-shadow:0 2px 12px rgba(8,74,36,.06)}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{
  text-align:left;padding:12px 14px;border-radius:12px;cursor:pointer;font-size:.9rem;
  background:var(--panel);border:1px solid var(--line);transition:.15s;
}
.opt:hover{background:var(--panel2);border-color:rgba(8,74,36,.38)}
.opt.correct{background:rgba(47,125,79,.18);border-color:var(--ok)}
.opt.incorrect{background:rgba(231,57,13,.13);border-color:var(--bad)}
.opt.disabled{pointer-events:none;opacity:.75}

/* flashcards */
.deckbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.deckbar button{padding:7px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);font-size:.83rem;font-weight:700;cursor:pointer}
.deckbar button.on{background:linear-gradient(135deg,var(--gold),var(--rose));color:#FFF7F0;border-color:transparent}
.fcstage{perspective:1400px;margin:0 auto;max-width:560px}
.fc{position:relative;width:100%;min-height:290px;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1)}
.fc.flip{transform:rotateY(180deg)}
.fc .side{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:20px;padding:26px;display:flex;flex-direction:column;justify-content:center;
  border:1px solid var(--line);box-shadow:0 6px 22px -10px rgba(8,74,36,.35);
}
.fc .front{background:linear-gradient(150deg,rgba(175,210,188,.72),rgba(220,235,225,.55)),#fff;align-items:center;text-align:center}
.fc .back{background:linear-gradient(150deg,rgba(247,195,156,.6),rgba(251,228,210,.45)),#fff;transform:rotateY(180deg)}
.fc .tag{font-size:.7rem;letter-spacing:.14em;color:#5F7D6B;text-transform:uppercase;margin-bottom:10px}
.fc .term{font-size:1.5rem;font-weight:800;margin-bottom:6px;line-height:1.3;color:var(--deep)}
.fc .en{font-size:.9rem;color:var(--muted);font-style:italic}
.fc .def{font-size:.98rem;line-height:1.7}
.fc .hint{margin-top:auto;padding-top:14px;font-size:.75rem;color:var(--muted);text-align:center}
.fcnav{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:18px}
.fcnav .count{font-weight:800;font-variant-numeric:tabular-nums;min-width:76px;text-align:center}

.result{text-align:center;padding:26px 16px}
.result .big{font-size:3rem;letter-spacing:6px;color:var(--gold)}
.result .big .off{color:rgba(8,74,36,.16)}
.result h2{margin-top:10px}

.footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
  color:var(--muted);font-size:.78rem;text-align:center;line-height:1.8}
.footer .fb{display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:9px}
.footer .fb img{height:26px;width:auto;opacity:.92}
.footer .fb span{font-weight:800;color:var(--deep);font-size:.92rem}
.footer .fb span b{color:var(--gold)}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140%);
  background:linear-gradient(135deg,#2F7D4F,#4E9370);color:#FBF8EC;
  padding:11px 22px;border-radius:999px;font-weight:800;font-size:.9rem;z-index:200;
  box-shadow:0 12px 30px -10px rgba(8,74,36,.6);transition:transform .35s cubic-bezier(.4,0,.2,1);
}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>

<body>
<div class="wrap">

  <div class="hud">
    <div class="brand"><span class="leaf">🔋</span><span>โรงไฟฟ้าไมโทคอนเดรีย</span></div>
    <div class="spacer"></div>
    <div class="chip xp">⚡ XP <b id="hudXp">0</b></div>
    <div class="chip">⭐ <b id="hudStars">0</b>/18</div>
    <button class="btn sm ghost" id="btnHome">🗺️ แผนที่</button>
  </div>

  <div id="app"></div>

  <div class="footer">
    <div class="fb"><img src="logo.png" alt="โลโก้ Biology" onerror="this.remove()"><span>Biology<b>.</b></span></div>
    เกมประกอบตำราชีววิทยา ม.4 เทอม 1 · หน่วยการเรียนรู้ <b>การหายใจระดับเซลล์</b><br>
    อิงหลักสูตร สสวท. (ฉบับปรับปรุง พ.ศ. 2560) · ความก้าวหน้าถูกบันทึกไว้ในเครื่องของผู้เล่นเอง
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================================
   โรงไฟฟ้าไมโทคอนเดรีย — เกมประกอบการเรียนรู้ เรื่องการหายใจระดับเซลล์ (ม.4)
   ไฟล์เดียว ทำงานออฟไลน์ · เข้าชุดกับเกม "ภารกิจคลอโรพลาสต์"
   ========================================================================= */

const app   = document.getElementById('app');
const toastEl = document.getElementById('toast');
const SAVE_KEY = 'cellular-respiration-quest-v1';

const defaultState = { xp:0, stars:{}, bonus:0 };
let S = load();

function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return structuredClone(defaultState);
    return Object.assign(structuredClone(defaultState), JSON.parse(raw));
  }catch(e){ return structuredClone(defaultState); }
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function totalStars(){ return Object.values(S.stars).reduce((a,b)=>a+b,0); }
function syncHud(){
  document.getElementById('hudXp').textContent = S.xp;
  document.getElementById('hudStars').textContent = totalStars();
}
let toastTimer;
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 2200);
}
function shuffle(a){
  const r=a.slice();
  for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}
function stars(n,max=3){ let s=''; for(let i=0;i<max;i++) s+= i<n?'★':'<span class="off">★</span>'; return s; }

/* ไอคอนด่าน: ถ้ายังไม่ได้ใส่ไฟล์ภาพในโฟลเดอร์ imag/ จะแสดงอิโมจิแทนอัตโนมัติ */
function stageIcon(file, alt, emoji){
  return `<img class="stage-ic-img" src="imag/${file}" alt="${alt}" onerror="this.outerHTML='${emoji}'">`;
}

const STAGES = [
  { id:'mito',  ic:stageIcon('stage-mito.webp','ไมโทคอนเดรีย','🫁'), title:'ประตูสู่ไมโทคอนเดรีย', desc:'สำรวจโครงสร้างไมโทคอนเดรีย — โรงไฟฟ้าของเซลล์', req:0 },
  { id:'glyco', ic:stageIcon('stage-glycolysis.webp','ไกลโคไลซิส','🍬'), title:'ด่านไกลโคไลซิส',       desc:'แตกกลูโคสเป็นไพรูเวตในไซโทซอล นับ ATP และ NADH', req:1 },
  { id:'krebs', ic:stageIcon('stage-krebs.webp','วัฏจักรเครบส์','🔄'), title:'วัฏจักรเครบส์',         desc:'ออกซิไดซ์ไพรูเวตจนหมด ปลดปล่อย CO₂ และตัวพาอิเล็กตรอน', req:2 },
  { id:'etc',   ic:stageIcon('stage-etc.webp','การถ่ายทอดอิเล็กตรอน','⚡'), title:'สายพานถ่ายทอดอิเล็กตรอน', desc:'ส่งอิเล็กตรอนจาก NADH ไปถึงออกซิเจน แล้วปั่น ATP', req:3 },
  { id:'ledger',ic:stageIcon('stage-atp.webp','ATP','🔋'), title:'ห้องบัญชีพลังงาน',      desc:'รวมยอด ATP ทั้งหมด เทียบใช้/ไม่ใช้ออกซิเจน', req:4 },
  { id:'boss',  ic:stageIcon('stage-oxygen.webp','ออกซิเจน','💨'), title:'บอส: ศึกออกซิเจน',       desc:'การหมัก ออกกำลังกาย ยีสต์ รากพืชจมน้ำ ความร้อน และสารพิษยับยั้ง', req:5 }
];

function renderMap(){
  syncHud();
  const cleared = STAGES.filter(s=>S.stars[s.id]>0).length;
  app.innerHTML = `
    <div class="hero">
      <div class="pub"><img src="logo.png" alt="โลโก้ Biology" onerror="this.remove()"><span>Biology<b>.</b></span></div>
      <h1>โรงไฟฟ้าไมโทคอนเดรีย</h1>
      <p>เดินทางเข้าไปในไมโทคอนเดรีย เพื่อดูว่าเซลล์<strong>สลายกลูโคส</strong><br>
         เปลี่ยนเป็นพลังงาน <strong>ATP</strong> ทีละขั้นได้อย่างไร</p>
      <div class="eq">C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> + 6O<sub>2</sub> → 6CO<sub>2</sub> + 6H<sub>2</sub>O + พลังงาน (ATP)</div>
      <div id="classSlot"></div>
    </div>
    <div class="maplist">
      ${STAGES.map((s,i)=>{
        const got=S.stars[s.id]||0, locked=cleared<s.req;
        return `<div class="node ${locked?'locked':''} ${got?'done':''}" data-id="${s.id}">
          <span class="no">ด่าน ${i+1}</span>
          <div class="ic">${locked?'🔒':s.ic}</div>
          <div class="body">
            <div class="t">${s.title}</div>
            <div class="d">${locked?`ผ่านด่านก่อนหน้าให้ครบ ${s.req} ด่านเพื่อปลดล็อก`:s.desc}</div>
            ${locked?'':`<div class="stars">${stars(got)}</div>`}
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="card" style="margin-top:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
      <div style="font-size:2rem">🃏</div>
      <div style="flex:1;min-width:190px">
        <div style="font-weight:800">การ์ดคำศัพท์</div>
        <div class="small muted">${CARDS.length} การ์ด ทบทวนศัพท์ไทย–อังกฤษ พร้อมนิยาม เปิดเล่นได้ตลอดเวลา</div>
      </div>
      <button class="btn gold" id="btnCards">เปิดสำรับ</button>
    </div>
    ${certCardHtml()}
    ${totalStars()>=15 ? `<div class="note key" style="margin-top:14px">
      🏅 <b>เหรียญวิศวกรพลังงานเซลล์!</b> ได้ ${totalStars()} ดาว — เข้าใจครบทั้ง 4 ขั้นของการหายใจแบบใช้ออกซิเจนแล้ว
    </div>`:''}
    <div class="center" style="margin-top:18px">
      <button class="btn ghost sm" id="btnReset">เริ่มใหม่ทั้งหมด</button>
    </div>
  `;
  app.querySelectorAll('.node').forEach(n=>{
    n.addEventListener('click',()=>{
      if(n.classList.contains('locked')){ toast('🔒 ยังไม่ปลดล็อกด่านนี้'); return; }
      openStage(n.dataset.id);
    });
  });
  document.getElementById('btnCards').onclick = renderCards;
  const certBtn = document.getElementById('btnCert');
  if(certBtn && !certBtn.disabled) certBtn.onclick = renderCert;
  document.getElementById('btnReset').onclick = ()=>{
    if(confirm('ล้างความก้าวหน้าทั้งหมดและเริ่มใหม่?')){
      S=structuredClone(defaultState); save(); renderMap(); toast('เริ่มใหม่แล้ว');
    }
  };
  renderClassChip();
  window.scrollTo({top:0,behavior:'smooth'});
}

function stageShell(id, extraHtml=''){
  const st = STAGES.find(s=>s.id===id);
  return `<div class="stagehead">
      <div class="ic">${st.ic}</div>
      <div style="flex:1;min-width:200px"><h2>${st.title}</h2><div class="sub">${st.desc}</div></div>
    </div>${extraHtml}`;
}
let stageT0 = 0;        // เวลาเริ่มด่าน ใช้คำนวณเวลาที่ใช้ต่อด่าน
let stageMiss = 0;      // จำนวนครั้งที่ตอบผิดในด่านที่กำลังเล่น (ตั้งค่าก่อนเรียก finishStage)
function openStage(id){
  window.scrollTo({top:0});
  stageT0 = Date.now(); stageMiss = 0;
  ({mito:stageMito, glyco:stageGlyco, krebs:stageKrebs, etc:stageETC, ledger:stageLedger, boss:stageBoss})[id]();
}
function finishStage(id, got, xp, summaryHtml){
  const prev=S.stars[id]||0; if(got>prev) S.stars[id]=got;
  S.plays = S.plays || {}; S.plays[id] = (S.plays[id]||0) + 1;
  S.xp+=xp; save(); syncHud();
  const secs = stageT0 ? Math.round((Date.now()-stageT0)/1000) : 0;
  const misses = Math.max(0, stageMiss|0); stageMiss = 0;
  S.secs = S.secs || {}; S.miss = S.miss || {};
  S.secs[id] = secs; S.miss[id] = misses;   // เก็บไว้เผื่อเข้าร่วมห้องทีหลัง จะได้ส่งเวลาจริงตามไปด้วย
  save();
  sendScore(id, got, misses, secs);   // ส่งคะแนนให้ครู (ถ้าเข้าร่วมห้อง)
  app.innerHTML = `
    <div class="card result">
      <div class="big">${stars(got)}</div>
      <h2>${got===3?'สมบูรณ์แบบ!':got===2?'เก่งมาก!':got===1?'ผ่านแล้ว':'ยังไม่ผ่าน'}</h2>
      <p class="muted">ได้รับ <b style="color:var(--lime)">+${xp} XP</b></p>
      <div style="text-align:left;max-width:640px;margin:18px auto 0">${summaryHtml}</div>
      <div style="margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn" id="again">เล่นด่านนี้อีกครั้ง</button>
        <button class="btn primary" id="back">กลับแผนที่ →</button>
      </div>
    </div>`;
  document.getElementById('again').onclick = ()=>openStage(id);
  document.getElementById('back').onclick  = renderMap;
  window.scrollTo({top:0,behavior:'smooth'});
}

/* =========================================================================
   ด่าน 1 — โครงสร้างไมโทคอนเดรีย
   ========================================================================= */
/* ภาพไมโทคอนเดรีย 3 มิติ (ไฟล์ mito3d.jpg — ถ้าไม่มีจะถอยไปใช้ mitochondrion.jpg แล้วภาพวาดสำรองตามลำดับ)
   พิกัดของทุกจุด u,v คิดเป็น "สัดส่วนของภาพ" (0–1) วัดจากไฟล์ภาพจริง
   จึงเปลี่ยนไฟล์ภาพที่ขนาดต่างกันได้ โดยไม่ต้องแก้อะไรอีก */
const MITO_PHOTO = 'mito3d.jpg';
const MITO_RATIO = '1400/763';        // สัดส่วนกว้าง/สูงของไฟล์ภาพ
/* กรอบวาดของกระดาน (หน่วยเดียวกับ CSS ด้านบน): กว้าง 1000 หน่วย สูง 732 หน่วย
   ภาพวางอยู่ในกรอบ ตั้งแต่ x 150→870 และ y 210→602 · ที่เหลือคือขอบไว้วางป้าย
   ax,ay = จุดบนภาพ (คำนวณจาก u,v) · lx,ly = ตำแหน่งกึ่งกลางของป้าย ??? */
const MB = { w:1000, h:723, x0:0.145, y0:0.20, iw:0.73, ih:0.3978 };
const mbX = u => (MB.x0 + u*MB.iw) * MB.w;
const mbY = v => (MB.y0 + v*MB.ih) * MB.w;
const MITO_PARTS = [
  { key:'outer',  u:0.360, v:0.740, lx:380, ly:690, label:'เยื่อหุ้มชั้นนอก',
    info:'Outer membrane — ชั้นนอกสุดที่เรียบ ไม่พับ มีโปรตีนพอริน สารโมเลกุลเล็กจึงผ่านเข้าออกได้ค่อนข้างอิสระ' },
  { key:'inter',  u:0.150, v:0.669, lx:88,  ly:470, label:'ช่องระหว่างเยื่อ',
    info:'Intermembrane space — ช่องแคบ ๆ ระหว่างเยื่อสองชั้น (ในภาพเห็นเป็นเส้นบางระหว่างสองชั้น) เป็นที่<b>สะสม H⁺</b> จน pH ต่ำ เทียบได้กับลูเมนของไทลาคอยด์' },
  { key:'inner',  u:0.700, v:0.168, lx:660, ly:52,  label:'เยื่อหุ้มชั้นใน',
    info:'Inner membrane — เยื่อชั้นในที่พับเป็นคริสตี ฝัง <b>ระบบถ่ายทอดอิเล็กตรอนและ ATP synthase</b> เลือกผ่านอย่างเข้มงวด' },
  { key:'crista', u:0.380, v:0.220, lx:400, ly:40,  label:'คริสตี',
    info:'Cristae — รอยพับเข้าของเยื่อชั้นใน (นิ้วมือที่ยื่นเข้าไปในเมทริกซ์) เพิ่มพื้นที่ผิวให้ติดตั้งลูกโซ่หายใจได้มากที่สุด' },
  { key:'matrix', u:0.632, v:0.565, lx:722, ly:690, label:'เมทริกซ์',
    info:'Matrix — ของเหลวชั้นในสุด (สีน้ำตาล) เป็นที่เกิด <b>การออกซิไดซ์ไพรูเวตและวัฏจักรเครบส์</b> มีเอนไซม์ · DNA · ไรโบโซม' },
  { key:'ribo',   u:0.650, v:0.300, lx:905, ly:128, label:'ไรโบโซม',
    info:'Ribosome — เม็ดกลมเล็ก ๆ ที่กระจายอยู่ในเมทริกซ์ ไมโทคอนเดรียมีไรโบโซมของตัวเอง จึงสร้างโปรตีนบางส่วนได้เอง' },
  { key:'dna',    u:0.320, v:0.295, lx:150, ly:44,  label:'ดีเอ็นเอ',
    info:'mtDNA — เส้นดีเอ็นเอวงแหวนที่ขดอยู่ในเมทริกซ์ (แยกจาก DNA ในนิวเคลียส) เป็นหลักฐานสำคัญของทฤษฎีเอนโดซิมไบโอซิส' }
];
/* ภาพวาดสำรอง (ใช้เมื่อยังไม่มีไฟล์ภาพถ่าย) */
const MITO_FALLBACK = `
<svg viewBox="0 0 1400 763" style="width:100%;display:block" aria-hidden="true">
  <defs><clipPath id="mfMatrix"><ellipse cx="700" cy="382" rx="520" ry="230"/></clipPath></defs>
  <rect width="1400" height="763" fill="#FBF8EC" rx="14"/>
  <ellipse cx="700" cy="382" rx="560" ry="270" fill="#F3D2B4" stroke="#C77A3A" stroke-width="16"/>
  <ellipse cx="700" cy="382" rx="520" ry="230" fill="#8A5A3B" stroke="#E09A63" stroke-width="14"/>
  <g clip-path="url(#mfMatrix)" fill="none" stroke="#E09A63" stroke-width="34" stroke-linecap="round">
    <path d="M532 152 L532 430"/><path d="M700 612 L700 350"/><path d="M884 152 L884 430"/>

function mitoBoard(src){
  const pcx = n => (n/MB.w*100).toFixed(2)+'%';   // แนวนอน เทียบความกว้างกรอบ
  const pcy = n => (n/MB.h*100).toFixed(2)+'%';   // แนวตั้ง เทียบความสูงกรอบ
  const lines = MITO_PARTS.map(p=>`<line x1="${p.lx}" y1="${p.ly}" x2="${mbX(p.u)}" y2="${mbY(p.v)}"
      stroke="#04261E" stroke-width="1.6" stroke-dasharray="7 5" opacity=".65" vector-effect="non-scaling-stroke"/>`).join('');
  return `<div class="mboard">
    <div class="mimg" style="aspect-ratio:${MITO_RATIO}">
      ${src ? `<img src="${src}" alt="ภาพตัดขวางไมโทคอนเดรีย">` : MITO_FALLBACK}
      ${MITO_PARTS.map((p,i)=>`<div class="anchor" id="pin-${p.key}"
          style="left:${(p.u*100).toFixed(2)}%;top:${(p.v*100).toFixed(2)}%">${i+1}</div>`).join('')}
    </div>
    <svg class="leads" viewBox="0 0 ${MB.w} ${MB.h}" preserveAspectRatio="none" aria-hidden="true">${lines}</svg>
    <div class="cwrap">
      ${MITO_PARTS.map((p,i)=>`<div class="slot callout" data-key="${p.key}"
          style="left:${pcx(p.lx)};top:${pcy(p.ly)}"><i>${i+1}</i><span class="ans">? ? ?</span></div>`).join('')}
    </div>
  </div>`;
}
/* เช็กว่าไฟล์ภาพมีจริงไหม ถ้ายังไม่ได้อัปโหลดจะถอยไปใช้ไฟล์สำรองให้เอง */
function withImage(src, ok, fail){
  const im = new Image(); im.onload = ()=>ok(); im.onerror = ()=>fail(); im.src = src;
}
function stageMito(){
  let mistakes=0, placed=0, armed=null;
  const draw = (src)=>{
    app.innerHTML = stageShell('mito', `
      <div class="note">🎯 <b>ภารกิจ:</b> แตะชื่อโครงสร้างในสำรับ แล้วแตะป้าย <b>? ? ?</b> ที่ชี้ไปยังตำแหน่งของมันในภาพ
        — วางให้ครบ ${MITO_PARTS.length} จุดโดยผิดน้อยที่สุด <span class="small muted">(บนมือถือป้ายจะเรียงเป็นรายการหมายเลขใต้ภาพ)</span></div>
      <div class="bar"><i id="pb" style="width:0%"></i></div>
      <div class="bank" id="bank">
        ${shuffle(MITO_PARTS).map(p=>`<div class="tok" data-key="${p.key}">${p.label}</div>`).join('')}
      </div>
      ${mitoBoard(src)}
      <div class="feedback" id="fb"></div>
      <div class="note key" style="margin-top:16px">
        💡 <b>หัวใจของด่านนี้:</b> วัฏจักรเครบส์เกิดใน <b>เมทริกซ์</b> ส่วนการถ่ายทอดอิเล็กตรอนเกิดที่ <b>เยื่อชั้นใน (คริสตี)</b> —
        โครงสร้างนี้คล้ายคลอโรพลาสต์: เยื่อชั้นในทำหน้าที่เดียวกับเยื่อไทลาคอยด์
      </div>
    `);
    bind();
  };
  withImage(MITO_PHOTO, ()=>draw(MITO_PHOTO),
    ()=>withImage('mitochondrion.jpg', ()=>draw('mitochondrion.jpg'), ()=>draw(null)));
  function bind(){
  const fb=document.getElementById('fb'), pb=document.getElementById('pb');
  app.querySelectorAll('#bank .tok').forEach(t=>{
    t.onclick = ()=>{
      app.querySelectorAll('.tok').forEach(x=>x.classList.remove('sel'));
      app.querySelectorAll('.slot').forEach(x=>x.classList.remove('armed'));
      if(armed===t.dataset.key){ armed=null; return; }
      armed=t.dataset.key; t.classList.add('sel');
      app.querySelectorAll('.slot:not(.filled)').forEach(x=>x.classList.add('armed'));
    };
  });
  app.querySelectorAll('.slot').forEach(sl=>{
    sl.onclick = ()=>{
      if(!armed || sl.classList.contains('filled')) return;
      const part = MITO_PARTS.find(p=>p.key===armed);
      if(sl.dataset.key===armed){
        sl.classList.add('filled'); sl.classList.remove('armed');
        sl.querySelector('.ans').textContent=part.label;
        const pin=document.getElementById('pin-'+part.key); if(pin) pin.classList.add('done');
        app.querySelector(`.tok[data-key="${armed}"]`).classList.add('used');
        placed++; pb.style.width=(placed/MITO_PARTS.length*100)+'%';
        fb.className='feedback show good'; fb.innerHTML=`✅ <b>${part.label}</b> — ${part.info}`;
        armed=null; app.querySelectorAll('.slot').forEach(x=>x.classList.remove('armed'));
        if(placed===MITO_PARTS.length) setTimeout(done,900);
      }else{
        mistakes++; sl.classList.add('wrong'); setTimeout(()=>sl.classList.remove('wrong'),400);
        fb.className='feedback show bad';
        fb.innerHTML=`❌ หมายเลขนี้ยังไม่ใช่ <b>${part.label}</b> — ลองดูว่ามันอยู่ชั้นไหนของไมโทคอนเดรีย`;
      }
    };
  });
  }
  function done(){
    const got = mistakes<=1?3:mistakes<=3?2:1;
    stageMiss=mistakes; finishStage('mito', got, 60-Math.min(mistakes*6,30), `
      <div class="note key">🟡 <b>สรุปที่ต้องจำ</b><br>
        • ไมโทคอนเดรียมีเยื่อหุ้ม <b>2 ชั้น</b> เยื่อชั้นในพับเป็น <b>คริสตี</b> เพิ่มพื้นที่ผิว<br>
        • <b>เมทริกซ์</b> = ที่เกิดการออกซิไดซ์ไพรูเวต + วัฏจักรเครบส์ · <b>เยื่อชั้นใน</b> = ที่เกิดการถ่ายทอดอิเล็กตรอน<br>
        • มี DNA และไรโบโซมของตัวเอง (หลักฐานทฤษฎีเอนโดซิมไบโอซิส เช่นเดียวกับคลอโรพลาสต์)</div>
      <div class="note miss">🔴 <b>ระวังเข้าใจผิด:</b> <b>ไกลโคไลซิสไม่ได้เกิดในไมโทคอนเดรีย</b> แต่เกิดใน <b>ไซโทซอล (ไซโทพลาซึม)</b>
        เซลล์ที่ไม่มีไมโทคอนเดรีย เช่น เม็ดเลือดแดง จึงยังทำไกลโคไลซิสได้</div>
      <div class="small muted">ผิดทั้งหมด ${mistakes} ครั้ง</div>`);
  }
}

/* =========================================================================
   ด่าน 2 — ไกลโคไลซิส (สโตอิคิโอเมตรี)
   ========================================================================= */
function stageGlyco(){
  const PH = [
    { title:'ระยะลงทุนพลังงาน (Energy investment)',
      hint:'เซลล์ต้องเติมหมู่ฟอสเฟตจาก <b>ATP</b> ให้กลูโคสก่อน เพื่อทำให้โมเลกุลไม่เสถียรและพร้อมแตกตัว',
      inputs:[{id:'inv',name:'ATP ที่ลงทุนไป', ans:2, max:6}],
      ok:'ถูกต้อง! ช่วงแรกต้องใช้ ATP <b>2</b> โมเลกุลก่อน จึงยังไม่ได้กำไรในระยะนี้' },
    { title:'การแตกโมเลกุล (Cleavage)',
      hint:'น้ำตาลฟรุกโทส-1,6-บิสฟอสเฟต (6C) ถูกแตกครึ่งเป็นน้ำตาล 3 คาร์บอน<br>นับดูว่าจะได้ G3P (3C) กี่โมเลกุล',
      inputs:[{id:'g3p',name:'G3P ที่ได้', ans:2, max:6}],
      ok:'ถูกต้อง! กลูโคส 1 โมเลกุล (6C) แตกเป็น G3P <b>2</b> โมเลกุล (3C × 2 = 6C ✓)' },
    { title:'ระยะได้ผลตอบแทน (Energy payoff)',
      hint:'G3P 2 โมเลกุลถูกเปลี่ยนเป็นไพรูเวต ปล่อยพลังงานออกมาสร้าง ATP และ NADH<br>นับผลรวมของ G3P ทั้ง 2 โมเลกุล',
      inputs:[
        {id:'atp',   name:'ATP ที่ผลิตได้ (รวม)', ans:4, max:8},
        {id:'nadh',  name:'NADH ที่ได้',          ans:2, max:6},
        {id:'pyr',   name:'ไพรูเวตที่ได้',        ans:2, max:6}
      ],
      ok:'ถูกต้อง! ได้ ATP <b>4</b> (แบบ substrate-level) · NADH <b>2</b> · ไพรูเวต <b>2</b> โมเลกุล' }
  ];
  let cur=0, wrong=0;
  const vals={}; PH.forEach(p=>p.inputs.forEach(i=>vals[i.id]=0));

  app.innerHTML = stageShell('glyco', `
    <div class="note">🎯 <b>ภารกิจ:</b> เดินไกลโคไลซิสทีละระยะในไซโทซอล เติมจำนวนโมเลกุลให้ถูก
      สุดท้ายจะได้ <b>กำไรสุทธิ ATP 2 โมเลกุล</b></div>
    <div class="bar"><i id="pb" style="width:0%"></i></div>
    <div id="phases"></div>
    <div class="feedback" id="fb"></div>
    <div class="note small" style="margin-top:8px">
      🔵 ไกลโคไลซิสเกิดใน <b>ไซโทซอล</b> และ <b>ไม่ต้องใช้ออกซิเจน</b> — จึงเป็นขั้นตอนร่วมของทั้งการหายใจแบบใช้ออกซิเจนและการหมัก
    </div>
  `);
  const phasesEl=document.getElementById('phases'), fb=document.getElementById('fb'), pb=document.getElementById('pb');

  function render(){
    pb.style.width=(cur/PH.length*100)+'%';
    phasesEl.innerHTML = PH.map((p,i)=>`
      <div class="phase ${i===cur?'active':''} ${i<cur?'solved':''}">
        <h4>${i<cur?'✅ ':''}${p.title}</h4>
        ${i===cur?`<div class="hintline">${p.hint}</div>
          ${p.inputs.map(inp=>`
            <div class="step"><span class="nm">${inp.name}</span>
              <span class="stepper">
                <button data-act="-" data-id="${inp.id}">−</button>
                <span class="n" id="n-${inp.id}">${vals[inp.id]}</span>
                <button data-act="+" data-id="${inp.id}" data-max="${inp.max}">+</button>
              </span></div>`).join('')}
          <button class="btn primary sm" style="margin-top:10px" id="check">ตรวจสอบ →</button>`:''}
      </div>`).join('');
    phasesEl.querySelectorAll('.stepper button').forEach(b=>{
      b.onclick=()=>{
        const id=b.dataset.id;
        if(b.dataset.act==='+') vals[id]=Math.min(+b.dataset.max, vals[id]+1);
        else vals[id]=Math.max(0, vals[id]-1);
        document.getElementById('n-'+id).textContent=vals[id];
      };
    });
    const chk=phasesEl.querySelector('#check');
    if(chk) chk.onclick=()=>{
      const p=PH[cur], bad=p.inputs.filter(i=>vals[i.id]!==i.ans);
      if(bad.length===0){
        fb.className='feedback show good'; fb.innerHTML='✅ '+p.ok;
        cur++;
        if(cur>=PH.length){ pb.style.width='100%'; setTimeout(done,1500); }
        else setTimeout(render,850);
      }else{
        wrong++; fb.className='feedback show bad';
        fb.innerHTML=`❌ ยังไม่ถูก — ลองตรวจ <b>${bad.map(b=>b.name).join(', ')}</b> อีกครั้ง`;
      }
    };
  }
  render();
  function done(){
    const got = wrong<=1?3:wrong<=3?2:1;
    stageMiss=wrong; finishStage('glyco', got, 70-Math.min(wrong*8,45), `
      <div class="note key">🟡 <b>บัญชีของไกลโคไลซิส (ต่อกลูโคส 1 โมเลกุล)</b><br>
        ลงทุน ATP 2 → ผลิต ATP 4 → <b>กำไรสุทธิ ATP = 2</b><br>
        ได้ <b>NADH 2</b> และ <b>ไพรูเวต 2</b> โมเลกุล (ยังไม่ปล่อย CO₂ เลยในขั้นนี้)</div>
      <div class="note miss">🔴 <b>ระวังเข้าใจผิด:</b> ATP ที่ได้จากไกลโคไลซิสเป็นแบบ <b>substrate-level phosphorylation</b>
        (ถ่ายหมู่ฟอสเฟตโดยตรง) ไม่ใช่จากการถ่ายทอดอิเล็กตรอน จึงเกิดได้แม้ไม่มีออกซิเจน</div>
      <div class="small muted">ตอบผิด ${wrong} ครั้ง</div>`);
  }
}

    stageMiss=wrong; finishStage('krebs', got, 85-Math.min(wrong*8,50), `
      <div class="note key">🟡 <b>รวมยอดหลังจบเครบส์ (ต่อกลูโคส 1 โมเลกุล)</b><br>
        การออกซิไดซ์ไพรูเวต: CO₂ 2 · NADH 2<br>
        วัฏจักรเครบส์ (2 รอบ): CO₂ 4 · NADH 6 · FADH₂ 2 · ATP 2<br>
        <b>สะสมถึงตอนนี้: NADH 10 · FADH₂ 2 · ATP 4 · CO₂ 6 ครบ</b></div>
      <div class="note miss">🔴 <b>ระวังเข้าใจผิด:</b> วัฏจักรเครบส์ <b>ไม่ได้สร้าง ATP โดยตรงเป็นส่วนใหญ่</b>
        มันสร้างเพียง ATP น้อยนิด แต่ผลิต <b>NADH และ FADH₂</b> ซึ่งเป็นตัวพาอิเล็กตรอนไปให้ขั้นถัดไปสร้าง ATP จำนวนมาก</div>
      <div class="note">🔵 <b>ต่อยอด:</b> วัฏจักรเครบส์ยังเป็น “ทางแยกกลาง” ที่กรดอะมิโนและกรดไขมันเข้าร่วมได้
        จึงเชื่อมเมแทบอลิซึมของสารอาหารทุกชนิดเข้าด้วยกัน</div>
      <div class="small muted">ตอบผิด ${wrong} ครั้ง</div>`);
  }
}

/* =========================================================================
   ด่าน 4 — ระบบถ่ายทอดอิเล็กตรอน (ETC) + เคมิออสโมซิส
   ========================================================================= */
const ETC = [
  { n:'NADH · FADH₂ (ตัวให้อิเล็กตรอน)', e:'นำอิเล็กตรอนพลังงานสูงจากไกลโคไลซิส การออกซิไดซ์ไพรูเวต และวัฏจักรเครบส์ มาปล่อยที่เยื่อชั้นใน' },
  { n:'คอมเพล็กซ์ I', e:'NADH dehydrogenase — รับอิเล็กตรอนจาก NADH แล้ว<b>ปั๊ม H⁺</b> ข้ามเยื่อเข้าสู่ช่องระหว่างเยื่อ (FADH₂ ข้ามคอมเพล็กซ์นี้ ไปเข้าที่ Q แทน)' },
  { n:'โคเอนไซม์คิว (Q / ยูบิควิโนน)', e:'ตัวพาอิเล็กตรอนเคลื่อนที่ได้ในเยื่อ รับอิเล็กตรอนจากคอมเพล็กซ์ I และ II ส่งต่อให้คอมเพล็กซ์ III' },
  { n:'คอมเพล็กซ์ III', e:'Cytochrome bc₁ — ปั๊ม H⁺ เพิ่ม แล้วส่งอิเล็กตรอนต่อให้ไซโทโครม ซี' },
  { n:'ไซโทโครม ซี', e:'ตัวพาอิเล็กตรอนขนาดเล็ก เคลื่อนที่บนผิวด้านนอกของเยื่อชั้นใน นำอิเล็กตรอนไปให้คอมเพล็กซ์ IV' },
  { n:'คอมเพล็กซ์ IV', e:'Cytochrome c oxidase — ปั๊ม H⁺ และส่งอิเล็กตรอนตัวสุดท้ายให้ออกซิเจน' },
  { n:'ออกซิเจน (O₂)', e:'<b>ตัวรับอิเล็กตรอนตัวสุดท้าย</b> — รับอิเล็กตรอนและ H⁺ กลายเป็น <b>น้ำ (H₂O)</b> ถ้าไม่มี O₂ ทั้งสายจะติดขัดทันที' },
  { n:'ATP synthase (เคมิออสโมซิส)', e:'H⁺ ที่สะสมในช่องระหว่างเยื่อไหลกลับเข้าเมทริกซ์ผ่าน ATP synthase → ปั่นสร้าง <b>ATP จำนวนมาก</b> (oxidative phosphorylation)' }
];
function stageETC(){
  let idx=0, wrong=0;
  const pool = shuffle(ETC.map((z,i)=>({...z,i})));
  app.innerHTML = stageShell('etc', `
    <div class="note">🎯 <b>ภารกิจ:</b> อิเล็กตรอนต้องวิ่งจาก <b>NADH</b> ไปจบที่ <b>ออกซิเจน</b> แล้วพลังงานถูกเก็บเป็น ATP
      แตะการ์ดให้ถูก<b>ลำดับ</b></div>
    <div class="bar"><i id="pb" style="width:0%"></i></div>
    <div class="chain" id="chain"><span class="ph">แตะการ์ดด้านล่างเพื่อเริ่มต่อสายถ่ายทอดอิเล็กตรอน…</span></div>
    <div class="pool" id="pool">${pool.map(p=>`<div class="tok" data-i="${p.i}">${p.n}</div>`).join('')}</div>
    <div class="feedback" id="fb"></div>
    <div class="note warn" style="margin-top:16px">
      ⚡ <b>ที่นี่คือที่ผลิต ATP มากที่สุด</b> — H⁺ ที่ถูกปั๊มไปสะสมในช่องระหว่างเยื่อ สร้างเกรเดียนต์
      แล้วไหลกลับผ่าน ATP synthase (หลักการเดียวกับ ATP synthase ในคลอโรพลาสต์เป๊ะ)
    </div>
  `);
  const chain=document.getElementById('chain'), fb=document.getElementById('fb'), pb=document.getElementById('pb');
  app.querySelectorAll('#pool .tok').forEach(t=>{
    t.onclick=()=>{
      const i=+t.dataset.i;
      if(i===idx){
        if(idx===0) chain.innerHTML=''; else chain.insertAdjacentHTML('beforeend','<span class="arrow">→</span>');
        chain.insertAdjacentHTML('beforeend', `<span class="link">${ETC[i].n}</span>`);
        t.classList.add('used');
        fb.className='feedback show good'; fb.innerHTML=`✅ <b>${ETC[i].n}</b><br>${ETC[i].e}`;
        idx++; pb.style.width=(idx/ETC.length*100)+'%';
        if(idx===ETC.length) setTimeout(done,1400);
      }else{
        wrong++; t.classList.add('bad'); setTimeout(()=>t.classList.remove('bad'),400);
        fb.className='feedback show bad';
        fb.innerHTML=`❌ ยังไม่ถึงคิวของ <b>${ETC[i].n}</b> — ลองนึกว่าอิเล็กตรอนตอนนี้อยู่ตรงไหนของสาย`;
      }
    };
  });
  function done(){
    const got = wrong<=1?3:wrong<=3?2:1;
    stageMiss=wrong; finishStage('etc', got, 85-Math.min(wrong*7,50), `
      <div class="note key">🟡 <b>สรุปที่ต้องจำ — ระบบถ่ายทอดอิเล็กตรอน</b><br>
        NADH/FADH₂ → คอมเพล็กซ์ I → Q → III → ไซโทโครม ซี → IV → <b>O₂ → H₂O</b><br>
        พลังงานถูกใช้ปั๊ม H⁺ สะสมในช่องระหว่างเยื่อ แล้ว <b>ATP synthase</b> ปั่นเป็น ATP (เคมิออสโมซิส)</div>
      <div class="note miss">🔴 <b>ระวังเข้าใจผิด:</b> ออกซิเจน<b>ไม่ได้ไป “เผา” กลูโคสโดยตรง</b>
        แต่ทำหน้าที่เพียง <b>ตัวรับอิเล็กตรอนตัวสุดท้าย</b> ปลายสาย ถ้าขาด O₂ อิเล็กตรอนไม่มีที่ไป
        NADH สะสมจนล้น ทั้งเครบส์และ ETC หยุดชะงัก</div>
      <div class="note">🔵 <b>ทำไม FADH₂ ให้ ATP น้อยกว่า NADH?</b> เพราะ FADH₂ ป้อนอิเล็กตรอนเข้าที่ Q
        ข้ามคอมเพล็กซ์ I ไป จึงปั๊ม H⁺ ได้น้อยกว่า → ได้ ATP น้อยกว่า (2 เทียบกับ 3 ในค่าดั้งเดิม)</div>
      <div class="small muted">ตอบผิด ${wrong} ครั้ง</div>`);
  }
}

/* =========================================================================
   ด่าน 5 — ห้องบัญชีพลังงาน (ATP ledger, แบบจำลอง)
   ========================================================================= */
/* ── ตัวเลขบัญชี ATP — ปรับให้ตรงกับหนังสือที่ใช้สอนได้ที่จุดนี้จุดเดียว ──
   ค่าเริ่มต้นตรงกับหนังสือเรียน สสวท. ม.4 (ค่าดั้งเดิม 38 ในโพรคาริโอต / 36 ในยูคาริโอต)
   ถ้าหนังสือที่ใช้สอนคิดคนละแบบ เช่น ให้ NADH = 2.5 หรือไม่คิดต้นทุนขนส่ง
   แก้เฉพาะตัวเลขในบล็อกนี้ ตารางบัญชี ปุ่มสลับ ภารกิจ และข้อความสรุปจะเปลี่ยนตามทั้งหมด */
const ATP_BOOK = {
  glycoATP:   2,    // ATP โดยตรงจากไกลโคไลซิส (สุทธิ)
  krebsATP:   2,    // ATP โดยตรงจากวัฏจักรเครบส์ (2 รอบ)
  nadhTotal: 10,    // NADH ทั้งหมดต่อกลูโคส 1 โมเลกุล (2 ไกลโคไลซิส + 2 ออกซิไดซ์ไพรูเวต + 6 เครบส์)
  fadhTotal:  2,    // FADH₂ ทั้งหมดต่อกลูโคส 1 โมเลกุล
  perNADH_trad: 3,  perFADH2_trad: 2,     // ค่าดั้งเดิมในหนังสือเรียน
  perNADH_mod:  2.5, perFADH2_mod: 1.5,   // ค่าที่วัดได้จริงในปัจจุบัน
  shuttle:    2     // ATP ที่ยูคาริโอตเสียไปกับการขนส่ง NADH ของไกลโคไลซิสเข้าไมโทคอนเดรีย
};
function stageLedger(){
  const B = ATP_BOOK;
  const st = { aerobic:true, euk:true, modern:false };
  const perNADH  = s => s.modern ? B.perNADH_mod  : B.perNADH_trad;
  const perFADH2 = s => s.modern ? B.perFADH2_mod : B.perFADH2_trad;
  // ค่าต่อกลูโคส 1 โมเลกุล
  function model(s){
    const perN = perNADH(s), perF = perFADH2(s);
    if(!s.aerobic){
      return { subst:B.glycoATP, fromN:0, fromF:0, total:B.glycoATP, // การหมัก: ได้เฉพาะ ATP จากไกลโคไลซิส
               nadh:2, fadh:0, note:'ไม่ใช้ออกซิเจน → NADH ไม่ถูกส่งเข้า ETC แต่ถูกใช้คืน NAD⁺ ในการหมัก' };
    }
    const nadh=B.nadhTotal, fadh=B.fadhTotal;
    let subst=B.glycoATP+B.krebsATP, fromN=nadh*perN, fromF=fadh*perF;
    let total = subst+fromN+fromF;
    if(s.euk) total -= B.shuttle; // ยูคาริโอต: ต้นทุนขนส่ง NADH จากไกลโคไลซิสเข้าไมโทคอนเดรีย
    total = Math.round(total);
    return { subst, fromN:Math.round(fromN), fromF:Math.round(fromF), total, nadh, fadh,
             note: s.euk?('ยูคาริโอต: เสีย ATP ~'+B.shuttle+' ไปกับการขนส่ง NADH ของไกลโคไลซิสเข้าไมโทคอนเดรีย'):'โพรคาริโอต: ไม่มีต้นทุนขนส่ง จึงได้เต็ม' };
  }
  const T_PRO  = model({aerobic:true, euk:false, modern:false}).total;   // ยอดโพรคาริโอต ค่าดั้งเดิม
  const T_EUK  = model({aerobic:true, euk:true,  modern:false}).total;   // ยอดยูคาริโอต ค่าดั้งเดิม
  const T_MOD  = model({aerobic:true, euk:true,  modern:true }).total;   // ยอดตามค่าปัจจุบัน
  const T_FERM = model({aerobic:false,euk:true,  modern:false}).total;   // ยอดแบบไม่ใช้ออกซิเจน
  const T_ETC  = T_PRO - (B.glycoATP + B.krebsATP);                      // ATP ที่มาจาก ETC
  const MISSIONS = [
    { t:`<b>ยอดเต็มแบบใช้ออกซิเจน</b><br>ตั้งค่า: ใช้ออกซิเจน · โพรคาริโอต · ค่าดั้งเดิม แล้วอ่านยอดรวมให้ได้ <b>${T_PRO} ATP</b>`,
      test:(s,m)=> s.aerobic && !s.euk && !s.modern,
      q:{ q:'ในการหายใจแบบใช้ออกซิเจน ขั้นตอนใดสร้าง ATP ได้<b>มากที่สุด</b>?',
          o:['ไกลโคไลซิส','วัฏจักรเครบส์','ระบบถ่ายทอดอิเล็กตรอน (oxidative phosphorylation)','การออกซิไดซ์ไพรูเวต'],
          a:2, e:`ATP ส่วนใหญ่ (ราว ${T_ETC} จาก ${T_PRO}) มาจาก <b>ระบบถ่ายทอดอิเล็กตรอน</b> ผ่านเคมิออสโมซิส ส่วนไกลโคไลซิสและเครบส์ให้ ATP โดยตรงเพียง ${B.glycoATP+B.krebsATP} โมเลกุล` } },

    { t:`<b>ยูคาริโอตหายไป ${B.shuttle} ATP</b><br>คงค่าดั้งเดิมไว้ แล้วสลับชนิดเซลล์เป็น <b>ยูคาริโอต</b> — ยอดรวมจะเหลือ <b>${T_EUK} ATP</b>`,
      test:(s,m)=> s.aerobic && s.euk && !s.modern,
      q:{ q:`เหตุใดเซลล์ยูคาริโอตจึงได้ ATP น้อยกว่าโพรคาริโอตราว ${B.shuttle} โมเลกุล ทั้งที่สลายกลูโคสเท่ากัน?`,
          o:['เพราะยูคาริโอตมีไมโทคอนเดรียน้อยเกินไป',
             'เพราะ NADH จากไกลโคไลซิสเกิดในไซโทซอล ต้องเสียพลังงานขนส่งเข้าไปในไมโทคอนเดรียก่อน',
             'เพราะยูคาริโอตใช้ออกซิเจนน้อยกว่า',
             'เพราะเซลล์ยูคาริโอตมีขนาดใหญ่กว่า'],
          a:1, e:`ไกลโคไลซิสเกิดใน<b>ไซโทซอล</b> แต่ ETC อยู่ที่เยื่อชั้นในของไมโทคอนเดรีย NADH 2 โมเลกุลจากไกลโคไลซิสจึงต้องถูกส่งเข้าไปด้วย <b>ระบบขนส่ง (shuttle)</b> ซึ่งมีต้นทุนราว ${B.shuttle} ATP — ส่วนโพรคาริโอตไม่มีไมโทคอนเดรีย ทุกขั้นอยู่ในเซลล์เดียวกัน จึงไม่เสียต้นทุนนี้` } },
    { t:'<b>เมื่อออกซิเจนหมด</b><br>สลับเป็น <b>ไม่ใช้ออกซิเจน</b> แล้วดูว่ายอดรวมเหลือเท่าไร',
      test:(s,m)=> !s.aerobic,
      q:{ q:`เหตุใดเมื่อไม่มีออกซิเจน เซลล์จึงได้ ATP เพียง ${T_FERM} โมเลกุล ทั้งที่ยังมี NADH อยู่?`,
          o:['เพราะไกลโคไลซิสหยุดทำงาน','เพราะ NADH ส่งอิเล็กตรอนไม่ได้ (ไม่มีตัวรับสุดท้าย) จึงต้องนำไปคืนเป็น NAD⁺ ในการหมักแทน ไม่ได้ ATP เพิ่ม','เพราะไมโทคอนเดรียสลายตัว','เพราะกลูโคสไม่ถูกใช้'],
          a:1, e:`ไม่มี O₂ = ไม่มีตัวรับอิเล็กตรอนสุดท้าย ETC หยุด NADH จึงถูกใช้ในการหมักเพื่อคืนเป็น <b>NAD⁺</b> ให้ไกลโคไลซิสเดินต่อได้ — การหมักเองไม่ได้สร้าง ATP เพิ่ม ATP ทั้ง ${T_FERM} ยังมาจากไกลโคไลซิส` } },
    { t:`<b>ตัวเลขดั้งเดิม vs ปัจจุบัน</b><br>กลับไปใช้ออกซิเจน แล้วสลับเป็น <b>ค่าปัจจุบัน</b> — สังเกตว่ายอดรวมลดลงเหลือราว ${T_MOD}`,
      test:(s,m)=> s.aerobic && s.modern,
      q:{ q:`ทำไมตำราสมัยใหม่จึงบอกว่าได้ ATP ราว 30–32 ไม่ใช่ ${T_PRO} พอดี?`,
          o:['เพราะกลูโคสมีพลังงานน้อยลง',`เพราะการวัดจริงพบว่าต่อ NADH ได้ ~${B.perNADH_mod} และต่อ FADH₂ ได้ ~${B.perFADH2_mod} อีกทั้งมีการรั่วของ H⁺`,'เพราะไมโทคอนเดรียทำงานผิดพลาด','เพราะออกซิเจนไม่พอ'],
          a:1, e:`ตัวเลข ${T_PRO} เป็น <b>ค่าสูงสุดทางทฤษฎี</b> ค่าจริงต่ำกว่าเพราะอัตราส่วน H⁺/ATP ไม่ลงตัวพอดี มีการรั่วของโปรตอน และต้นทุนการขนส่งสาร ค่าที่ยอมรับกันจึงอยู่ราว <b>30–32</b>` } }
  ];
  let mi=0, wrongQ=0, answering=false;

  app.innerHTML = stageShell('ledger', `
    <div class="note">🎯 <b>ภารกิจ:</b> ปรับสวิตช์เพื่อรวมยอด ATP ต่อกลูโคส 1 โมเลกุล ในเงื่อนไขต่าง ๆ แล้วตอบคำถามอธิบาย</div>
    <div class="bar"><i id="pb" style="width:0%"></i></div>
    <div id="missionBox"></div>
    <div class="sim">
      <div class="specbox">
        <div class="tlabel">ออกซิเจน</div>
        <div class="toggle">
          <button id="aOn" class="on">ใช้ออกซิเจน (aerobic)</button>
          <button id="aOff">ไม่ใช้ (anaerobic)</button>
        </div>
        <div class="tlabel">ชนิดเซลล์</div>
        <div class="toggle">
          <button id="euk" class="on">ยูคาริโอต (${T_EUK})</button>
          <button id="pro">โพรคาริโอต (${T_PRO})</button>
        </div>
        <div class="tlabel">ตัวเลขที่ใช้คำนวณ</div>
        <div class="toggle">
          <button id="trad" class="on">ค่าดั้งเดิม (NADH=${B.perNADH_trad})</button>
          <button id="mod">ค่าปัจจุบัน (NADH=${B.perNADH_mod})</button>
        </div>
        <div class="note small" id="noteLine" style="margin:10px 0 0"></div>
      </div>
      <div>
        <table class="ledtable">
          <thead><tr><th>ขั้นตอน</th><th>ATP ตรง</th><th>จาก NADH</th><th>จาก FADH₂</th></tr></thead>
          <tbody id="ledbody"></tbody>
          <tfoot><tr><td>รวม ATP สุทธิ</td><td colspan="3" id="ledtot" style="text-align:right"></td></tr></tfoot>
        </table>
        <div class="totbox"><div class="k">ATP ต่อกลูโคส 1 โมเลกุล</div><div class="v" id="grand">0</div></div>
      </div>

    <div class="feedback" id="fb"></div>
    <div id="qbox"></div>
  `);
  const el=id=>document.getElementById(id), pb=el('pb'), fb=el('fb');
  function renderMission(){
    pb.style.width=(mi/MISSIONS.length*100)+'%';
    el('missionBox').innerHTML = mi<MISSIONS.length
      ? `<div class="note miss">🧪 <b>ภารกิจที่ ${mi+1}/${MISSIONS.length}</b><br>${MISSIONS[mi].t}</div>` : '';
  }
  function update(){
    const m=model(st);
    const pn = perNADH(st), pf = perFADH2(st);
    const rows = st.aerobic ? [
      ['ไกลโคไลซิส (ไซโทซอล)', B.glycoATP, pn+'×2', '—'],
      ['ออกซิไดซ์ไพรูเวต', '—', pn+'×2', '—'],
      ['วัฏจักรเครบส์', B.krebsATP, pn+'×6', pf+'×2'],
      ['ถ่ายทอดอิเล็กตรอน', '—', '↑ รวม', '↑ รวม']
    ] : [
      ['ไกลโคไลซิส (ไซโทซอล)', B.glycoATP, '0', '—'],
      ['การหมัก (คืน NAD⁺)', 0, '—', '—']
    ];
    el('ledbody').innerHTML = rows.map(r=>`<tr>
      <td>${r[0]}</td>
      <td class="${r[1]===0||r[1]==='—'?'zero':''}">${r[1]}</td>
      <td class="${r[2]==='—'||r[2]==='0'?'zero':''}">${r[2]}</td>
      <td class="${r[3]==='—'?'zero':''}">${r[3]}</td></tr>`).join('');
    el('ledtot').innerHTML = st.aerobic
      ? `ATP ตรง ${m.subst} + จาก NADH ${m.fromN} + จาก FADH₂ ${m.fromF}${st.euk?(' − ต้นทุนขนส่ง '+B.shuttle):''}`
      : `ATP ตรง ${B.glycoATP} + จาก ETC 0`;
    el('grand').textContent = m.total;
    el('noteLine').innerHTML = 'ℹ️ '+m.note;
    // เปิด/ปิดสวิตช์ชนิดเซลล์เมื่อไม่ใช้ออกซิเจน (ไม่มีผล)
    ['euk','pro'].forEach(id=>el(id).style.opacity = st.aerobic?1:.4);
    if(!answering && mi<MISSIONS.length && MISSIONS[mi].test(st,m)){
      answering=true; toast('🎉 เงื่อนไขภารกิจสำเร็จ!'); setTimeout(askQ,450);
    }
  }
  el('aOn').onclick=()=>{ st.aerobic=true; el('aOn').classList.add('on'); el('aOff').classList.remove('on'); update(); };
  el('aOff').onclick=()=>{ st.aerobic=false; el('aOff').classList.add('on'); el('aOn').classList.remove('on'); update(); };
  el('euk').onclick=()=>{ st.euk=true; el('euk').classList.add('on'); el('pro').classList.remove('on'); update(); };
  el('pro').onclick=()=>{ st.euk=false; el('pro').classList.add('on'); el('euk').classList.remove('on'); update(); };
  el('trad').onclick=()=>{ st.modern=false; el('trad').classList.add('on'); el('mod').classList.remove('on'); update(); };
  el('mod').onclick=()=>{ st.modern=true; el('mod').classList.add('on'); el('trad').classList.remove('on'); update(); };

      <div class="feedback" id="qfb"></div></div>`;
    box.scrollIntoView({behavior:'smooth',block:'center'});

          x.classList.add('disabled');
          if(j===q.a) x.classList.add('correct'); else if(j===i) x.classList.add('incorrect');
        });
        const f=box.querySelector('#qfb'); f.className='feedback show '+(ok?'good':'bad');
        f.innerHTML=(ok?'✅ ถูกต้อง — ':'❌ ยังไม่ใช่ — ')+q.e;
        setTimeout(()=>{ mi++; answering=false; box.innerHTML=''; renderMission(); update();
          if(mi>=MISSIONS.length) done(); }, ok?2600:4200);
      };
    });
  }
  function done(){
    const got = wrongQ===0?3:wrongQ===1?2:1;
    stageMiss=wrongQ; finishStage('ledger', got, 100-wrongQ*15, `
      <div class="note key">🟡 <b>บัญชี ATP ต่อกลูโคส 1 โมเลกุล (ค่าดั้งเดิม)</b><br>

      <div class="note">🔵 <b>ต่อยอด:</b> per NADH ≈ ${B.perNADH_trad} และ per FADH₂ ≈ ${B.perFADH2_trad} เป็นตัวเลขดั้งเดิม
        ปัจจุบันวัดได้ ~${B.perNADH_mod} และ ~${B.perFADH2_mod} ตามลำดับ (อัตราส่วน H⁺/ATP ไม่ลงตัวพอดี)</div>`);
  }
  renderMission(); update();
}

    <div class="note miss">👹 <b>ด่านบอส:</b> ${SC.length} สถานการณ์ ทดสอบว่าเข้าใจ “ทำไม” ไม่ใช่แค่ “คืออะไร” — ตอบถูกยิ่งมาก ยิ่งได้ดาวเยอะ</div>
    <div class="bar"><i id="pb" style="width:0%"></i></div>
    <div id="box"></div>
  `);
  const pb=document.getElementById('pb'), host=document.getElementById('box');
  function step(){
    pb.style.width=(i/SC.length*100)+'%';
    if(i>=SC.length){
      const got = right>=SC.length-1?3:right>=SC.length-3?2:right>=2?1:0;
      stageMiss=SC.length-right; finishStage('boss', got, right*17, `
        <div class="note key">🟡 <b>สรุปการหมัก (เมื่อไม่มีออกซิเจน)</b><br>
          <b>หมักกรดแลกติก</b> — ไพรูเวต → แลกเทต · ไม่ปล่อย CO₂ · ในกล้ามเนื้อคนและแบคทีเรียนมเปรี้ยว<br>
          <b>หมักแอลกอฮอล์</b> — ไพรูเวต → เอทานอล + CO₂ · ในยีสต์ (ทำขนมปัง เบียร์ ไวน์)<br>
          ทั้งคู่จุดประสงค์เดียวกันคือ<b>คืน NAD⁺</b> ให้ไกลโคไลซิสเดินต่อ — ไม่ได้ ATP เพิ่ม</div>
        <div class="note miss">🔴 <b>ระวังเข้าใจผิด:</b> “การหายใจระดับเซลล์” ≠ “การหายใจเข้าออก”
          — อย่างแรกคือการสลายกลูโคสเป็น ATP ในเซลล์ ส่วนอย่างหลังคือการแลกเปลี่ยนแก๊สที่ปอด</div>
        <div class="note">🔵 <b>ต่อยอด:</b> การหายใจแบบใช้ออกซิเจนให้ ATP มากกว่าการหมักเกือบ 20 เท่า
          จึงเป็นข้อได้เปรียบที่ทำให้สิ่งมีชีวิตที่ใช้ออกซิเจนครองโลก · <b>พืชก็หายใจตลอดเวลา</b>
          รากที่จมน้ำจึงขาด O₂ และเน่าได้ · ถ้า H⁺ รั่วกลับโดยไม่ผ่าน ATP synthase พลังงานจะออกมาเป็น<b>ความร้อน</b>แทน ATP</div>
        <div class="small muted">ตอบถูก ${right}/${SC.length} ข้อ</div>`);
      return;
    }
    const s=SC[i];
    host.innerHTML = `<div class="scene">
      <div class="small muted">สถานการณ์ ${i+1}/${SC.length}</div>
      <h3 style="margin:6px 0 4px">${s.icon} ${s.title}</h3>
      <p style="margin:0 0 6px;font-size:.92rem">${s.body}</p>
      <div style="font-weight:800;font-size:.95rem;margin-top:10px">${s.q}</div>
      <div class="opts">${s.o.map((o,j)=>`<div class="opt" data-i="${j}">${o}</div>`).join('')}</div>
      <div class="feedback" id="qfb"></div>
    </div>`;
    host.querySelectorAll('.opt').forEach(op=>{
      op.onclick=()=>{
        const j=+op.dataset.i, ok=j===s.a; if(ok) right++;
        host.querySelectorAll('.opt').forEach((x,k)=>{
          x.classList.add('disabled');
          if(k===s.a) x.classList.add('correct'); else if(k===j) x.classList.add('incorrect');
        });
        const f=host.querySelector('#qfb'); f.className='feedback show '+(ok?'good':'bad');
        f.innerHTML=(ok?'✅ ถูกต้อง! ':'❌ ยังไม่ใช่ ')+s.e+
          `<div style="margin-top:12px"><button class="btn primary sm" id="nx">${i===SC.length-1?'สรุปผล →':'สถานการณ์ถัดไป →'}</button></div>`;
        f.querySelector('#nx').onclick=()=>{ i++; step(); window.scrollTo({top:0,behavior:'smooth'}); };
      };
    });
  }
  step();
}

function renderCards(){
  const cats=[...new Set(CARDS.map(c=>c[0]))];
  let cat='ทั้งหมด', deck=[], idx=0, flipped=false;
  function build(){ deck=(cat==='ทั้งหมด'?CARDS:CARDS.filter(c=>c[0]===cat)); idx=0; flipped=false; }
  build();
  app.innerHTML = `
    <div class="stagehead">
      <div class="ic">🃏</div>
      <div style="flex:1;min-width:200px"><h2>การ์ดคำศัพท์</h2>
        <div class="sub">แตะการ์ดเพื่อพลิกดูความหมาย · ${CARDS.length} คำศัพท์ ไทย–อังกฤษ</div></div>
    </div>
    <div class="deckbar" id="deckbar">
      ${['ทั้งหมด',...cats].map(c=>`<button data-c="${c}" class="${c==='ทั้งหมด'?'on':''}">${c}</button>`).join('')}
    </div>
    <div class="fcstage"><div class="fc" id="fc"></div></div>
    <div class="fcnav">
      <button class="btn sm" id="prev">← ก่อนหน้า</button>
      <span class="count" id="count"></span>
      <button class="btn sm" id="next">ถัดไป →</button>
    </div>
    <div class="center" style="margin-top:12px">
      <button class="btn ghost sm" id="shuf">🔀 สลับการ์ด</button>
      <button class="btn primary sm" id="back">กลับแผนที่</button>
    </div>
    <div class="note" style="margin-top:20px">
      💡 <b>วิธีใช้ให้ได้ผล:</b> อ่านคำศัพท์แล้ว<b>พูดนิยามออกมาเองก่อน</b> จึงค่อยพลิกดูเฉลย (active recall)
    </div>`;
  const fc=document.getElementById('fc'), cnt=document.getElementById('count');
  function draw(){
    const c=deck[idx];
    if(!c){ fc.innerHTML='<div class="side front"><div class="term">ไม่มีการ์ดในหมวดนี้</div></div>'; return; }
    fc.classList.remove('flip'); flipped=false;
    fc.innerHTML = `
      <div class="side front">
        <div class="tag">${c[0]}</div><div class="term">${c[1]}</div><div class="en">${c[2]}</div>
        <div class="hint">แตะเพื่อพลิก ↻</div>
      </div>
      <div class="side back">
        <div class="tag">${c[1]} · ${c[2]}</div><div class="def">${c[3]}</div>
        <div class="hint">แตะเพื่อพลิกกลับ ↻</div>
      </div>`;
    cnt.textContent = `${idx+1} / ${deck.length}`;
  }
  fc.onclick=()=>{ flipped=!flipped; fc.classList.toggle('flip',flipped); };
  document.getElementById('prev').onclick=()=>{ idx=(idx-1+deck.length)%deck.length; draw(); };
  document.getElementById('next').onclick=()=>{ idx=(idx+1)%deck.length; draw(); };
  document.getElementById('shuf').onclick=()=>{ deck=shuffle(deck); idx=0; draw(); toast('สลับการ์ดแล้ว'); };
  document.getElementById('back').onclick=renderMap;
  document.querySelectorAll('#deckbar button').forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll('#deckbar button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); cat=b.dataset.c; build(); draw();
    };
  });
  document.addEventListener('keydown', function nav(e){
    if(!document.getElementById('fc')){ document.removeEventListener('keydown',nav); return; }
    if(e.key==='ArrowRight') document.getElementById('next')?.click();
    if(e.key==='ArrowLeft')  document.getElementById('prev')?.click();
    if(e.key===' '){ e.preventDefault(); fc.click(); }
  });
  draw(); window.scrollTo({top:0,behavior:'smooth'});
}

};
const MAX_STARS = STAGES.length * 3;
function certNeed(){ return Math.ceil(MAX_STARS * CERT.pass); }
function certPassed(){
  const allPlayed = STAGES.every(st => (S.stars[st.id]||0) > 0);
  return allPlayed && totalStars() >= certNeed();
}
function certName(){
  const j = (typeof getJoin==='function') ? getJoin() : null;
  return localStorage.getItem('resp-cert-name') || (j && j.name) || '';
}
function certCardHtml(){
  const need=certNeed(), got=totalStars(), ok=certPassed();
  const pct=Math.min(100, Math.round(got/need*100));
  return `<div class="card ${ok?'':'lockcard'}" style="margin-top:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
      border-color:${ok?'rgba(242,103,22,.5)':'var(--line)'}">
    <div style="font-size:2rem">${ok?'🏅':'🔒'}</div>
    <div style="flex:1;min-width:200px">
      <div style="font-weight:800">เกียรติบัตร${ok?' — ผ่านเกณฑ์แล้ว!':''}</div>
      <div class="small muted">${ok
        ? `เรียนครบทุกด่านและได้ ${got}/${MAX_STARS} ดาว (เกณฑ์ ${Math.round(CERT.pass*100)}% = ${need} ดาว) — ใส่ชื่อแล้วบันทึกเกียรติบัตรได้เลย`
        : `เล่นให้ครบทั้ง ${STAGES.length} ด่าน และเก็บดาวให้ถึง <b>${need}/${MAX_STARS}</b> ดาว (${Math.round(CERT.pass*100)}%) · ตอนนี้ได้ ${got} ดาว`}</div>
      ${ok?'':`<div class="certprog"><i style="width:${pct}%"></i></div>`}
    </div>
    <button class="btn ${ok?'gold':''}" id="btnCert" ${ok?'':'disabled'}>รับเกียรติบัตร</button>
  </div>`;
}

/* วาดเกียรติบัตรลงบนแคนวาส (ใช้ภาพของโรงเรียนถ้ามี ถ้าไม่มีจะวาดกรอบสำรองให้) */
function drawCert(canvas, name, img){
  const W = img ? img.naturalWidth : 2000, H = img ? img.naturalHeight : 1400;
  canvas.width = W; canvas.height = H;
  const c = canvas.getContext('2d');
  c.fillStyle = '#fff'; c.fillRect(0,0,W,H);
  if(img){ c.drawImage(img, 0, 0, W, H); }
  else { certFallback(c, W, H); }
  // ---- ชื่อผู้เรียน (ย่อขนาดอัตโนมัติจนพอดีกรอบ) ----
  const maxW = W * CERT.nameW;
  let size = W * CERT.nameSize;
  const font = px => `700 ${px}px "Sukhumvit Set","Noto Sans Thai","IBM Plex Sans Thai",sans-serif`;
  c.font = font(size);
  while(c.measureText(name).width > maxW && size > W*0.012){ size *= 0.95; c.font = font(size); }
  c.fillStyle = CERT.nameColor; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(name, W*CERT.nameX, H*CERT.nameY);
  return canvas;
}
/* กรอบสำรอง ใช้เมื่อยังไม่ได้วางไฟล์ cert-bg.png */
function certFallback(c, W, H){
  const g = c.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#FBF8EC'); g.addColorStop(1,'#EAE4C6');
  c.fillStyle = g; c.fillRect(0,0,W,H);
  c.strokeStyle = '#084A24'; c.lineWidth = W*0.012; c.strokeRect(W*0.03,H*0.04,W*0.94,H*0.92);
  c.strokeStyle = '#F26716'; c.lineWidth = W*0.004; c.strokeRect(W*0.045,H*0.062,W*0.91,H*0.876);
  c.textAlign='center'; c.fillStyle='#084A24';
  const f=(px,w=700)=>`${w} ${px}px "Sukhumvit Set","Noto Sans Thai",sans-serif`;
  c.font=f(W*0.045); c.fillText('เกียรติบัตรฉบับนี้ให้ไว้เพื่อแสดงว่า', W/2, H*0.30);
  c.font=f(W*0.03,400); c.fillStyle='#6B8A76';
  c.fillText('(ยังไม่ได้วางไฟล์ cert-bg.png จึงใช้กรอบสำรองชั่วคราว)', W/2, H*0.20);
  c.fillStyle='#04261E'; c.font=f(W*0.028,400);
  c.fillText('ได้ผ่านการเรียนรู้ผ่านสื่ออิเล็กทรอนิกส์ (e-learning)', W/2, H*0.63);
  c.fillStyle='#D6350B'; c.font=f(W*0.026);
  c.fillText('หน่วยที่ 3 เซลล์และการทำงานของเซลล์ เรื่อง การหายใจระดับเซลล์', W/2, H*0.70);
  c.fillStyle='#6B8A76'; c.font=f(W*0.022,400);
  c.fillText('ให้ไว้ ณ วันที่ ' + new Date().toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'}), W/2, H*0.80);
  // กรอบใส่ชื่อ
  const bx=W*0.5-W*0.26, by=H*CERT.nameY-H*0.055, bw=W*0.52, bh=H*0.11, r=bh/2;
  const gg=c.createLinearGradient(bx,0,bx+bw,0); gg.addColorStop(0,'#F7A8C4'); gg.addColorStop(1,'#F7C39C');
  c.fillStyle=gg; c.beginPath();
  c.moveTo(bx+r,by); c.arcTo(bx+bw,by,bx+bw,by+bh,r); c.arcTo(bx+bw,by+bh,bx,by+bh,r);
  c.arcTo(bx,by+bh,bx,by,r); c.arcTo(bx,by,bx+bw,by,r); c.closePath(); c.fill();
  c.strokeStyle='#2F7D4F'; c.lineWidth=W*0.003; c.stroke();
}

function renderCert(){
  if(!certPassed()){ toast('ยังไม่ผ่านเกณฑ์รับเกียรติบัตร'); return; }
  let img = null, nameNow = certName();
  app.innerHTML = `
    <div class="stagehead">
      <div class="ic" style="font-size:2rem">🏅</div>
      <div style="flex:1;min-width:200px"><h2>เกียรติบัตร</h2>
        <div class="sub">ผ่านเกณฑ์ ${Math.round(CERT.pass*100)}% แล้ว — ใส่ชื่อของตัวเองเพื่อรับเกียรติบัตร</div></div>
    </div>
    <div class="note key">🎓 ได้ <b>${totalStars()}/${MAX_STARS} ดาว</b> จากทั้ง ${STAGES.length} ด่าน
      (เกณฑ์ผ่าน ${certNeed()} ดาว) · พิมพ์ชื่อ–นามสกุลให้ถูกต้อง แล้วกดบันทึกภาพเก็บไว้ได้เลย</div>
    <div class="certform">
      <input id="cname" maxlength="60" placeholder="พิมพ์ชื่อ–นามสกุลของคุณ" value="${escHtml(nameNow)}">
      <button class="btn primary" id="cmake">ใส่ชื่อลงเกียรติบัตร</button>
    </div>
    <div class="certwrap"><canvas id="ccv"></canvas></div>
    <div class="certbar">
      <button class="btn gold" id="cdl">⬇️ บันทึกเป็นรูปภาพ</button>
      <button class="btn" id="copen">🔍 เปิดภาพเต็ม</button>
      <button class="btn ghost" id="cback">🗺️ กลับแผนที่</button>
    </div>
    <div class="note small" style="margin-top:14px">
      📱 <b>บนมือถือ:</b> ถ้ากดบันทึกแล้วไม่มีอะไรเกิดขึ้น ให้กด “เปิดภาพเต็ม” แล้ว<b>กดค้างที่ภาพ → บันทึกรูปภาพ</b>
    </div>`;
  const cv = document.getElementById('ccv'), inp = document.getElementById('cname');
  function paint(){
    const nm = (inp.value||'').trim();
    if(!nm){ toast('กรอกชื่อของคุณก่อน'); inp.focus(); return false; }
    localStorage.setItem('resp-cert-name', nm);
    drawCert(cv, nm, img);
    return true;
  }
  // โหลดภาพเกียรติบัตรของโรงเรียน ถ้าไม่มีก็ใช้กรอบสำรอง
  const im = new Image();
  im.onload = ()=>{ img = im; if(nameNow) paint(); else drawCert(cv,'',img); };
  im.onerror = ()=>{ img = null; drawCert(cv, nameNow||'', null); };
  im.src = CERT.src;

  document.getElementById('cmake').onclick = paint;
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') paint(); });
  document.getElementById('cdl').onclick = ()=>{
    if(!paint()) return;
    const nm = (inp.value||'').trim();
    cv.toBlob(b=>{
      const url = URL.createObjectURL(b);
      const a = document.createElement('a');
      a.href = url; a.download = `เกียรติบัตร-${nm}.png`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      toast('บันทึกเกียรติบัตรแล้ว 🎉');
    }, 'image/png');
  };
  document.getElementById('copen').onclick = ()=>{
    if(!paint()) return;
    cv.toBlob(b=>{ window.open(URL.createObjectURL(b), '_blank'); }, 'image/png');
  };
  document.getElementById('cback').onclick = renderMap;
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ================= ระบบชั้นเรียน =================
   ใช้ฐานข้อมูล Supabase ชุดเดียวกับเกมภารกิจพันธุกรรม/มหานครเซลล์ คะแนนจึงขึ้นแดชบอร์ดครูหน้าเดิม
   นักเรียนกรอกรหัสห้อง (เช่น M401A) + ชื่อ → จบด่านแล้วคะแนนวิ่งเข้าตาราง scores
   แถวของเกมนี้กำกับด้วยคอลัมน์ game = 'respiration' และเลขด่าน 31–36 เพื่อไม่ปนกับเกมอื่น
   ถ้าไม่เข้าร่วมห้องหรือเน็ตหลุด เกมยังเล่นได้ปกติ คะแนนจะพักไว้แล้วส่งเองเมื่อกลับมาออนไลน์ */
const SB_URL  = 'https://vgurqbcbovgeppvdwizr.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZndXJxYmNib3ZnZXBwdmR3aXpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MzUwMDcsImV4cCI6MjEwMjQxMTAwN30.MV-oJICUViNpDLjr7pdvxQr44XBhefHHlvlleW9bFUs';
const GAME_KEY   = 'respiration';   // ใช้แยกคะแนนของแต่ละเกมในแดชบอร์ด
const LEVEL_BASE = 30;              // ด่าน 1–6 ของเกมนี้ = เลข 31–36 ในตารางคะแนน

function getJoin(){ try{ return JSON.parse(localStorage.getItem('resp-class')||'null'); }catch(e){ return null; } }
function setJoin(o){ localStorage.setItem('resp-class', JSON.stringify(o)); }
function clearJoin(){ localStorage.removeItem('resp-class'); }
function newSid(){ return 'S'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function escHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---- คิวคะแนน กันเน็ตหลุด ---- */
function outbox(){ try{ return JSON.parse(localStorage.getItem('resp-outbox')||'[]'); }catch(e){ return []; } }
function setOutbox(q){ try{ localStorage.setItem('resp-outbox', JSON.stringify(q)); }catch(e){} }

async function pushRow(row){
  const r = await fetch(SB_URL+'/rest/v1/scores', {
    method:'POST',
    headers:{ 'apikey':SB_ANON, 'Authorization':'Bearer '+SB_ANON,
              'Content-Type':'application/json', 'Prefer':'return=minimal' },
    body: JSON.stringify(row)
  });
  if(!r.ok){
    let d=''; try{ d=(await r.text()).slice(0,140); }catch(e){}
    const err = new Error('http '+r.status+(d?' · '+d:'')); err.status = r.status; throw err;
  }
}
/* ส่งคะแนนที่ค้างอยู่ในคิว (เงียบ ๆ ไม่บล็อกการเล่น) */
async function flushPending(){
  const q = outbox(); if(!q.length) return;
  const keep = [];
  for(const row of q){
    try{ await pushRow(row); }
    catch(e){ keep.push(row); if(e.status===400 || e.status===404) break; }
  }
  setOutbox(keep.slice(-200));
}

/* ---- สร้างแถวคะแนนของด่านที่เพิ่งจบ แล้วส่งให้ครู ---- */
function sendScore(stageId, starsGot, misses, seconds){
  const j = getJoin(); if(!j || !j.room || !j.name) return;
  const idx = STAGES.findIndex(x=>x.id===stageId);
  const st  = STAGES[idx] || { title: stageId };
  const row = {
    uid: j.sid+'-'+stageId+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),
    room: j.room, student: String(j.name).trim().slice(0,60), sid: j.sid,
    game: GAME_KEY,
    level: LEVEL_BASE + (idx>=0?idx+1:9),
    level_name: 'หายใจ · ด่าน '+(idx+1)+' '+st.title,
    stars: starsGot, percent: Math.round(starsGot/3*100),
    score: starsGot, max_score: 3,
    seconds: Math.max(0, Math.min(seconds|0, 86400)),
    misses: Math.max(0, Math.min(misses|0, 9999)),
    total_stars: totalStars(),
    attempt: (S.plays && S.plays[stageId]) || 1,
    client_ts: new Date().toISOString()
  };
  const q = outbox(); q.push(row); setOutbox(q.slice(-200));
  flushPending();
}
/* ส่งดาวที่เคยได้ทั้งหมดตอนเพิ่งเข้าร่วมห้อง (นับเป็นครั้งที่ 1) */
function syncAllStars(){
  STAGES.forEach(st=>{
    const got = S.stars[st.id]||0; if(!got) return;
    sendScore(st.id, got, (S.miss&&S.miss[st.id])||0, (S.secs&&S.secs[st.id])||0);
  });
}

/* ---- ชิปสถานะชั้นเรียนบนหน้าแผนที่ ---- */
function renderClassChip(){
  const slot=document.getElementById('classSlot'); if(!slot) return;
  const j=getJoin();
  if(j && j.room){
    slot.innerHTML = `<div class="classchip joined">🏫 ห้อง: <b>${escHtml(j.room)}</b> · 👤 ${escHtml(j.name)} <span class="x" id="leaveClass" title="ออกจากห้อง">✕</span></div>`;
    slot.querySelector('#leaveClass').onclick=()=>{
      if(confirm('ออกจากชั้นเรียน? (คะแนนที่ส่งไปแล้วยังอยู่กับครู)')){ clearJoin(); renderClassChip(); toast('ออกจากห้องแล้ว'); }
    };
  }else{
    slot.innerHTML = `<div class="classchip" id="joinBtn">🏫 เข้าร่วมชั้นเรียน (ส่งคะแนนให้ครู)</div>`;
    slot.querySelector('#joinBtn').onclick=openJoinModal;
  }
}

function openJoinModal(){
  const j = getJoin() || {};
  const bg=document.createElement('div'); bg.className='modalbg';
  bg.innerHTML=`<div class="modal">
    <h3>🏫 เข้าร่วมชั้นเรียน</h3>
    <div class="msub">กรอกรหัสห้องที่ครูให้ และชื่อของคุณ เพื่อส่งคะแนนให้ครูเห็น</div>
    <label>รหัสห้อง</label><input id="jcode" maxlength="12" placeholder="เช่น M401A" autocomplete="off" autocapitalize="characters" value="${escHtml(j.room||'')}">
    <label>ชื่อของคุณ (หรือ ชื่อ-เลขที่)</label><input id="jname" maxlength="40" placeholder="เช่น สมชาย เลขที่ 12" autocomplete="off" value="${escHtml(j.name||'')}">
    <div class="mmsg" id="jmsg"></div>
    <div class="mrow"><button class="btn ghost" id="jcancel">ยกเลิก</button><button class="btn primary" id="jok">เข้าร่วม</button></div>
    <div style="margin-top:10px;font-size:.72rem;color:var(--muted);text-align:center">เก็บเฉพาะรหัสห้อง ชื่อที่กรอก และผลการเล่น (ด่าน ดาว เวลา) เพื่อให้ครูติดตามความก้าวหน้าเท่านั้น<br>
      <a href="../privacy/" target="_blank" rel="noopener" style="color:var(--green);font-weight:700">อ่านนโยบายความเป็นส่วนตัว</a></div>
  </div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.addEventListener('click',e=>{ if(e.target===bg) close(); });
  bg.querySelector('#jcancel').onclick=close;
  const codeEl=bg.querySelector('#jcode'), nameEl=bg.querySelector('#jname'), msg=bg.querySelector('#jmsg');
  bg.querySelector('#jok').onclick=()=>{
    const room=(codeEl.value||'').trim().toUpperCase(); const name=(nameEl.value||'').trim();
    if(!room){ msg.className='mmsg err'; msg.textContent='กรอกรหัสห้องที่ครูให้'; return; }
    if(!name){ msg.className='mmsg err'; msg.textContent='กรอกชื่อของคุณ'; return; }
    const prev=getJoin();
    setJoin({ room, name, sid:(prev&&prev.sid)||newSid() });
    close(); renderClassChip(); toast('เข้าร่วมห้อง '+room+' แล้ว');
    syncAllStars();
  };
  setTimeout(()=>codeEl.focus(),50);
}
